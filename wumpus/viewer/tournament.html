<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웜퍼스 워즈 토너먼트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 리플레이 뷰어 (viewer.html) 와 같은 색 · 글꼴: 어두운 동굴 갈색 바탕, 청동 테두리, 금빛 글자 */
:root{
  --bg:#0d0906; --panel:#16100b; --panel2:#1d150e; --line:#3b2b1a; --bronze:#8c6a3c; --bronze2:#c79a55;
  --text:#f6ecd6; --dim:#c4ae8c; --red:#ff5a48; --blue:#3ccaff; --gold:#e8b64a; --ok:#8fe08a; --win:#8fe08a; --hl:#ffd978;
  --box:#1e160e; --serif:"Cinzel","Noto Serif KR",serif; --kserif:"Noto Serif KR","Cinzel",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button,select{background:linear-gradient(#2a1e12,#1a120b);color:var(--text);border:1px solid #5a4126;border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.08)}
button:hover,select:hover{border-color:var(--bronze2);color:#fff3d6}
button:disabled{opacity:.45;cursor:default}
select{color-scheme:dark}select option{background:#1d150e;color:#efe3cb}select option:checked{background:#5a3f1c;color:#fff3d6}
button.main{font-weight:700;font-family:var(--kserif);border-color:var(--bronze2);background:linear-gradient(#5a3f1c,#2e2010)}
input{font:inherit;color:var(--text);background:#0f0a06;border:1px solid #4a3620;border-radius:4px;padding:6px 10px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
input:focus{outline:none;border-color:var(--bronze2)}
input::placeholder{color:#6f5e48}
#app{display:flex;flex-direction:column;height:100%;background:radial-gradient(1200px 500px at 50% -10%,rgba(199,154,85,.10),transparent 70%),var(--bg)}
/* ---- 머리 (뷰어와 같은 로고) ---- */
header{display:flex;align-items:center;gap:8px 16px;padding:9px 18px;position:relative;flex-wrap:wrap;
  background:linear-gradient(#1c140c,#120d08);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--bronze2),transparent);opacity:.7}
header button{white-space:nowrap}
.logo{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.logo .en{font-family:var(--serif);font-weight:800;font-size:21px;letter-spacing:.14em;
  background:linear-gradient(180deg,#fff0c2 0%,#e8b64a 45%,#9b6a24 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.logo .ko{font-family:var(--kserif);font-weight:600;font-size:13px;color:var(--bronze2);letter-spacing:.2em}
.logo .gem{width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,#ffe9a8,#b07a2c);box-shadow:0 0 8px rgba(232,182,74,.7);align-self:center}
header .sub{color:var(--dim);font-size:12.5px}
header .sp{flex:1}
.tabs{display:flex;gap:4px}
.tabs button{background:transparent;border-color:transparent;font-family:var(--kserif);font-weight:600;color:var(--dim);box-shadow:none}
.tabs button.on{color:#fff3d6;border-color:var(--bronze2);background:linear-gradient(#3a2a16,#1f160c)}
#bar{display:flex;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap;background:linear-gradient(#140e09,#100b07);border-bottom:1px solid var(--line)}
#bar button{white-space:nowrap}
#bar .grp{display:flex;gap:6px;align-items:center}
#zoomTxt{min-width:52px;text-align:center;color:var(--dim);font-family:var(--serif)}
#search{width:240px}
#prog{display:none;align-items:center;gap:12px;padding:8px 18px}
#prog .track{flex:1;height:10px;background:#080503;border-radius:2px;overflow:hidden;border:1px solid #5a4126;box-shadow:inset 0 2px 4px rgba(0,0,0,.7);margin:0;padding:0}
#prog .fill{height:100%;background:linear-gradient(90deg,#9b6a24,#e8b64a,#fff0c2);width:0}
#prog .txt{color:var(--dim);font-size:13px;min-width:280px;text-align:right}
main{flex:1;position:relative;min-height:0;margin:12px 18px 6px}
/* ---- 대진표 판 ---- */
#wrap{position:absolute;inset:0;border:1px solid var(--bronze);border-radius:6px;overflow:hidden;cursor:grab;
  background:radial-gradient(rgba(140,106,60,.16) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(#18110b,#130d08);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 3px rgba(140,106,60,.18),inset 0 0 120px rgba(0,0,0,.6)}
#wrap.drag{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.colh{position:absolute;top:12px;height:28px;border:1px solid #6b5236;background:linear-gradient(#2a1e12,#1a120b);color:#f0c674;
  font-family:var(--serif);font-size:12.5px;font-weight:800;letter-spacing:.14em;padding:5px 10px;border-radius:3px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden}
.colh:hover{color:#fff3d6;border-color:var(--bronze2)}
.sect{position:absolute;font-family:var(--kserif);font-size:15px;color:#ffd978;font-weight:800;letter-spacing:.12em;display:flex;align-items:center;gap:7px}
.sect::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--bronze2)}
.m{position:absolute;width:220px;background:linear-gradient(#2a1f13,#21180e);border:1px solid #7a5d36;border-radius:4px;cursor:pointer;font-size:13.5px;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.06),0 2px 8px rgba(0,0,0,.45)}
.m:hover{border-color:var(--bronze2)}
.m .r{display:flex;align-items:center;height:24px;padding:0 7px;gap:6px;color:var(--text)}
.m .r+.r{border-top:1px solid #4a3620}
.m .sd{color:#d0b48a;font-size:11.5px;width:28px;font-family:var(--serif);font-weight:600}
.m .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.m .sc{width:26px;text-align:right;color:#ffd978;font-family:var(--serif);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.m .w .nm,.m .w .sc{color:var(--win);font-weight:700}
.m .tbd .nm{color:#c4ae8c;font-style:italic;font-weight:400}
.m .bye .nm,.m .bye .sd,.m .bye .sc{color:#9c8667;font-weight:400}
.m.byem{background:linear-gradient(#1f170e,#1a130b);border-color:#5a4126}
.m .no{position:absolute;left:-28px;top:16px;font-size:12px;color:#d0b48a;width:24px;text-align:right;font-family:var(--serif);font-weight:700}
.m.hid{background:linear-gradient(#221910,#1b140c);border-style:dashed;border-color:#b08850}.m.hid .sc{color:#e8c98e}
.m.run{border-color:var(--blue)}.m.run .sc{color:var(--blue)}
.m.hl{outline:2px solid var(--hl);outline-offset:1px;box-shadow:0 0 18px -4px rgba(232,182,74,.7)}
.m.dim{opacity:.32}
.m .lock{position:absolute;right:-8px;top:-9px;background:linear-gradient(#5a3f1c,#2e2010);color:#ffd978;border:1px solid var(--bronze2);border-radius:3px;font-size:10px;padding:0 5px;font-family:var(--kserif)}
svg#lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg#lines path{fill:none;stroke:#a88152;stroke-width:1.8}
svg#lines path.hl{stroke:var(--hl);stroke-width:3}
svg#lines path.drop{stroke-dasharray:3 3}
footer{padding:5px 18px 9px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);background:linear-gradient(#120d08,#1a130c)}
/* ---- 오른쪽 서랍 ---- */
#drawer{position:fixed;right:0;top:0;bottom:0;width:560px;max-width:100%;background:linear-gradient(#150f0a,#110c08);border-left:1px solid var(--bronze);
  box-shadow:-12px 0 30px rgba(0,0,0,.6);transform:translateX(100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;background:linear-gradient(#1c140c,#120d08)}
#drawer .hd h2{margin:0;font-size:16px;font-family:var(--kserif);color:#fff3d6;letter-spacing:.04em}#drawer .hd .sub{color:var(--dim);font-size:12px;margin-top:3px}
#drawer .bd{padding:14px 18px;overflow:auto;flex:1}
#drawer h3{font-family:var(--kserif);color:var(--bronze2);letter-spacing:.1em;font-size:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:14px}
.vs .t{background:linear-gradient(#1e160e,#18110b);border:1px solid #4a3620;border-radius:5px;padding:10px 12px}
.vs .t .n{font-family:var(--kserif);font-weight:800;font-size:15px}.vs .t .s{color:var(--dim);font-size:12px}
.vs .big{font-family:var(--serif);font-size:30px;font-weight:800;color:#ffd978;text-shadow:0 0 14px rgba(232,182,74,.45);font-variant-numeric:tabular-nums}
.vs .t.win{border-color:#4d7a42}.vs .t.win .n{color:var(--win)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{color:var(--bronze2);font-family:var(--kserif);font-weight:600;letter-spacing:.06em;text-align:left;padding:7px 6px;border-bottom:1px solid #5a4126;position:sticky;top:0;background:#16100b}
td{padding:7px 6px;border-bottom:1px solid #3a2b1a;color:var(--text)}
td.n{font-variant-numeric:tabular-nums;text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:#22180e}
.pill{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;background:#2e2214;border:1px solid #6b5236;color:var(--text)}
.pill.w{background:#1d3318;border-color:#4f8a43;color:var(--win);font-weight:700}.pill.r{color:var(--red)}.pill.b{color:var(--blue)}
.play{padding:3px 9px;font-size:12px}
details summary{color:var(--bronze2)}
/* ---- 리플레이 ---- */
#rv{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
#rv.on{display:flex}
#rv .top{display:flex;align-items:center;gap:10px;padding:7px 12px;background:linear-gradient(#1c140c,#120d08);border-bottom:1px solid var(--line)}
#rv .top .ttl{flex:1;font-weight:600;font-family:var(--kserif);color:#fff3d6}
#rv .top .ttl{display:flex;align-items:baseline;white-space:nowrap;overflow:hidden;min-width:0}
#rv .top .ttl .meta{font-size:13px;color:#cdbb9c;margin-right:14px;font-family:inherit;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0}
#rv .top .ttl .tr,#rv .top .ttl .tb{font-size:21px;font-weight:800;text-shadow:0 1px 0 #000}
#rv .top .ttl .tr{color:#ff4a3a}
#rv .top .ttl .tb{color:#2ec4ff}
#rv .top .ttl .vs{margin:0 10px;color:#cdbb9c;font-size:14px}
#rv iframe{flex:1;border:0;width:100%;background:#000}
/* ---- 예선 · 순위 표 ---- */
#swiss,#places{position:absolute;inset:0;overflow:auto;display:none;background:linear-gradient(#150f0a,#110c08);border:1px solid var(--bronze);border-radius:6px;padding:6px 14px;
  box-shadow:inset 0 0 0 3px rgba(140,106,60,.18)}
#swiss h3,#places h3{font-family:var(--kserif);color:var(--gold);letter-spacing:.06em}
#places tr.hlrow td{background:#3a2a16}
#swiss td.rd{white-space:nowrap;cursor:pointer;color:var(--text)}#swiss td.rd:hover{background:#22180e}
#swiss td.rd .wn{color:var(--win);font-weight:800}#swiss td.rd .ls{color:#ff9a88;font-weight:700}
/* ---- 시작 화면 ---- */
#home{position:absolute;inset:0;overflow:auto;display:none;padding:12px 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;max-width:1200px}
.card{background:linear-gradient(#1e160e,#18110b);border:1px solid #4a3620;border-radius:5px;padding:16px 18px;box-shadow:inset 0 1px 0 rgba(255,220,150,.06)}
.card h3{margin:0 0 12px;font-family:var(--kserif);font-size:14px;color:var(--bronze2);font-weight:700;letter-spacing:.12em;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--bronze2)}
.card h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#5a4126,transparent)}
.card h3 b{color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row label{width:120px;color:var(--dim)}.row input{flex:1}
.row input.short{flex:0 0 90px}
.note{color:var(--dim);font-size:13px;margin:6px 0}
.scan{max-height:240px;overflow:auto;border:1px solid #4a3620;border-radius:4px;margin-top:10px;font-size:12px;background:#110c08}
.scan div{padding:4px 10px;border-bottom:1px solid #2a1f13}.scan .bad{color:#f08a7a}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:linear-gradient(#2a1e12,#1a120b);border:1px solid var(--bronze2);padding:10px 16px;border-radius:4px;display:none;z-index:60;color:#fff3d6}
#status{color:var(--dim);font-size:12px;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{margin-top:10px;background:linear-gradient(#1e160e,#18110b);border:1px solid #4a3620;border-left:3px solid var(--bronze2);border-radius:3px;padding:10px 12px;font-size:13px}
.track div{padding:2px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="gem"></span><span class="en">WUMPUS WARS</span><span class="ko">토너먼트</span></div>
    <span class="sub" id="tname"></span>
    <div class="tabs" id="tabs">
      <button data-tab="bracket" class="on">본선 대진표</button>
      <button data-tab="swiss">스위스 예선</button>
      <button data-tab="places">최종 순위</button>
    </div>
    <span class="sp"></span>
    <span id="status"></span>
    <button id="bHome" style="display:none">처음 화면</button>
    <button id="bPack" style="display:none">zip 내보내기</button>
  </header>
  <div id="bar">
    <button id="bRefresh">⟳ 새로고침</button>
    <input id="search" list="names" placeholder="팀 (학생) 이름 검색…">
    <datalist id="names"></datalist>
    <button id="bExpand">라운드 모두 펼치기</button>
    <div class="grp"><span class="note">공개 범위</span><select id="hideSel"></select></div>
    <span class="sp" style="flex:1"></span>
    <div class="grp"><button id="bOut">−</button><span id="zoomTxt">100%</span><button id="bIn">+</button></div>
    <button id="bFit">대진표 맞추기</button>
    <button id="bReset">보기 초기화</button>
    <button id="bFull" title="전체 화면">⛶</button>
  </div>
  <div id="prog"><div class="track"><div class="fill" id="pfill"></div></div><div class="txt" id="ptxt"></div><button id="bStop">멈추기</button></div>
  <main>
    <div id="wrap"><div id="canvas"><svg id="lines"></svg></div></div>
    <div id="swiss"></div>
    <div id="places"></div>
    <div id="home">
      <div class="cards">
        <div class="card">
          <h3>새 토너먼트 <b>만들기</b></h3>
          <div class="row"><label>봇 폴더</label><input id="hBots" placeholder="학생 봇 폴더 (이름.py 파일들, 또는 이름/main.py)"><button id="hPickBots">찾아보기</button></div>
          <div class="row"><label>토너먼트 이름</label><input id="hName" placeholder="예: 2026 가을 웜퍼스 워즈"></div>
          <div class="row"><label>저장할 곳</label><input id="hOut" placeholder="토너먼트 폴더를 만들 곳"><button id="hPickOut">찾아보기</button></div>
          <div class="row"><label>맵 수 · 예선 라운드</label><input id="hMaps" class="short" type="number" value="21" min="1" max="99"><input id="hRounds" class="short" type="number" value="7" min="1" max="20"><span class="note">맵은 시작할 때 새로 만든다</span></div>
          <div class="row"><label>동시 경기 수</label><input id="hJobs" class="short" type="number" min="1" max="64"><span class="note">CPU 코어 수 − 2 를 권함</span></div>
          <div class="row"><button id="hScan">봇 확인</button><button id="hStart" class="main" disabled>토너먼트 시작</button><span class="note" id="hEst"></span></div>
          <div class="scan" id="hScanOut" style="display:none"></div>
        </div>
        <div class="card">
          <h3>토너먼트 <b>불러오기</b></h3>
          <div class="note">만든 토너먼트 폴더, 또는 내보낸 zip 을 연다. 멈춘 토너먼트는 이어서 돌릴 수 있다.</div>
          <div class="row"><input id="hOpen" placeholder="토너먼트 폴더 또는 .zip"><button id="hPickOpen">폴더</button><button id="hPickZip">zip</button></div>
          <div class="row"><button id="hLoad" class="main">열기</button></div>
          <h3 style="margin-top:18px">최근 토너먼트</h3>
          <div id="hRecent" class="scan" style="max-height:300px"></div>
        </div>
      </div>
    </div>
  </main>
  <footer>끌어서 이동 · 휠로 확대 · 라운드 제목을 누르면 접힌다 · 경기를 누르면 판마다 결과와 리플레이</footer>
</div>
<div id="drawer"><div class="hd"><div style="flex:1"><h2 id="dTitle"></h2><div class="sub" id="dSub"></div></div><button id="dClose">닫기</button></div><div class="bd" id="dBody"></div></div>
<div id="rv"><div class="top"><button id="rPrev">◀ 이전 판</button><span class="ttl" id="rTitle"></span><button id="rNext">다음 판 ▶</button><button id="rClose">닫기 ✕</button></div><iframe id="rFrame"></iframe></div>
<div id="toast"></div>
<script src="data.js" onerror="void 0"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=window.TOURNAMENT||null, APP=false, BASE='', live=null;
const COLW=275, BOXW=220, BOXH=50, ROWH=64, TOP=56, LEFT=40;
let Z=1, PX=0, PY=0, collapsed=new Set(), hideCol=Infinity, revealed=new Set(), revealedGames=new Set(), hlTeam=null;
function toast(t,ms=2600){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms);}
function key(k){return 'ww-t-'+(D&&D.config.id)+'-'+k;}
function loadPrefs(){try{revealed=new Set(JSON.parse(localStorage.getItem(key('rev'))||'[]'));}catch(_){revealed=new Set();}
  try{revealedGames=new Set(JSON.parse(localStorage.getItem(key('revg'))||'[]'));}catch(_){revealedGames=new Set();}
  let h=null;try{h=localStorage.getItem(key('hide'));}catch(_){}
  hideCol=h!==null?+h:hideColForTeams(D.hide==null?'all':D.hide);}
function savePrefs(){try{localStorage.setItem(key('rev'),JSON.stringify([...revealed]));localStorage.setItem(key('revg'),JSON.stringify([...revealedGames]));localStorage.setItem(key('hide'),String(hideCol));}catch(_){}}
const TEAM=t=>t==null||t<0?null:D.config.teams[t];
const seedOf=t=>D.seeds?D.seeds.indexOf(t)+1:0;

// ---------- 대진 정보 ----------
const M=()=>D.bracket?D.bracket.matches:{};
// Cambridge 배치: 열 = 실제 라운드. 승자조는 그 패자가 내려갈 패자조 라운드 바로 앞 열 (두 라운드에 한 번),
// 패자조는 매 라운드. 부전승 경기도 그린다 (— Bye). 화면이 열 때 계산하므로 예전에 만든 토너먼트도 같은 모양이 된다
function prepBracket(){const B=D.bracket,k=B.k,ms=B.matches;
  for(const m of Object.values(ms)){delete m._e;m.col=m.br==='W'?(m.rnd===1?1:2*m.rnd-2):m.br==='L'?m.rnd+1:m.br==='GF'?2*k:2*k+1;}
  let slot=0;                                   // 세로 자리: 나무 모양 (잎은 차례로, 안쪽은 자식들의 가운데)
  const lay=(id,br)=>{const m=ms[id];const ys=m.src.filter(s=>s.win&&ms[s.win].br===br).map(s=>lay(s.win,br));
    m.y=ys.length?ys.reduce((a,b)=>a+b,0)/ys.length:slot++;return m.y;};
  const wf=B.wb[B.wb.length-1][0];lay(wf,'W');B.wb_rows=slot;slot+=0.8;
  if(B.lb.length)lay(B.lb[B.lb.length-1][0],'L');B.rows=slot;
  ms.GF.y=ms[wf].y;ms.GF2.y=ms[wf].y;}
function shown(){return Object.values(M());}
function stageName(m){const k=D.bracket.k;if(m.br==='GF')return '그랜드 파이널';if(m.br==='GF2')return '결승 리셋';
  if(m.br==='W'){const t=D.bracket.size>>(m.rnd-1);return m.rnd===k?'승자조 결승':'승자조 '+m.rnd+' 라운드 ('+t+'강)';}
  const last=D.bracket.lb.length;return m.rnd===last?'패자조 결승':'패자조 '+m.rnd+' 라운드';}
// 결과와 상관없이 빈 자리 (Bye): 시드가 팀 수보다 크거나, 앞 경기가 부전승이라 패자가 없을 때
function emptySlot(s){if('seed' in s)return s.seed>D.bracket.n;const m=M()[s.win||s.lose];
  if(m._e===undefined){const a=emptySlot(m.src[0]),b=emptySlot(m.src[1]);m._e=[a&&b,a||b];}return s.win?m._e[0]:m._e[1];}
function isBye(m){return m.br!=='GF2'&&m.src.some(emptySlot);}
function isHidden(m){return !isBye(m)&&m.col>=hideCol&&!revealed.has(m.id);}
// 결승 리셋이 열리는지는 그랜드 파이널 결과다 → 그랜드 파이널이 숨겨져 있으면 리셋 칸도 '?'
function resetVeiled(m){return m.br==='GF2'&&(isHidden(M().GF)||!done(M().GF));}
function done(m){return m.winner!==undefined&&m.winner!==null&&!isBye(m)&&!m.bye&&!m.skip;}
// 자리의 팀이 보이는가: 시드는 늘, 경기에서 온 팀은 그 경기 (부전승이면 그 앞) 가 공개됐을 때
function slotVisible(slot){if('seed' in slot)return true;const src=M()[slot.win||slot.lose];if(!src)return false;
  if(isBye(src))return src.src.filter(s=>!emptySlot(s)).every(slotVisible);
  if(src.winner===undefined)return false;return !isHidden(src);}
// -1: Bye · undefined: 아직 모름 또는 숨김 · 숫자: 팀
function slotTeam(m,i){if(emptySlot(m.src[i]))return -1;const t=m.teams?m.teams[i]:null;if(t==null||t<0)return undefined;return slotVisible(m.src[i])?t:undefined;}
function slotHint(m,i){const s=m.src[i];if('seed' in s)return '시드 #'+s.seed;const src=M()[s.win||s.lose];
  if(m.teams&&m.teams[i]!=null&&m.teams[i]>=0)return '? (숨김)';return (s.win?'승자: ':'패자: ')+'M'+src.no;}

// ---------- 그리기 ----------
function colInfo(){const ms=shown();const cols=[...new Set(ms.map(m=>m.col))].sort((a,b)=>a-b);
  const X={};let x=LEFT;for(const c of cols){X[c]=x;x+=collapsed.has(c)?48:COLW;}return {cols,X,width:x};}
function yPx(m){return TOP+30+m.y*ROWH;}
function render(){

  const ms=shown().sort((a,b)=>a.col-b.col||(a.br==='W'?0:a.br==='L'?1:2)-(b.br==='W'?0:b.br==='L'?1:2)||a.y-b.y);

  h+=`<div class="sect" style="left:${LEFT}px;top:${TOP+4}px">승자조</div>`;
  h+=`<div class="sect" style="left:${LEFT}px;top:${TOP+30+(D.bracket.wb_rows+.1)*ROWH}px">패자조</div>`;

      if(t===-1)return `<div class="r bye"><span class="sd">—</span><span class="nm">Bye</span><span class="sc">-</span></div>`;
      if(t===undefined)return `<div class="r tbd"><span class="sd"></span><span class="nm">${esc(slotHint(m,i))}</span><span class="sc">${bye?'-':fin&&hid?'?':''}</span></div>`;
      const tm=TEAM(t);const w=bye?m.winner===t:(fin&&!hid&&m.winner===t);const sc=bye?'-':fin?(hid?'?':m.score[i]):(run&&!hid?liveScore(m,i):'');
      return `<div class="r${w?' w':''}"><span class="sd">#${seedOf(t)}</span><span class="nm">${esc(tm.name)}</span><span class="sc">${sc}</span></div>`;}).join('');
    const has=hlTeam!=null&&m.teams&&[0,1].some(i=>slotTeam(m,i)===hlTeam);
    const cls='m'+(bye?' byem':'')+(hid||veil?' hid':'')+(run?' run':'')+(has?' hl':'')+(hlTeam!=null&&!has?' dim':'');

  // 선: 이긴 팀이 올라가는 길은 실선, 승자조에서 내려오는 패자는 왼쪽의 짧은 점선

    m.src.forEach((s,i)=>{const yy=yPx(m)+(i?BOXH*0.75:BOXH*0.25);
      if(s.lose&&M()[s.lose].br!==m.br&&m.br==='L'){p+=`<path class="drop" d="M${x2-22} ${yy}H${x2}"/>`;return;}
      if(!s.win)return;const a=M()[s.win];if(!a||collapsed.has(a.col))return;
      if(a.br!==m.br&&!(m.br==='GF'||m.br==='GF2'))return;

      const on=hlTeam!=null&&a.winner===hlTeam&&!isHidden(a);

  $('canvas').innerHTML=`<svg id="lines" width="${width+300}" height="${TOP+60+D.bracket.rows*ROWH}">${p}</svg>`+h;
  $('canvas').style.width=(width+300)+'px';$('canvas').style.height=(TOP+80+D.bracket.rows*ROWH)+'px';
  applyZoom();if(tab==='places')renderPlaces();
}
function liveScore(m,i){let a=0,b=0;for(const gid of m.games){const g=D.games[gid];if(!g||g.w===undefined)continue;
    const wt=g.w===0?g.r:g.w===1?g.b:null;if(wt===m.teams[0])a++;else if(wt===m.teams[1])b++;}return i?b:a;}
function applyZoom(){$('canvas').style.transform=`translate(${PX}px,${PY}px) scale(${Z})`;$('zoomTxt').textContent=Math.round(Z*100)+'%';}
function fit(){const c=$('canvas'),w=$('wrap');if(!w.clientWidth)return;const cw=parseFloat(c.style.width)||1000,ch=parseFloat(c.style.height)||600;

// ---------- 검색 ----------
function buildNames(){$('names').innerHTML=D?D.config.teams.map(t=>`<option value="${esc(t.name)}">`).join(''):'';}
$('search').addEventListener('change',doSearch);$('search').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();if(e.key==='Escape'){e.target.value='';doSearch();}});
function doSearch(){const q=$('search').value.trim().toLowerCase();if(!q||!D){hlTeam=null;render();return;}

let curList=[];
function openMatch(m){if(!m)return;const hid=isHidden(m);

  else if(m.games){curList=m.games.slice();const full='<table><tr><th class="n">#</th><th>맵</th><th>붉은 진영</th><th>푸른 진영</th><th>승자</th><th class="n">바친 금</th><th></th></tr>'+m.games.map((g,i)=>gameRow(g,i+1,hid,ts)).join('')+'</table>';

  const a=$('bHideAgain');if(a)a.onclick=()=>{revealed.delete(m.id);m.games&&m.games.forEach(g=>revealedGames.delete(g));savePrefs();render();openMatch(m);};
  $('dBody').querySelectorAll('button.revg').forEach(b=>b.onclick=()=>{revealedGames.add(b.dataset.rg);const bb=bo5(m);
    if(bb&&bb.list.every(g=>revealedGames.has(g)))revealed.add(m.id);savePrefs();render();renderSwiss();openMatch(m);});
  bindPlay(hid,m);}
function bindPlay(hid,m){$('dBody').querySelectorAll('button.play[data-g]').forEach(b=>b.onclick=()=>{const b5=m&&b.dataset.list==='bo5'?bo5(m):null;openReplay(b.dataset.g,hid,b5?b5.list:null);});}

// ---------- 대표 5판 (5판 3선으로 보여 주기) ----------
// 21판 결과와 같은 승자가 나오도록: 승자의 승리 3판 + 패자의 승리 2판 (모자라면 무승부 · 승자 승리로 채움).
// 그중 바친 금 차이가 작은 (접전) 판부터. 순서는 패 · 승 · 패 · 승 · 승 → 가능하면 2:2 에서 마지막 판이 승부를 가른다
function bo5(m){if(!m.games||!done(m))return null;const W_=m.winner,L_=m.loser;
  const info=m.games.map(gid=>{const g=D.games[gid];const wt=g.w===0?g.r:g.w===1?g.b:null;return {gid,wt,margin:Math.abs((g.s||[0,0])[0]-(g.s||[0,0])[1])};});
  const by=f=>info.filter(f).sort((a,b)=>a.margin-b.margin||(a.gid<b.gid?-1:1));
  const ws=by(x=>x.wt===W_),ls=by(x=>x.wt===L_),ds=by(x=>x.wt==null);
  const nW=Math.min(3,ws.length),nL=Math.min(2,ls.length);
  const pickW=ws.slice(0,nW),pickL=ls.slice(0,nL);let fill=[...ds,...ws.slice(nW),...ls.slice(nL)].slice(0,5-nW-nL);   // 늘 5판 (판이 5개보다 적을 때만 그보다 적다)
  const pool={L:[...pickL],W:[...pickW],F:[...fill]},order=[];
  for(const want of ['L','W','L','W','W']){const x=pool[want].shift()||pool.F.shift()||pool.W.shift()||pool.L.shift();if(x)order.push(x);}
  // 마지막 판은 승자의 승리 (승부를 가르는 판)
  const lastW=order.map(x=>x.wt).lastIndexOf(W_);if(lastW>=0&&lastW!==order.length-1){const x=order.splice(lastW,1)[0];order.push(x);}
  return {list:order.slice(0,5).map(x=>x.gid),short:nW<3};}
function bo5Html(m,hid,ts){const b=bo5(m);if(!b)return '';
  let a=0,c=0,open=0;const rows=b.list.map((gid,i)=>{const g=D.games[gid],mp=D.config.maps[g.m];const gh=hid&&!revealedGames.has(gid);
    const wt=g.w===0?g.r:g.w===1?g.b:null;if(!gh){open++;if(wt===ts[0])a++;else if(wt===ts[1])c++;}
    const res=gh?`<span class="pill">???</span> <button class="play revg" data-rg="${gid}">이 판 공개</button>`:wt==null?'<span class="pill">무승부</span>':`<span class="pill w">${esc(TEAM(wt).name)}</span>`;
    return `<tr><td class="n">${i+1}</td><td title="${esc(mp.name)}">${esc(mp.name.split('_')[0])} <span class="note">${mp.w}×${mp.h}</span></td><td>${esc(TEAM(g.r).name)} <span class="note">붉은</span></td><td>${res}</td><td><button class="play" data-g="${gid}" data-list="bo5">▶ 보기</button></td></tr>`;}).join('');
  return `<h3 style="margin:14px 0 6px">대표 5판 <span class="note">(5판 3선으로 보여 주기 · 21판과 같은 승자)</span></h3>
    <div class="vs" style="margin-bottom:8px"><div class="t"><div class="n">${esc(TEAM(ts[0]).name)}</div></div><div class="big">${a} : ${c}</div><div class="t" style="text-align:right"><div class="n">${esc(TEAM(ts[1]).name)}</div></div></div>
    <table><tr><th class="n">#</th><th>맵</th><th>붉은 진영</th><th>이긴 팀</th><th></th></tr>${rows}</table>
    ${b.short?'<div class="note">이 경기는 21판에서 승자의 승리가 3판보다 적어 (이긴 판 수가 같거나 거의 같아 바친 금 · 시드로 결정) 5판 안에 무승부가 섞인다.</div>':''}
    ${hid&&open<b.list.length?'<div class="note">한 판씩 리플레이를 보고 "이 판 공개". 다섯 판을 다 열면 이 경기 결과도 공개된다.</div>':''}`;}

// ---------- 리플레이 ----------
let rvList=[],rvIdx=0,rvHid=false,frameReady=null;
window.__wwReplay=async(gid,b64)=>{const want=window.__wwWant;if(want!==gid)return;
  try{const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const rep=JSON.parse(txt);await frameReady;$('rFrame').contentWindow.postMessage({type:'wumpus-replay',replay:rep},'*');}
  catch(e){toast('리플레이를 열 수 없습니다: '+e.message,5000);}};
function openReplay(gid,hid,list){rvList=list||(curList.length?curList:[gid]);rvIdx=Math.max(0,rvList.indexOf(gid));rvHid=hid;
  const f=$('rFrame');if(!f.src){frameReady=new Promise(r=>f.onload=()=>setTimeout(r,400));f.src=BASE+'viewer.html';}
  $('rv').classList.add('on');showGame();}
function showGame(){const gid=rvList[rvIdx],g=D.games[gid],mp=D.config.maps[g.m];
  $('rTitle').innerHTML=`<span class="meta">${esc(gid)} · ${rvIdx+1}/${rvList.length}판 · 맵 ${esc(mp.name)}</span><span class="tr">${esc(TEAM(g.r).name)}</span><span class="vs">vs</span><span class="tb">${esc(TEAM(g.b).name)}</span>`;
  $('rPrev').disabled=rvIdx<=0;$('rNext').disabled=rvIdx>=rvList.length-1;
  window.__wwWant=gid;const s=document.createElement('script');s.src=BASE+'replays/'+gid+'.js'+(APP?'?t='+Date.now():'');
  s.onerror=()=>toast('리플레이 파일이 없습니다: '+gid);s.onload=()=>s.remove();document.body.appendChild(s);}
$('rPrev').onclick=()=>{if(rvIdx>0){rvIdx--;showGame();}};$('rNext').onclick=()=>{if(rvIdx<rvList.length-1){rvIdx++;showGame();}};
$('rClose').onclick=()=>$('rv').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('rv').classList.contains('on'))$('rv').classList.remove('on');else $('drawer').classList.remove('on');}});

// ---------- 스위스 예선 ----------
function renderSwiss(){const el=$('swiss');if(!D){el.innerHTML='';return;}
  const R=D.swiss||[],st=D.standings||[];
  let h=`<h3 style="margin:10px 0">스위스 예선 · ${R.length}/${D.config.swiss_rounds} 라운드 · 짝마다 맵 하나를 양쪽 진영으로 두 판 (판 승 1점 · 무 0.5 · 부전승 1)</h3>`;
  h+='<table><tr><th class="n">순위</th><th>팀</th><th class="n">점수</th><th class="n">승-무-패</th><th class="n">상대 점수 합</th><th class="n">바친 금</th>'+R.map((_,i)=>`<th>R${i+1}</th>`).join('')+'</tr>';
  const cell={};R.forEach((rnd,ri)=>rnd.forEach((p,pi)=>{cell[p.a+'-'+ri]={p,ri,pi};if(p.b!=null)cell[p.b+'-'+ri]={p,ri,pi};}));
  for(const row of st){const t=row.team;h+=`<tr${hlTeam===t?' style="outline:2px solid var(--hl)"':''}><td class="n">${row.rank}</td><td>${esc(TEAM(t).name)}</td><td class="n">${row.pts}</td><td class="n">${row.wdl.join('-')}</td><td class="n">${row.buch}</td><td class="n">${row.gold}</td>`;
    for(let ri=0;ri<R.length;ri++){const c=cell[t+'-'+ri];if(!c){h+='<td></td>';continue;}const p=c.p;
      if(p.b==null){h+='<td class="rd note">부전승</td>';continue;}const o=p.a===t?p.b:p.a;let me=0,op=0,fin=true;
      for(const gid of p.games){const g=D.games[gid];if(!g||g.w===undefined){fin=false;continue;}const wt=g.w===0?g.r:g.w===1?g.b:null;if(wt===t)me++;else if(wt===o)op++;}
      h+=`<td class="rd" data-r="${ri}" data-p="${c.pi}">${esc(TEAM(o).name)} <span class="${me>op?'wn':me<op?'ls':''}">${fin?me+':'+op:'…'}</span></td>`;}
    h+='</tr>';}
  el.innerHTML=h+'</table>';
  el.querySelectorAll('td.rd[data-r]').forEach(td=>td.onclick=()=>{const p=R[+td.dataset.r][+td.dataset.p];curList=p.games.slice();
    drawer('예선 '+(+td.dataset.r+1)+' 라운드',esc(TEAM(p.a).name)+' vs '+esc(TEAM(p.b).name),'<table><tr><th class="n">#</th><th>맵</th><th>붉은 진영</th><th>푸른 진영</th><th>승자</th><th class="n">바친 금</th><th></th></tr>'+p.games.map((g,i)=>gameRow(g,i+1,false)).join('')+'</table>');bindPlay(false);});}

// ---------- 최종 순위 ----------
// 1등 우승 · 2등 결승 (리셋이 열렸으면 리셋) 패자 · 3등부터는 패자조에서 늦게 탈락한 차례.
// 같은 패자조 라운드에서 탈락한 팀은 공동 순위 (그 라운드의 실제 경기 수만큼). 숨긴 경기로 정해지는 자리는 '?'
function placeGroups(){const B=D.bracket,ms=M();if(!B)return [];
  const gf=ms.GF,gf2=ms.GF2,gfOpen=done(gf)&&!isHidden(gf);
  const fin=gfOpen?(gf2.skip?gf:(done(gf2)&&!isHidden(gf2)?gf2:null)):null;
  const ref=gfOpen&&!gf2.skip?gf2:gf;            // 그랜드 파이널을 공개하기 전에는 리셋 여부도 모르게 늘 그랜드 파이널을 가리킨다
  const G=[{place:'1',size:1,medal:'🥇',why:'우승',ms:[ref],teams:fin?[{t:fin.winner,m:fin}]:[]},
           {place:'2',size:1,medal:'🥈',why:'준우승',ms:[ref],teams:fin?[{t:fin.loser,m:fin}]:[]}];
  let p=3;
  for(let j=B.lb.length;j>=1;j--){const real=B.lb[j-1].map(id=>ms[id]).filter(m=>!isBye(m));if(!real.length)continue;
    G.push({place:real.length>1?p+'~'+(p+real.length-1):String(p),size:real.length,medal:p===3?'🥉':'',why:stageName(real[0])+' 탈락',ms:real,
            teams:real.filter(m=>done(m)&&!isHidden(m)).map(m=>({t:m.loser,m}))});
    p+=real.length;}
  return G;}
function renderPlaces(){const el=$('places');if(!el)return;if(!D||!D.bracket){el.innerHTML='<div class="note" style="padding:20px">본선 대진표가 만들어지면 순위가 나온다.</div>';return;}
  const G=placeGroups();let shownN=0,total=0;
  let h='<table><tr><th class="n">순위</th><th>팀</th><th class="n">본선 시드</th><th class="n">예선 순위</th><th>마지막 경기</th><th>상대</th><th class="n">점수</th></tr>';
  for(const g of G){total+=g.size;
    for(const {t,m} of g.teams){shownN++;const i=m.teams[0]===t?0:1,o=m.teams[1-i],st=(D.standings||[]).find(r=>r.team===t);
      const res=g.place==='1'?'우승':'패';
      h+=`<tr class="click${hlTeam===t?' hlrow':''}" data-m="${m.id}"><td class="n"><b>${g.medal} ${g.place}</b></td><td><b>${esc(TEAM(t).name)}</b></td><td class="n">#${seedOf(t)}</td><td class="n">${st?st.rank+'위':''}</td>
        <td>M${m.no} ${stageName(m)} <span class="pill${res==='우승'?' w':''}">${res}</span></td><td>${o>=0?esc(TEAM(o).name):'-'}</td><td class="n">${m.score[i]} : ${m.score[1-i]}</td></tr>`;}
    const left=g.size-g.teams.length;
    if(left>0){const hid=g.ms.filter(m=>!(done(m)&&!isHidden(m)));
      for(let q=0;q<left;q++){const m=hid[q]||hid[0];
        h+=`<tr class="click" data-m="${m?m.id:''}"><td class="n" style="color:var(--dim)">${g.medal} ${g.place}</td><td style="color:var(--dim)">? (숨김)</td><td></td><td></td>
          <td class="note">${m?'M'+m.no+' '+stageName(m)+' 결과를 공개하면 나온다':''}</td><td></td><td></td></tr>`;}}}
  el.innerHTML=`<h3 style="margin:10px 0">최종 순위 · ${shownN}/${total}팀 공개 <span class="note">(같은 패자조 라운드에서 탈락한 팀은 공동 순위 · 줄을 누르면 그 경기로)</span></h3>`+h+'</table>';
  el.querySelectorAll('tr[data-m]').forEach(r=>{if(!r.dataset.m)return;r.onclick=()=>{const m=M()[r.dataset.m];if(!m)return;
    tab='bracket';[...$('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.tab==='bracket'));showTab();requestAnimationFrame(()=>{focusMatch(m);openMatch(m);});};});}

// ---------- 탭 ----------
let tab='bracket',lastStatus='';
// 상태 줄: 결과를 숨기고 있으면 '우승: …' 을 가린다 (공개 범위를 바꾸는 즉시 다시 그린다)
function paintStatus(){let st=lastStatus;if(D&&D.bracket&&hideCol!==Infinity)st=st.replace(/우승:.*/,'모든 경기 완료');$('status').textContent=st;}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;
  [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));showTab();});
function showTab(){const home=APP&&!D;$('home').style.display=home?'block':'none';$('wrap').style.display=!home&&tab==='bracket'?'block':'none';
  $('swiss').style.display=!home&&tab==='swiss'?'block':'none';$('places').style.display=!home&&tab==='places'?'block':'none';if(tab==='places')renderPlaces();$('bar').style.display=home?'none':'flex';$('tabs').style.visibility=home?'hidden':'visible';
  if(tab==='swiss')renderSwiss();
  if(!home&&tab==='bracket'&&(needFit||Z<0.1))requestAnimationFrame(()=>{fit();needFit=false;});}
let needFit=true;
function setData(d,refit){const first=!D||!d||(D.config.id!==d.config.id);const hadB=!!(D&&D.bracket);D=d;if(!D){showTab();return;}
  if(D.bracket)prepBracket();
  if(first){hlTeam=null;$('search').value='';collapsed.clear();$('drawer').classList.remove('on');}
  if(first||refit||(!hadB&&D.bracket))needFit=true;
  $('tname').textContent=D.config.name+' · '+D.config.teams.length+'팀 · 맵 '+D.config.maps.length+'개 · '+D.config.created;
  if(first){loadPrefs();buildNames();}buildHideSel();render();renderSwiss();showTab();paintStatus();
  if(D.phase==='swiss'&&first){tab='swiss';[...$('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.tab==='swiss'));showTab();}
  if(needFit&&$('wrap').clientWidth){fit();needFit=false;}}

// ---------- 프로그램 (GUI) ----------
async function api(p,body){const r=await fetch('/api/'+p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  const j=await r.json();if(j.error)throw new Error(j.error);return j;}
async function refresh(force){try{const s=await api('status');live=s;
    if(s.loaded){$('bHome').style.display='';$('bPack').style.display='';}
    const p=$('prog');if(s.running||(s.phase&&s.phase!=='done'&&s.total)){p.style.display='flex';const pct=s.total?100*s.done/s.total:0;$('pfill').style.width=pct.toFixed(1)+'%';
      $('ptxt').textContent=(s.phase==='swiss'?'스위스 예선':s.phase==='bracket'?'본선':'')+` · ${s.done}/${s.total}판`+(s.eta?` · 남은 시간 약 ${Math.ceil(s.eta/60)}분`:'')+(s.running?'':' · 멈춤');
      $('bStop').textContent=s.running?'멈추기':'이어서 돌리기';$('bStop').style.display=s.can_run?'':'none';}else p.style.display='none';
    lastStatus=(s.log&&s.log.length)?s.log[s.log.length-1]:'';paintStatus();
    if(s.loaded&&(force||s.version!==refresh.v)){refresh.v=s.version;const d=await api('data');setData(d,force);}
    if(!s.loaded&&D){setData(null);}}catch(e){$('status').textContent='서버와 연결이 끊겼습니다';}}
$('bStop').onclick=async()=>{try{await api(live&&live.running?'stop':'resume',{});refresh();}catch(e){toast(e.message);}};
$('bHome').onclick=async()=>{await api('close',{});D=null;refresh.v=null;$('bHome').style.display='none';$('bPack').style.display='none';showTab();loadRecent();};
$('bPack').onclick=async()=>{const hv=$('hideSel').selectedOptions[0];
  if(!confirm('zip 을 만듭니다. 공개 범위: '+(hv?hv.textContent:'모두 숨김')+'\n(받는 사람이 처음 열 때의 공개 범위입니다)'))return;
  toast('zip 을 만드는 중… (리플레이가 많으면 1~2분)',60000);
  try{const r=await api('pack',{hide:hideColTeams()});toast('저장했습니다: '+r.path,9000);}catch(e){toast('실패: '+e.message,6000);}};
function hideColTeams(){if(hideCol===Infinity)return 'none';if(hideCol<=1)return 'all';if(hideCol===M().GF.col)return 'GF';const k=D.bracket.k,size=D.bracket.size;for(let r=2;r<=k;r++){const t=size>>(r-1);if(hideColForTeams(t)===hideCol)return t;}return null;}
async function pick(kind,target){try{const r=await api('pick',{kind});if(r.path)$(target).value=r.path;return r.path;}catch(e){toast(e.message);}}
$('hPickBots').onclick=()=>pick('dir','hBots');$('hPickOut').onclick=()=>pick('dir','hOut');$('hPickOpen').onclick=()=>pick('dir','hOpen');$('hPickZip').onclick=()=>pick('zip','hOpen');
$('hScan').onclick=async()=>{const o=$('hScanOut');o.style.display='block';o.innerHTML='<div>확인 중…</div>';
  try{const r=await api('scan',{bots:$('hBots').value});const bad=r.bots.filter(b=>!b.ok);
    o.innerHTML=`<div><b>${r.bots.length}개</b> 봇 · 코드 검사 통과 ${r.bots.length-bad.length} · 불합격 ${bad.length} (불합격 봇도 참가하지만 판마다 실격으로 진다)</div>`+
      r.bots.map(b=>`<div class="${b.ok?'':'bad'}">${b.ok?'✓':'✗'} ${esc(b.name)}${b.ok?'':' — '+esc(b.problems.join(' / '))}</div>`).join('');
    $('hStart').disabled=r.bots.length<2;$('hEst').textContent=r.estimate;if(!$('hJobs').value)$('hJobs').value=r.jobs;
    if(!$('hOut').value)$('hOut').value=r.default_out;}catch(e){o.innerHTML='<div class="bad">'+esc(e.message)+'</div>';}};
$('hStart').onclick=async()=>{try{toast('맵을 만들고 시작합니다…');await api('create',{bots:$('hBots').value,name:$('hName').value,out:$('hOut').value,
      maps:+$('hMaps').value,rounds:+$('hRounds').value,jobs:+$('hJobs').value||null});refresh.v=null;await refresh(true);}catch(e){toast('시작할 수 없습니다: '+e.message,6000);}};
$('hLoad').onclick=async()=>{try{toast('여는 중…');await api('open',{path:$('hOpen').value});refresh.v=null;await refresh(true);}catch(e){toast('열 수 없습니다: '+e.message,6000);}};
async function loadRecent(){try{const r=await api('recent');$('hRecent').innerHTML=r.items.length?r.items.map(it=>`<div class="click" data-p="${esc(it.path)}" style="cursor:pointer">${esc(it.name)} <span class="note">· ${it.teams}팀 · ${esc(it.phase)} · ${esc(it.path)}</span></div>`).join(''):'<div class="note">아직 없음</div>';
  $('hRecent').querySelectorAll('[data-p]').forEach(d=>d.onclick=()=>{$('hOpen').value=d.dataset.p;$('hLoad').click();});}catch(_){}}
(async function init(){
  if(location.protocol.startsWith('http')){try{const s=await api('status');APP=true;BASE='/t/';}catch(_){}}
  if(APP){loadRecent();await refresh(true);setInterval(()=>refresh(false),2000);if(!D)showTab();}
  else{const d=D;D=null;setData(d,true);}
  addEventListener('resize',()=>{});})();
</script>
