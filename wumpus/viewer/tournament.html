<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웜퍼스 워즈 토너먼트</title>
<style>
:root{--bg:#15191d;--panel:#1d2227;--box:#232a30;--box2:#2b333a;--line:#3a444c;--text:#e9ecef;--dim:#8d979f;--win:#7bd88f;--gold:#e2b24c;--red:#e0654b;--blue:#5b9be0;--hl:#f5c542}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 "Pretendard","맑은 고딕","Malgun Gothic",system-ui,sans-serif}
button,input,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer;font-weight:600}button:hover{border-color:#5a6670}button:disabled{opacity:.45;cursor:default}
button.main{background:#2f6f45;border-color:#3c8a57}button.main:hover{background:#357c4e}
input::placeholder{color:#6c767e}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #262d33}
header h1{font-size:17px;margin:0;letter-spacing:.02em}header h1 b{color:var(--gold)}
header .sub{color:var(--dim);font-size:13px}
header .sp{flex:1}
.tabs{display:flex;gap:6px}.tabs button{background:transparent;border-color:transparent}.tabs button.on{background:var(--panel);border-color:var(--line)}
#bar{display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}
#bar .grp{display:flex;gap:6px;align-items:center}
#zoomTxt{min-width:52px;text-align:center;color:var(--dim)}
#search{width:240px}
#prog{display:none;align-items:center;gap:12px;padding:0 18px 10px}
#prog .track{flex:1;height:8px;background:#0f1215;border-radius:6px;overflow:hidden;border:1px solid #2a3137}
#prog .fill{height:100%;background:linear-gradient(90deg,#3c8a57,#7bd88f);width:0}
#prog .txt{color:var(--dim);font-size:13px;min-width:280px;text-align:right}
main{flex:1;position:relative;min-height:0;margin:0 18px 6px}
#wrap{position:absolute;inset:0;border:2px solid #d9dfc8;border-radius:12px;overflow:hidden;background:var(--panel);
  background-image:radial-gradient(#2c343a 1px,transparent 1px);background-size:18px 18px;cursor:grab}
#wrap.drag{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.colh{position:absolute;top:14px;height:22px;border:1px solid #333c43;background:#20262b;color:var(--dim);font-size:10px;letter-spacing:.12em;
  padding:3px 8px;border-radius:4px;cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden}
.colh:hover{color:var(--text)}
.sect{position:absolute;font-size:11px;color:#c9d0d6;font-weight:700}
.m{position:absolute;width:200px;background:var(--box);border:1px solid #303940;border-radius:4px;cursor:pointer;font-size:12px}
.m:hover{border-color:#5f6d78}
.m .r{display:flex;align-items:center;height:22px;padding:0 6px;gap:6px}
.m .r+.r{border-top:1px solid #2c343a}
.m .sd{color:#6f7a82;font-size:10px;width:26px}
.m .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .sc{width:24px;text-align:right;color:#b8c0c6;font-variant-numeric:tabular-nums}
.m .w .nm,.m .w .sc{color:var(--win);font-weight:700}
.m .tbd .nm{color:#6c767e;font-style:italic}
.m .no{position:absolute;left:-22px;top:15px;font-size:10px;color:#6f7a82;width:18px;text-align:right}
.m.hid{background:#1f2429;border-style:dashed}.m.hid .sc{color:#8a7a55}
.m.run{border-color:#4f6b85}.m.run .sc{color:#7fb0dd}
.m.hl{outline:2px solid var(--hl);outline-offset:1px}
.m.dim{opacity:.28}
.m .lock{position:absolute;right:-8px;top:-8px;background:#3a3222;color:var(--gold);border:1px solid #6b5a33;border-radius:9px;font-size:10px;padding:0 5px}
svg#lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg#lines path{fill:none;stroke:#59646c;stroke-width:1.2}
svg#lines path.hl{stroke:var(--hl);stroke-width:2}
footer{padding:4px 18px 10px;color:var(--dim);font-size:12px}
/* 오른쪽 서랍 */
#drawer{position:fixed;right:0;top:0;bottom:0;width:560px;max-width:100%;background:#1a1f23;border-left:1px solid #2e363c;transform:translateX(100%);transition:transform .2s;z-index:20;display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer .hd{padding:16px 18px;border-bottom:1px solid #2a3136;display:flex;gap:10px;align-items:flex-start}
#drawer .hd h2{margin:0;font-size:16px}#drawer .hd .sub{color:var(--dim);font-size:12px;margin-top:3px}
#drawer .bd{padding:14px 18px;overflow:auto;flex:1}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:14px}
.vs .t{background:var(--box);border-radius:8px;padding:10px 12px}.vs .t .n{font-weight:700;font-size:15px}.vs .t .s{color:var(--dim);font-size:12px}
.vs .big{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.vs .t.win .n{color:var(--win)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{color:var(--dim);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid #2c343a;position:sticky;top:0;background:#1a1f23}
td{padding:6px 6px;border-bottom:1px solid #242b30}
td.n{font-variant-numeric:tabular-nums;text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:#20262b}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;background:#2a3238;color:var(--dim)}
.pill.w{background:#1f3a29;color:var(--win)}.pill.r{color:var(--red)}.pill.b{color:var(--blue)}
.play{padding:3px 9px;font-size:12px}
/* 리플레이 */
#rv{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
#rv.on{display:flex}
#rv .top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#111518;border-bottom:1px solid #262d33}
#rv .top .ttl{flex:1;font-weight:600}
#rv iframe{flex:1;border:0;width:100%;background:#000}
/* 예선 표 */
#swiss{position:absolute;inset:0;overflow:auto;display:none;background:var(--panel);border-radius:12px;padding:6px 14px}
#swiss td.rd{white-space:nowrap;cursor:pointer;color:#c7ced3}#swiss td.rd:hover{background:#262e34}
#swiss td.rd .wn{color:var(--win);font-weight:700}#swiss td.rd .ls{color:#c98f86}
/* 시작 화면 */
#home{position:absolute;inset:0;overflow:auto;display:none;padding:24px 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px;max-width:1200px}
.card{background:var(--panel);border:1px solid #2b3238;border-radius:12px;padding:18px 20px}
.card h3{margin:0 0 12px;font-size:16px}.card h3 b{color:var(--gold)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}.row label{width:120px;color:var(--dim)}.row input{flex:1}
.row input.short{flex:0 0 90px}
.note{color:var(--dim);font-size:12px;margin:6px 0}
.scan{max-height:240px;overflow:auto;border:1px solid #2b3238;border-radius:8px;margin-top:10px;font-size:12px}
.scan div{padding:4px 10px;border-bottom:1px solid #242a2f}.scan .bad{color:#e8a397}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b3238;border:1px solid #47525a;padding:10px 16px;border-radius:10px;display:none;z-index:60}
#status{color:var(--dim);font-size:12px;max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{margin-top:10px;background:#20262b;border-radius:8px;padding:10px 12px;font-size:13px}
.track div{padding:2px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>◆ <b>WUMPUS WARS</b> 토너먼트</h1>
    <span class="sub" id="tname"></span>
    <div class="tabs" id="tabs">
      <button data-tab="bracket" class="on">본선 대진표</button>
      <button data-tab="swiss">스위스 예선</button>
    </div>
    <span class="sp"></span>
    <span id="status"></span>
    <button id="bHome" style="display:none">처음 화면</button>
    <button id="bPack" style="display:none">zip 내보내기</button>
  </header>
  <div id="bar">
    <button id="bRefresh">⟳ 새로고침</button>
    <input id="search" list="names" placeholder="팀 (학생) 이름 검색…">
    <datalist id="names"></datalist>
    <button id="bExpand">라운드 모두 펼치기</button>
    <div class="grp"><span class="note">공개 범위</span><select id="hideSel"></select></div>
    <span class="sp" style="flex:1"></span>
    <div class="grp"><button id="bOut">−</button><span id="zoomTxt">100%</span><button id="bIn">+</button></div>
    <button id="bFit">대진표 맞추기</button>
    <button id="bReset">보기 초기화</button>
    <button id="bFull" title="전체 화면">⛶</button>
  </div>
  <div id="prog"><div class="track"><div class="fill" id="pfill"></div></div><div class="txt" id="ptxt"></div><button id="bStop">멈추기</button></div>
  <main>
    <div id="wrap"><div id="canvas"><svg id="lines"></svg></div></div>
    <div id="swiss"></div>
    <div id="home">
      <div class="cards">
        <div class="card">
          <h3>새 토너먼트 <b>만들기</b></h3>
          <div class="row"><label>봇 폴더</label><input id="hBots" placeholder="학생 봇 폴더 (안에 이름/main.py 들)"><button id="hPickBots">찾아보기</button></div>
          <div class="row"><label>토너먼트 이름</label><input id="hName" placeholder="예: 2026 가을 웜퍼스 워즈"></div>
          <div class="row"><label>저장할 곳</label><input id="hOut" placeholder="토너먼트 폴더를 만들 곳"><button id="hPickOut">찾아보기</button></div>
          <div class="row"><label>맵 수 · 예선 라운드</label><input id="hMaps" class="short" type="number" value="21" min="1" max="99"><input id="hRounds" class="short" type="number" value="7" min="1" max="20"><span class="note">맵은 시작할 때 새로 만든다</span></div>
          <div class="row"><label>동시 경기 수</label><input id="hJobs" class="short" type="number" min="1" max="64"><span class="note">CPU 코어 수 − 2 를 권함</span></div>
          <div class="row"><button id="hScan">봇 확인</button><button id="hStart" class="main" disabled>토너먼트 시작</button><span class="note" id="hEst"></span></div>
          <div class="scan" id="hScanOut" style="display:none"></div>
        </div>
        <div class="card">
          <h3>토너먼트 <b>불러오기</b></h3>
          <div class="note">만든 토너먼트 폴더, 또는 내보낸 zip 을 연다. 멈춘 토너먼트는 이어서 돌릴 수 있다.</div>
          <div class="row"><input id="hOpen" placeholder="토너먼트 폴더 또는 .zip"><button id="hPickOpen">폴더</button><button id="hPickZip">zip</button></div>
          <div class="row"><button id="hLoad" class="main">열기</button></div>
          <h3 style="margin-top:18px">최근 토너먼트</h3>
          <div id="hRecent" class="scan" style="max-height:300px"></div>
        </div>
      </div>
    </div>
  </main>
  <footer>끌어서 이동 · 휠로 확대 · 라운드 제목을 누르면 접힌다 · 경기를 누르면 판마다 결과와 리플레이</footer>
</div>
<div id="drawer"><div class="hd"><div style="flex:1"><h2 id="dTitle"></h2><div class="sub" id="dSub"></div></div><button id="dClose">닫기</button></div><div class="bd" id="dBody"></div></div>
<div id="rv"><div class="top"><button id="rPrev">◀ 이전 판</button><span class="ttl" id="rTitle"></span><button id="rNext">다음 판 ▶</button><button id="rClose">닫기 ✕</button></div><iframe id="rFrame"></iframe></div>
<div id="toast"></div>
<script src="data.js" onerror="void 0"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=window.TOURNAMENT||null, APP=false, BASE='', live=null;
const COLW=250, BOXW=200, BOXH=46, ROWH=58, TOP=56, LEFT=40;
let Z=1, PX=0, PY=0, collapsed=new Set(), hideCol=Infinity, revealed=new Set(), hlTeam=null;
function toast(t,ms=2600){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms);}
function key(k){return 'ww-t-'+(D&&D.config.id)+'-'+k;}
function loadPrefs(){try{revealed=new Set(JSON.parse(localStorage.getItem(key('rev'))||'[]'));}catch(_){revealed=new Set();}
  let h=null;try{h=localStorage.getItem(key('hide'));}catch(_){}
  hideCol=h!==null?+h:(D.hide?hideColForTeams(D.hide):Infinity);}
function savePrefs(){try{localStorage.setItem(key('rev'),JSON.stringify([...revealed]));localStorage.setItem(key('hide'),String(hideCol));}catch(_){}}
const TEAM=t=>t==null||t<0?null:D.config.teams[t];
const seedOf=t=>D.seeds?D.seeds.indexOf(t)+1:0;

// ---------- 대진 정보 ----------
const M=()=>D.bracket?D.bracket.matches:{};
function shown(){return Object.values(M()).filter(m=>m.shown&&!(m.id==='GF2'&&m.skip));}
function stageName(m){const k=D.bracket.k;if(m.br==='GF')return '그랜드 파이널';if(m.br==='GF2')return '결승 리셋';
  if(m.br==='W'){const t=D.bracket.size>>(m.rnd-1);return m.rnd===k?'승자조 결승':'승자조 '+m.rnd+' 라운드 ('+t+'강)';}
  const last=D.bracket.lb.length;return m.rnd===last?'패자조 결승':'패자조 '+m.rnd+' 라운드';}
function isHidden(m){return m.col>=hideCol&&!revealed.has(m.id);}
function done(m){return m.winner!==undefined&&m.winner!==null&&!m.bye;}
// 자리의 팀이 보이는가: 시드는 늘, 경기에서 온 팀은 그 경기 (부전승이면 그 앞) 가 공개됐을 때
function slotVisible(slot){if('seed' in slot)return true;const src=M()[slot.win||slot.lose];if(!src)return false;
  if(src.bye){return src.src.every(s=>slotVisible(s));}
  if(src.winner===undefined)return false;return !isHidden(src);}
function slotTeam(m,i){const t=m.teams?m.teams[i]:null;if(t==null||t<0)return null;return slotVisible(m.src[i])?t:undefined;}
function slotHint(m,i){const s=m.src[i];if('seed' in s)return '시드 #'+s.seed;const src=M()[s.win||s.lose];
  let n=src;while(n&&!n.shown){const ss=n.src.find(x=>!('seed' in x));if(!ss)break;n=M()[ss.win||ss.lose];}
  return (s.win?'승자: ':'패자: ')+(n&&n.shown?'M'+n.no:'?');}

// ---------- 그리기 ----------
function colInfo(){const ms=shown();const cols=[...new Set(ms.map(m=>m.col))].sort((a,b)=>a-b);
  const X={};let x=LEFT;for(const c of cols){X[c]=x;x+=collapsed.has(c)?48:COLW;}return {cols,X,width:x};}
function yPx(m){return TOP+30+m.y*ROWH;}
function render(){
  if(!D||!D.bracket){$('canvas').innerHTML='<svg id="lines"></svg><div class="sect" style="left:40px;top:40px;font-size:15px;color:#aab3ba">'+(D?'스위스 예선 중입니다. 예선이 끝나면 본선 대진표가 만들어집니다.':'토너먼트를 만들거나 불러오세요.')+'</div>';return;}
  const ms=shown().sort((a,b)=>a.col-b.col||(a.br==='W'?0:a.br==='L'?1:2)-(b.br==='W'?0:b.br==='L'?1:2)||a.y-b.y);
  ms.forEach((m,i)=>m.no=i+1);
  const {cols,X,width}=colInfo();
  const gfc=M().GF.col,gf2c=M().GF2.col;
  let h='';
  for(const c of cols){const lbl=c===gfc?'GRAND FINAL':c===gf2c?'FINAL RESET':'ROUND '+c;
    h+=`<div class="colh" data-col="${c}" style="left:${X[c]}px;width:${collapsed.has(c)?40:BOXW}px" title="눌러서 접기 · 펼치기">${collapsed.has(c)?'›':'↓ '+lbl}</div>`;}
  h+=`<div class="sect" style="left:${LEFT}px;top:${TOP+4}px">승자조</div>`;
  h+=`<div class="sect" style="left:${LEFT}px;top:${TOP+30+(D.bracket.wb_rows+.1)*ROWH}px">패자조</div>`;
  const teamHit=t=>hlTeam!=null&&t===hlTeam;
  for(const m of ms){if(collapsed.has(m.col))continue;
    const hid=isHidden(m),fin=done(m),run=!fin&&m.games&&m.games.length;
    const rows=[0,1].map(i=>{const t=slotTeam(m,i);const tm=TEAM(t);
      const w=fin&&!hid&&m.winner===t;const sc=fin?(hid?'?':m.score[i]):(run&&!hid?liveScore(m,i):'');
      if(t===undefined)return `<div class="r tbd"><span class="sd"></span><span class="nm">${hid?'? (숨김)':esc(slotHint(m,i))}</span><span class="sc">${sc}</span></div>`;
      if(!tm)return `<div class="r tbd"><span class="sd"></span><span class="nm">${esc(slotHint(m,i))}</span><span class="sc"></span></div>`;
      return `<div class="r${w?' w':''}"><span class="sd">#${seedOf(t)}</span><span class="nm">${esc(tm.name)}</span><span class="sc">${sc}</span></div>`;}).join('');
    const has=hlTeam!=null&&m.teams&&[0,1].some(i=>slotTeam(m,i)===hlTeam);
    const cls='m'+(hid?' hid':'')+(run?' run':'')+(has?' hl':'')+(hlTeam!=null&&!has?' dim':'');
    h+=`<div class="${cls}" data-id="${m.id}" style="left:${X[m.col]}px;top:${yPx(m)}px"><span class="no">${m.no}</span>${rows}${hid&&fin?'<span class="lock">숨김</span>':''}</div>`;}
  // 선: 승자가 올라가는 길만 (내려가는 패자는 선 없이)
  let p='';
  const nearest=s=>{let n=M()[s.win];while(n&&!n.shown){const ss=n.src.find(x=>x.win);if(!ss)return null;n=M()[ss.win];}return n;};
  for(const m of ms){if(collapsed.has(m.col))continue;for(const s of m.src){if(!s.win)continue;const a=nearest(s);if(!a||collapsed.has(a.col))continue;
      if(a.br!==m.br&&!(m.br==='GF'||m.br==='GF2'))continue;
      const x1=X[a.col]+BOXW,y1=yPx(a)+BOXH/2,x2=X[m.col],y2=yPx(m)+BOXH/2,mx=x2-18;
      const on=hlTeam!=null&&a.winner===hlTeam&&!isHidden(a);
      p+=`<path class="${on?'hl':''}" d="M${x1} ${y1}H${mx}V${y2}H${x2}"/>`;}}
  $('canvas').innerHTML=`<svg id="lines" width="${width+300}" height="${TOP+60+D.bracket.rows*ROWH}">${p}</svg>`+h;
  $('canvas').style.width=(width+300)+'px';$('canvas').style.height=(TOP+80+D.bracket.rows*ROWH)+'px';
  applyZoom();
}
function liveScore(m,i){let a=0,b=0;for(const gid of m.games){const g=D.games[gid];if(!g||g.w===undefined)continue;
    const wt=g.w===0?g.r:g.w===1?g.b:null;if(wt===m.teams[0])a++;else if(wt===m.teams[1])b++;}return i?b:a;}
function applyZoom(){$('canvas').style.transform=`translate(${PX}px,${PY}px) scale(${Z})`;$('zoomTxt').textContent=Math.round(Z*100)+'%';}
function fit(){const c=$('canvas'),w=$('wrap');if(!w.clientWidth)return;const cw=parseFloat(c.style.width)||1000,ch=parseFloat(c.style.height)||600;
  Z=Math.max(.08,Math.min(1.5,Math.min(w.clientWidth/cw,w.clientHeight/ch)*.97));PX=(w.clientWidth-cw*Z)/2;PY=8;applyZoom();}
function zoomAt(f,cx,cy){const nz=Math.max(.08,Math.min(3,Z*f));PX=cx-(cx-PX)*nz/Z;PY=cy-(cy-PY)*nz/Z;Z=nz;applyZoom();}
function focusMatch(m){const {X}=colInfo();const w=$('wrap');Z=Math.max(Z,.8);PX=w.clientWidth/2-(X[m.col]+BOXW/2)*Z;PY=w.clientHeight/2-(yPx(m)+BOXH/2)*Z;applyZoom();}

// ---------- 끌기 · 확대 ----------
(function(){const w=$('wrap');let d=null;
  w.addEventListener('mousedown',e=>{if(e.target.closest('.m,.colh'))return;d={x:e.clientX,y:e.clientY,px:PX,py:PY};w.classList.add('drag');});
  addEventListener('mousemove',e=>{if(!d)return;PX=d.px+e.clientX-d.x;PY=d.py+e.clientY-d.y;applyZoom();});
  addEventListener('mouseup',()=>{d=null;w.classList.remove('drag');});
  w.addEventListener('wheel',e=>{e.preventDefault();const r=w.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
  w.addEventListener('click',e=>{const h=e.target.closest('.colh');if(h){const c=+h.dataset.col;collapsed.has(c)?collapsed.delete(c):collapsed.add(c);render();return;}
    const m=e.target.closest('.m');if(m)openMatch(M()[m.dataset.id]);});})();
$('bIn').onclick=()=>{const w=$('wrap');zoomAt(1.15,w.clientWidth/2,w.clientHeight/2);};
$('bOut').onclick=()=>{const w=$('wrap');zoomAt(1/1.15,w.clientWidth/2,w.clientHeight/2);};
$('bFit').onclick=fit;$('bReset').onclick=()=>{Z=1;PX=0;PY=0;applyZoom();};
$('bExpand').onclick=()=>{collapsed.clear();render();};
$('bFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();};
$('bRefresh').onclick=()=>{APP?refresh(true):location.reload();};

// ---------- 공개 범위 ----------
function hideColForTeams(t){if(!D||!D.bracket)return Infinity;const k=D.bracket.k,size=D.bracket.size;
  if(t==='GF')return M().GF.col;for(let r=1;r<=k;r++){if((size>>(r-1))===+t){const ms=D.bracket.wb[r-1].map(id=>M()[id]).filter(m=>m.shown);if(ms.length)return Math.min(...ms.map(m=>m.col));}}return Infinity;}
function buildHideSel(){const s=$('hideSel');if(!D||!D.bracket){s.innerHTML='<option>모두 공개</option>';return;}
  const k=D.bracket.k,size=D.bracket.size,opts=[['Infinity','모두 공개']];
  for(let r=2;r<=k;r++){const t=size>>(r-1),c=hideColForTeams(t);if(c===Infinity)continue;opts.push([String(c),(r===k?'승자조 결승':t+'강')+'부터 숨김 (라운드 '+c+'~)']);}
  opts.push([String(M().GF.col),'그랜드 파이널부터 숨김']);
  s.innerHTML=opts.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('');s.value=String(hideCol);
  if(s.value!==String(hideCol))s.value='Infinity';}
$('hideSel').onchange=e=>{hideCol=e.target.value==='Infinity'?Infinity:+e.target.value;revealed.clear();savePrefs();render();renderSwiss();};

// ---------- 검색 ----------
function buildNames(){$('names').innerHTML=D?D.config.teams.map(t=>`<option value="${esc(t.name)}">`).join(''):'';}
$('search').addEventListener('change',doSearch);$('search').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();if(e.key==='Escape'){e.target.value='';doSearch();}});
function doSearch(){const q=$('search').value.trim().toLowerCase();if(!q||!D){hlTeam=null;render();return;}
  const ts=D.config.teams.filter(t=>t.name.toLowerCase()===q);const t=(ts[0]||D.config.teams.find(t=>t.name.toLowerCase().includes(q)));
  if(!t){toast('그런 이름이 없습니다');return;}hlTeam=t.id;$('search').value=t.name;
  if(tab!=='bracket'){render();renderSwiss();openTeam(t.id);return;}
  render();const mine=shown().filter(m=>m.teams&&[0,1].some(i=>slotTeam(m,i)===t.id)).sort((a,b)=>a.col-b.col);
  if(mine.length)focusMatch(mine[mine.length-1]);openTeam(t.id);}
function openTeam(t){const tm=TEAM(t);const mine=D.bracket?shown().filter(m=>m.teams&&[0,1].some(i=>slotTeam(m,i)===t)).sort((a,b)=>a.col-b.col):[];
  const st=(D.standings||[]).find(r=>r.team===t);
  let h=`<div class="track"><div>스위스 예선: <b>${st?st.rank+'위':'-'}</b> · ${st?st.pts:0}점 (${st?st.wdl.join('-'):''})${D.seeds?' · 본선 시드 #'+seedOf(t):''}</div></div>`;
  h+='<table style="margin-top:12px"><tr><th>경기</th><th>단계</th><th>상대</th><th class="n">점수</th><th>결과</th></tr>';
  for(const m of mine){const i=m.teams[0]===t?0:1,o=slotTeam(m,1-i),hid=isHidden(m);
    const res=!done(m)?'<span class="pill">진행 전</span>':hid?'<span class="pill">숨김</span>':m.winner===t?'<span class="pill w">승</span>':'<span class="pill r">패</span>';
    h+=`<tr class="click" data-m="${m.id}"><td>M${m.no}</td><td>${stageName(m)}</td><td>${o==null?'-':o===undefined?'?':esc(TEAM(o).name)}</td><td class="n">${done(m)&&!hid?m.score[i]+' : '+m.score[1-i]:'?'}</td><td>${res}</td></tr>`;}
  h+='</table>';
  const last=mine[mine.length-1];let fate='';
  if(D.champion===t&&!mine.some(isHidden))fate='🏆 우승';else if(last&&done(last)&&!isHidden(last)&&last.winner!==t&&(last.br==='L'||last.br==='GF'||last.br==='GF2'))fate=stageName(last)+'에서 탈락';
  drawer(esc(tm.name),fate||'어디까지 갔는지: 공개된 경기까지',h);
  $('dBody').querySelectorAll('tr[data-m]').forEach(r=>r.onclick=()=>{const m=M()[r.dataset.m];focusMatch(m);openMatch(m);});}

// ---------- 경기 서랍 ----------
function drawer(t,s,h){$('dTitle').innerHTML=t;$('dSub').textContent=s;$('dBody').innerHTML=h;$('drawer').classList.add('on');}
$('dClose').onclick=()=>$('drawer').classList.remove('on');
function gameRow(gid,i,hid,teamsOrder){const g=D.games[gid];if(!g)return '';const mp=D.config.maps[g.m];const R=TEAM(g.r),B=TEAM(g.b);
  const fin=g.w!==undefined;let res;
  if(!fin)res='<span class="pill">대기</span>';else if(hid)res='<span class="pill">?</span>';
  else res=g.w===0?`<span class="pill w">${esc(R.name)}</span>`:g.w===1?`<span class="pill w">${esc(B.name)}</span>`:'<span class="pill">무승부</span>';
  const gold=fin&&!hid?g.s[0]+' : '+g.s[1]:'';
  return `<tr><td class="n">${i}</td><td title="${esc(mp.name)}">${esc(mp.name.split('_')[0])} <span class="note">${mp.w}×${mp.h}</span></td><td><span class="pill r">●</span> ${esc(R.name)}</td><td><span class="pill b">●</span> ${esc(B.name)}</td><td>${res}</td><td class="n">${gold}</td><td>${fin?`<button class="play" data-g="${gid}">▶ 보기</button>`:''}</td></tr>`;}
let curList=[];
function openMatch(m){if(!m)return;const hid=isHidden(m);
  const ts=[0,1].map(i=>slotTeam(m,i));
  const tn=i=>ts[i]==null?'-':ts[i]===undefined?'?':esc(TEAM(ts[i]).name);
  const fin=done(m);
  let h=`<div class="vs"><div class="t${fin&&!hid&&m.winner===ts[0]?' win':''}"><div class="n">${tn(0)}</div><div class="s">${ts[0]>=0?'시드 #'+seedOf(ts[0]):''}</div></div>
    <div class="big">${fin?(hid?'? : ?':m.score[0]+' : '+m.score[1]):(m.games&&m.games.length?liveScore(m,0)+' : '+liveScore(m,1):'-')}</div>
    <div class="t${fin&&!hid&&m.winner===ts[1]?' win':''}" style="text-align:right"><div class="n">${tn(1)}</div><div class="s">${ts[1]>=0?'시드 #'+seedOf(ts[1]):''}</div></div></div>`;
  if(fin&&!hid&&m.gold)h+=`<div class="note">이긴 판 수로 승부, 같으면 바친 금 합 (${m.gold[0]} : ${m.gold[1]}), 그것도 같으면 높은 시드.</div>`;
  if(m.col>=hideCol)h+=`<div class="row">${revealed.has(m.id)?'<button id="bHideAgain">다시 숨기기</button>':'<button id="bReveal" class="main">결과 공개</button>'}<span class="note">숨긴 경기도 리플레이는 먼저 틀어 볼 수 있다</span></div>`;
  if(ts.includes(undefined)&&!revealed.has(m.id))h+='<div class="note">앞 경기 결과가 숨겨져 있어 상대가 가려져 있다.</div>';
  else if(m.games){curList=m.games.slice();h+='<table><tr><th class="n">#</th><th>맵</th><th>붉은 진영</th><th>푸른 진영</th><th>승자</th><th class="n">바친 금</th><th></th></tr>'+m.games.map((g,i)=>gameRow(g,i+1,hid,ts)).join('')+'</table>';}
  else h+='<div class="note">아직 치르지 않은 경기.</div>';
  drawer('M'+m.no+' · '+stageName(m),'라운드 '+m.col+' · 맵 '+(D.config.maps.length)+'개 한 판씩 (진영은 번갈아)',h);
  const r=$('bReveal');if(r)r.onclick=()=>{revealed.add(m.id);savePrefs();render();renderSwiss();openMatch(m);};
  const a=$('bHideAgain');if(a)a.onclick=()=>{revealed.delete(m.id);savePrefs();render();openMatch(m);};
  bindPlay(hid);}
function bindPlay(hid){$('dBody').querySelectorAll('button.play').forEach(b=>b.onclick=()=>openReplay(b.dataset.g,hid));}

// ---------- 리플레이 ----------
let rvList=[],rvIdx=0,rvHid=false,frameReady=null;
window.__wwReplay=async(gid,b64)=>{const want=window.__wwWant;if(want!==gid)return;
  try{const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const rep=JSON.parse(txt);await frameReady;$('rFrame').contentWindow.postMessage({type:'wumpus-replay',replay:rep},'*');}
  catch(e){toast('리플레이를 열 수 없습니다: '+e.message,5000);}};
function openReplay(gid,hid){rvList=curList.length?curList:[gid];rvIdx=Math.max(0,rvList.indexOf(gid));rvHid=hid;
  const f=$('rFrame');if(!f.src){frameReady=new Promise(r=>f.onload=()=>setTimeout(r,400));f.src=BASE+'viewer.html';}
  $('rv').classList.add('on');showGame();}
function showGame(){const gid=rvList[rvIdx],g=D.games[gid],mp=D.config.maps[g.m];
  $('rTitle').textContent=`${gid} · ${rvIdx+1}/${rvList.length}판 · 맵 ${mp.name} · ${TEAM(g.r).name} (붉은) vs ${TEAM(g.b).name} (푸른)`;
  $('rPrev').disabled=rvIdx<=0;$('rNext').disabled=rvIdx>=rvList.length-1;
  window.__wwWant=gid;const s=document.createElement('script');s.src=BASE+'replays/'+gid+'.js'+(APP?'?t='+Date.now():'');
  s.onerror=()=>toast('리플레이 파일이 없습니다: '+gid);s.onload=()=>s.remove();document.body.appendChild(s);}
$('rPrev').onclick=()=>{if(rvIdx>0){rvIdx--;showGame();}};$('rNext').onclick=()=>{if(rvIdx<rvList.length-1){rvIdx++;showGame();}};
$('rClose').onclick=()=>$('rv').classList.remove('on');
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('rv').classList.contains('on'))$('rv').classList.remove('on');else $('drawer').classList.remove('on');}});

// ---------- 스위스 예선 ----------
function renderSwiss(){const el=$('swiss');if(!D){el.innerHTML='';return;}
  const R=D.swiss||[],st=D.standings||[];
  let h=`<h3 style="margin:10px 0">스위스 예선 · ${R.length}/${D.config.swiss_rounds} 라운드 · 짝마다 맵 하나를 양쪽 진영으로 두 판 (판 승 1점 · 무 0.5 · 부전승 1)</h3>`;
  h+='<table><tr><th class="n">순위</th><th>팀</th><th class="n">점수</th><th class="n">승-무-패</th><th class="n">상대 점수 합</th><th class="n">바친 금</th>'+R.map((_,i)=>`<th>R${i+1}</th>`).join('')+'</tr>';
  const cell={};R.forEach((rnd,ri)=>rnd.forEach((p,pi)=>{cell[p.a+'-'+ri]={p,ri,pi};if(p.b!=null)cell[p.b+'-'+ri]={p,ri,pi};}));
  for(const row of st){const t=row.team;h+=`<tr${hlTeam===t?' style="outline:2px solid var(--hl)"':''}><td class="n">${row.rank}</td><td>${esc(TEAM(t).name)}</td><td class="n">${row.pts}</td><td class="n">${row.wdl.join('-')}</td><td class="n">${row.buch}</td><td class="n">${row.gold}</td>`;
    for(let ri=0;ri<R.length;ri++){const c=cell[t+'-'+ri];if(!c){h+='<td></td>';continue;}const p=c.p;
      if(p.b==null){h+='<td class="rd note">부전승</td>';continue;}const o=p.a===t?p.b:p.a;let me=0,op=0,fin=true;
      for(const gid of p.games){const g=D.games[gid];if(!g||g.w===undefined){fin=false;continue;}const wt=g.w===0?g.r:g.w===1?g.b:null;if(wt===t)me++;else if(wt===o)op++;}
      h+=`<td class="rd" data-r="${ri}" data-p="${c.pi}">${esc(TEAM(o).name)} <span class="${me>op?'wn':me<op?'ls':''}">${fin?me+':'+op:'…'}</span></td>`;}
    h+='</tr>';}
  el.innerHTML=h+'</table>';
  el.querySelectorAll('td.rd[data-r]').forEach(td=>td.onclick=()=>{const p=R[+td.dataset.r][+td.dataset.p];curList=p.games.slice();
    drawer('예선 '+(+td.dataset.r+1)+' 라운드',esc(TEAM(p.a).name)+' vs '+esc(TEAM(p.b).name),'<table><tr><th class="n">#</th><th>맵</th><th>붉은 진영</th><th>푸른 진영</th><th>승자</th><th class="n">바친 금</th><th></th></tr>'+p.games.map((g,i)=>gameRow(g,i+1,false)).join('')+'</table>');bindPlay(false);});}

// ---------- 탭 ----------
let tab='bracket';
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;
  [...$('tabs').children].forEach(x=>x.classList.toggle('on',x===b));showTab();});
function showTab(){const home=APP&&!D;$('home').style.display=home?'block':'none';$('wrap').style.display=!home&&tab==='bracket'?'block':'none';
  $('swiss').style.display=!home&&tab==='swiss'?'block':'none';$('bar').style.display=home?'none':'flex';$('tabs').style.visibility=home?'hidden':'visible';
  if(tab==='swiss')renderSwiss();
  if(!home&&tab==='bracket'&&(needFit||Z<0.1))requestAnimationFrame(()=>{fit();needFit=false;});}
let needFit=true;
function setData(d,refit){const first=!D||!d||(D.config.id!==d.config.id);const hadB=!!(D&&D.bracket);D=d;if(!D){showTab();return;}
  if(first){hlTeam=null;$('search').value='';collapsed.clear();$('drawer').classList.remove('on');}
  if(first||refit||(!hadB&&D.bracket))needFit=true;
  $('tname').textContent=D.config.name+' · '+D.config.teams.length+'팀 · 맵 '+D.config.maps.length+'개 · '+D.config.created;
  if(first){loadPrefs();buildNames();}buildHideSel();render();renderSwiss();showTab();
  if(D.phase==='swiss'&&first){tab='swiss';[...$('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.tab==='swiss'));showTab();}
  if(needFit&&$('wrap').clientWidth){fit();needFit=false;}}

// ---------- 프로그램 (GUI) ----------
async function api(p,body){const r=await fetch('/api/'+p,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  const j=await r.json();if(j.error)throw new Error(j.error);return j;}
async function refresh(force){try{const s=await api('status');live=s;
    if(s.loaded){$('bHome').style.display='';$('bPack').style.display='';}
    const p=$('prog');if(s.running||(s.phase&&s.phase!=='done'&&s.total)){p.style.display='flex';const pct=s.total?100*s.done/s.total:0;$('pfill').style.width=pct.toFixed(1)+'%';
      $('ptxt').textContent=(s.phase==='swiss'?'스위스 예선':s.phase==='bracket'?'본선':'')+` · ${s.done}/${s.total}판`+(s.eta?` · 남은 시간 약 ${Math.ceil(s.eta/60)}분`:'')+(s.running?'':' · 멈춤');
      $('bStop').textContent=s.running?'멈추기':'이어서 돌리기';$('bStop').style.display=s.can_run?'':'none';}else p.style.display='none';
    $('status').textContent=(s.log&&s.log.length)?s.log[s.log.length-1]:'';
    if(s.loaded&&(force||s.version!==refresh.v)){refresh.v=s.version;const d=await api('data');setData(d,force);}
    if(!s.loaded&&D){setData(null);}}catch(e){$('status').textContent='서버와 연결이 끊겼습니다';}}
$('bStop').onclick=async()=>{try{await api(live&&live.running?'stop':'resume',{});refresh();}catch(e){toast(e.message);}};
$('bHome').onclick=async()=>{await api('close',{});D=null;refresh.v=null;$('bHome').style.display='none';$('bPack').style.display='none';showTab();loadRecent();};
$('bPack').onclick=async()=>{const hv=$('hideSel').selectedOptions[0];
  if(!confirm('zip 을 만듭니다. 공개 범위: '+(hv?hv.textContent:'모두 공개')+'\n(받는 사람이 처음 열 때의 공개 범위입니다)'))return;
  toast('zip 을 만드는 중… (리플레이가 많으면 1~2분)',60000);
  try{const r=await api('pack',{hide:hideCol===Infinity?null:hideColTeams()});toast('저장했습니다: '+r.path,9000);}catch(e){toast('실패: '+e.message,6000);}};
function hideColTeams(){if(hideCol===M().GF.col)return 'GF';const k=D.bracket.k,size=D.bracket.size;for(let r=2;r<=k;r++){const t=size>>(r-1);if(hideColForTeams(t)===hideCol)return t;}return null;}
async function pick(kind,target){try{const r=await api('pick',{kind});if(r.path)$(target).value=r.path;return r.path;}catch(e){toast(e.message);}}
$('hPickBots').onclick=()=>pick('dir','hBots');$('hPickOut').onclick=()=>pick('dir','hOut');$('hPickOpen').onclick=()=>pick('dir','hOpen');$('hPickZip').onclick=()=>pick('zip','hOpen');
$('hScan').onclick=async()=>{const o=$('hScanOut');o.style.display='block';o.innerHTML='<div>확인 중…</div>';
  try{const r=await api('scan',{bots:$('hBots').value});const bad=r.bots.filter(b=>!b.ok);
    o.innerHTML=`<div><b>${r.bots.length}개</b> 봇 · 코드 검사 통과 ${r.bots.length-bad.length} · 불합격 ${bad.length} (불합격 봇도 참가하지만 판마다 실격으로 진다)</div>`+
      r.bots.map(b=>`<div class="${b.ok?'':'bad'}">${b.ok?'✓':'✗'} ${esc(b.name)}${b.ok?'':' — '+esc(b.problems.join(' / '))}</div>`).join('');
    $('hStart').disabled=r.bots.length<2;$('hEst').textContent=r.estimate;if(!$('hJobs').value)$('hJobs').value=r.jobs;
    if(!$('hOut').value)$('hOut').value=r.default_out;}catch(e){o.innerHTML='<div class="bad">'+esc(e.message)+'</div>';}};
$('hStart').onclick=async()=>{try{toast('맵을 만들고 시작합니다…');await api('create',{bots:$('hBots').value,name:$('hName').value,out:$('hOut').value,
      maps:+$('hMaps').value,rounds:+$('hRounds').value,jobs:+$('hJobs').value||null});refresh.v=null;await refresh(true);}catch(e){toast('시작할 수 없습니다: '+e.message,6000);}};
$('hLoad').onclick=async()=>{try{toast('여는 중…');await api('open',{path:$('hOpen').value});refresh.v=null;await refresh(true);}catch(e){toast('열 수 없습니다: '+e.message,6000);}};
async function loadRecent(){try{const r=await api('recent');$('hRecent').innerHTML=r.items.length?r.items.map(it=>`<div class="click" data-p="${esc(it.path)}" style="cursor:pointer">${esc(it.name)} <span class="note">· ${it.teams}팀 · ${esc(it.phase)} · ${esc(it.path)}</span></div>`).join(''):'<div class="note">아직 없음</div>';
  $('hRecent').querySelectorAll('[data-p]').forEach(d=>d.onclick=()=>{$('hOpen').value=d.dataset.p;$('hLoad').click();});}catch(_){}}
(async function init(){
  if(location.protocol.startsWith('http')){try{const s=await api('status');APP=true;BASE='/t/';}catch(_){}}
  if(APP){loadRecent();await refresh(true);setInterval(()=>refresh(false),2000);if(!D)showTab();}
  else{const d=D;D=null;setData(d,true);}
  addEventListener('resize',()=>{});})();
</script>
