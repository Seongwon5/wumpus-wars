<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웜퍼스 워즈 — 리플레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0906; --panel:#16100b; --panel2:#1d150e; --line:#3b2b1a; --bronze:#8c6a3c; --bronze2:#c79a55;
  --text:#efe3cb; --dim:#a48f72; --red:#ff5a48; --blue:#3ccaff; --gold:#e8b64a; --ok:#7fc77a;
  --serif:"Cinzel","Noto Serif KR",serif; --kserif:"Noto Serif KR","Cinzel",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;
  background:radial-gradient(1200px 500px at 50% -10%,rgba(199,154,85,.10),transparent 70%),var(--bg)}
/* ---- 머리 ---- */
header{display:flex;align-items:center;gap:16px;padding:9px 18px;position:relative;
  background:linear-gradient(#1c140c,#120d08);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--bronze2),transparent);opacity:.7}
.logo{display:flex;align-items:baseline;gap:10px}
.logo .en{font-family:var(--serif);font-weight:800;font-size:21px;letter-spacing:.14em;
  background:linear-gradient(180deg,#fff0c2 0%,#e8b64a 45%,#9b6a24 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.logo .ko{font-family:var(--kserif);font-weight:600;font-size:13px;color:var(--bronze2);letter-spacing:.2em}
.logo .gem{width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,#ffe9a8,#b07a2c);box-shadow:0 0 8px rgba(232,182,74,.7);align-self:center}
header .sub{color:var(--dim);font-size:12.5px}
header .vs{margin-left:auto;font-family:var(--kserif);font-weight:800;font-size:19px}
.r{color:var(--red)} .b{color:var(--blue)}
/* ---- 점수판 ---- */
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:12px;padding:10px 14px;
  background:linear-gradient(#140e09,#100b07);border-bottom:1px solid var(--line)}
.tp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 14px;border-radius:6px;min-width:0;position:relative;
  background:linear-gradient(90deg,var(--tc2),rgba(22,16,11,.85) 70%);
  border:1px solid var(--bronze);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 3px rgba(140,106,60,.18),0 4px 18px rgba(0,0,0,.45)}
.tp.t1{flex-direction:row-reverse;background:linear-gradient(270deg,var(--tc2),rgba(22,16,11,.85) 70%)}
.tp::before,.tp::after{content:"";position:absolute;top:50%;width:10px;height:10px;transform:translateY(-50%) rotate(45deg);
  background:linear-gradient(135deg,#f5d58a,#8c6a3c);border:1px solid #2a1d10}
.tp::before{left:-6px} .tp::after{right:-6px}
.tp.lead{border-color:var(--bronze2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 3px rgba(232,182,74,.28),0 0 22px -6px var(--tc)}
.tp .who{display:flex;flex-direction:column;min-width:0}
.tp.t1 .who{align-items:flex-end}
.tp .who .tn{font-size:11.5px;font-weight:700;color:var(--tc);letter-spacing:.08em;opacity:.85}
.tp .who .bn{font-family:var(--kserif);font-weight:800;font-size:26px;line-height:1.15;color:var(--tc);text-shadow:0 1px 0 #000,0 0 14px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
.tp .who .uc{font-size:11.5px;color:#cdbb9c;margin-top:1px;white-space:nowrap}
.stats{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.tp.t1 .stats{flex-direction:row-reverse}
.tp.t1 .st.hp .row{flex-direction:row-reverse}
.st{display:flex;align-items:center;gap:9px;background:linear-gradient(#0f0a06,#1a120b);border:1px solid #4a3620;border-radius:5px;padding:6px 12px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.06)}
.st svg{width:30px;height:30px;flex:none;display:block}
.st .lab{font-family:var(--kserif);font-size:11px;color:var(--dim);line-height:1;white-space:nowrap;letter-spacing:.05em}
.st .val{font-family:var(--serif);font-size:27px;font-weight:800;line-height:1.08;font-variant-numeric:tabular-nums}
.st.ore .val{color:#ffd978;text-shadow:0 0 14px rgba(232,182,74,.45)}
.st.gold .val{color:#e9c27a}
/* 바친 금 = 승패를 가르는 점수: 가장 크게 */
.st.ore{padding:6px 16px 6px 12px;border-color:#a8813f;background:linear-gradient(#2a1d0e,#1a120b);
  box-shadow:inset 0 1px 0 rgba(255,220,150,.12),0 0 18px -6px rgba(232,182,74,.55)}
.st.ore svg{width:40px;height:40px}
.st.ore .lab{font-size:12.5px;color:#d9b77a}
.st.ore .val{font-size:40px;line-height:1}
/* 금고 = 생산에 쓰는 돈: 작은 보조 칸 */
.st.gold{padding:4px 9px;gap:6px;opacity:.9}
.st.gold svg{width:20px;height:20px}
.st.gold .val{font-size:19px}
.st.gold .lab{font-size:10px}
.st .dl{position:absolute;top:-9px;right:-4px;font-size:12px;font-weight:800;padding:0 5px;border-radius:4px;opacity:0;pointer-events:none}
.st .dl.up{color:#14200d;background:#9fd88a}
.st .dl.dn{color:#2a0b0b;background:#f08a7a}
.st .dl.go{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.st.hp{flex:1 1 100%;flex-direction:column;align-items:stretch;gap:4px;padding:5px 12px 8px}
.st.hp .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.st.hp .val{font-size:19px}
.hpbar{height:13px;border-radius:2px;background:#080503;overflow:hidden;position:relative;border:1px solid #5a4126;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.hpbar i{position:absolute;left:0;top:0;bottom:0;transition:width .35s;
  background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%,rgba(0,0,0,.25))!important}
.hpbar i.fill{background-color:var(--tc)}
.hpbar i.ghost{background-color:#fff2d0;opacity:.55;transition:width .9s .25s}
.hpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(0,0,0,.45) 9.5% 10%)}
.tp.t1 .hpbar i{left:auto;right:0}
.st.hp.hit{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.afford{display:flex;gap:4px;margin-top:3px}
.afford span{font-size:10px;padding:0 5px;border-radius:3px;border:1px solid #4a3620;color:#6d5a42;white-space:nowrap}
.afford span.ok{color:#f3e2b8;border-color:#a8813f;background:rgba(168,129,63,.25)}
#hudGold{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:2px 4px 0}
#hudGold .gl{font-family:var(--kserif);font-size:11px;color:var(--dim);letter-spacing:.2em;white-space:nowrap}
#hudGold .gn{font-family:var(--serif);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;min-width:56px;text-shadow:0 1px 0 #000}
#hudGold .gn.r{color:#ff8a78;text-align:right} #hudGold .gn.b{color:#7cc4ff;text-align:left}
#tug{flex:1;position:relative;height:16px;border-radius:8px;background:#080503;border:1px solid #3b2b1a;box-shadow:inset 0 1px 3px #000}
#tug i{position:absolute;top:0;bottom:0;transition:width .45s ease}
#tugL{left:0;border-radius:8px 0 0 8px;background:linear-gradient(90deg,#7a1f17,#e5533f)}
#tugR{right:0;border-radius:0 8px 8px 0;background:linear-gradient(270deg,#15466e,#3b9be0)}
#tug u{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(243,226,184,.45)}
#tugM{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;transform:rotate(45deg);border-radius:3px;transition:left .45s ease;
  background:linear-gradient(135deg,#fff3c4,#e8b64a 55%,#9a6a1c);border:1px solid #3b2b1a;box-shadow:0 0 10px rgba(255,210,110,.7)}
#tugM.flip{animation:tugFlip .7s ease-out}
@keyframes tugFlip{0%{box-shadow:0 0 0 rgba(255,240,180,0)}40%{box-shadow:0 0 26px 8px rgba(255,240,180,.95);transform:rotate(45deg) scale(1.5)}100%{transform:rotate(45deg)}}
#tugD{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .45s ease;font-family:var(--serif);font-size:11px;font-weight:800;color:#2a1a06;pointer-events:none;white-space:nowrap}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;min-width:140px;position:relative}
.mid .rd{font-family:var(--kserif);font-size:11px;color:var(--dim);letter-spacing:.3em}
.mid .rn{font-family:var(--serif);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:#f3e2b8}
.mid .rn small{font-size:13px;color:var(--dim);font-weight:600}
.mid .ld{font-family:var(--kserif);font-size:12px;font-weight:700;margin-top:2px;white-space:nowrap}
.mid .pr{width:120px;height:4px;border-radius:2px;background:#080503;margin-top:5px;overflow:hidden;border:1px solid #3b2b1a}
.mid .pr i{display:block;height:100%;background:linear-gradient(90deg,#8c6a3c,#e8b64a)}
@media (max-width:1100px){#hud{grid-template-columns:1fr}.mid{order:-1;flex-direction:row;gap:10px}.stats{flex-wrap:wrap}}
/* ---- 본문 ---- */
main{display:grid;grid-template-columns:1fr 320px;min-height:0}
#stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;
  background:radial-gradient(ellipse at center,#1c140c 0%,#0a0705 75%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.75);z-index:1}
#banner{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:10px 26px;border-radius:4px;
  background:linear-gradient(#2a1d10,#160f09);border:1px solid var(--bronze2);font-family:var(--kserif);font-weight:800;font-size:16px;
  display:none;white-space:nowrap;box-shadow:0 0 0 3px rgba(0,0,0,.6),0 0 30px rgba(232,182,74,.25);letter-spacing:.04em}
#hover{position:absolute;left:12px;bottom:10px;color:var(--dim);font-size:12px;background:rgba(14,10,6,.8);padding:3px 9px;border-radius:3px;border:1px solid #3b2b1a}
aside{border-left:1px solid var(--line);background:linear-gradient(#150f0a,#110c08);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.card{background:linear-gradient(#1e160e,#18110b);border:1px solid #4a3620;border-radius:5px;padding:10px 12px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,150,.05)}
.card h3{margin:0 0 7px;font-family:var(--kserif);font-size:12.5px;color:var(--bronze2);font-weight:700;letter-spacing:.12em;
  display:flex;align-items:center;gap:7px}
.card h3::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--bronze2)}
.card h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#5a4126,transparent)}
.team{display:flex;flex-direction:column;gap:4px}
.team .top{display:flex;justify-content:space-between;align-items:baseline}
.team .nm{font-family:var(--kserif);font-weight:800}
.team .bot{color:var(--dim);font-size:12px}
.stat{display:flex;gap:12px;font-size:13px}
.stat b{font-variant-numeric:tabular-nums;color:#f3e2b8}
.bar{height:7px;border-radius:2px;background:#080503;overflow:hidden;border:1px solid #3b2b1a}
.bar>i{display:block;height:100%}
#mind .line{font-size:13px;margin:2px 0}
#mind .k{color:var(--dim)}
#legend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12px;color:var(--dim);align-items:center}
#legend img{width:22px;height:22px;image-rendering:pixelated;object-fit:contain;justify-self:center}
#legend img.wide{width:30px;height:8px}
#legend b{color:#f3e2b8;font-weight:600}
#legend .lg-h{grid-column:1/-1;color:#c8a868;font-size:11px;letter-spacing:.06em;margin-top:4px;border-bottom:1px dashed #3b2b1a;padding-bottom:2px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
#log{font-size:12px;max-height:170px;overflow-y:auto;color:#d8c8aa}
#log div{padding:2px 0;border-bottom:1px dashed #3b2b1a}
#chart{width:100%;height:80px;display:block}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);background:linear-gradient(#120d08,#1a130c)}
button,select{background:linear-gradient(#2a1e12,#1a120b);color:var(--text);border:1px solid #5a4126;border-radius:4px;padding:5px 11px;font:inherit;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.08)}
button:hover,select:hover{border-color:var(--bronze2);color:#fff3d6}
select{color-scheme:dark}
select option{background:#1d150e;color:#efe3cb}
select option:checked{background:#5a3f1c;color:#fff3d6}
button.main{min-width:70px;font-weight:700;font-family:var(--kserif);border-color:var(--bronze2);background:linear-gradient(#5a3f1c,#2e2010)}
input[type=range]{flex:1;min-width:90px;accent-color:#c79a55}
#vol{flex:0 0 48px;min-width:48px}
#rlabel{font-family:var(--serif);font-variant-numeric:tabular-nums;min-width:120px;text-align:center;color:#e9d6ac}
label.ck{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:13px;cursor:pointer}
input[type=checkbox]{accent-color:#c79a55}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:15px}
.hint{font-size:12px;color:var(--dim)}
#three{position:absolute;inset:0}
#three canvas{display:block}
#banner,#hover{z-index:2}
#feed{position:absolute;left:14px;top:12px;z-index:2;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:46%}
#feed .it{pointer-events:auto;cursor:pointer} #feed .it:hover{border-color:var(--bronze2);filter:brightness(1.25)}
#feed .it.new{animation:feedIn .45s ease-out}
@keyframes feedIn{0%{transform:translateX(-18px);opacity:0;box-shadow:0 0 0 rgba(255,220,150,0)}55%{transform:none;box-shadow:0 0 14px rgba(255,220,150,.55)}100%{box-shadow:0 0 0 rgba(255,220,150,0)}}
#sl{flex:1;min-width:120px;position:relative;display:flex;align-items:center;height:28px}
#sl input{width:100%}
#marks{position:absolute;left:8px;right:8px;top:0;height:7px;pointer-events:none}
#marks i{position:absolute;top:0;width:3px;height:7px;margin-left:-1px;border-radius:1px;pointer-events:auto;cursor:pointer;opacity:.8;background:#e5533f}
#marks i:hover{height:11px;top:-2px;opacity:1;width:5px;margin-left:-2px}
#marks i.pit{background:#9fd3ff} #marks i.wump{background:#9adf3a} #marks i.lead{background:#f4e04d;height:4px} #marks i.end{background:#fff;width:4px}
.cbar{position:absolute;left:0;right:0;height:0;background:#000;z-index:1;pointer-events:none;transition:height .35s ease}
#cbarT{top:0} #cbarB{bottom:0}
#stage.cine .cbar{height:7%}
#bDrama.on{border-color:var(--bronze2);background:linear-gradient(#5a3f1c,#2e2010);color:#fff3d6}
#feed .it{font-size:12.5px;padding:3px 10px 3px 8px;border-radius:3px;background:rgba(14,10,6,.78);border:1px solid #3b2b1a;border-left:3px solid var(--bronze2);
  color:#e9dcc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed .it .rd{font-family:var(--serif);color:var(--dim);font-size:11px;margin-right:6px}
#feed .it.pit{border-left-color:#9fd3ff} #feed .it.kill{border-left-color:#e5533f} #feed .it.camp{border-left-color:#ffb347}
#feed .it.push{border-left-color:#f4e04d} #feed .it.wump{border-left-color:#9adf3a} #feed .it.loot{border-left-color:#ffd25a}
#scream{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;display:none;text-align:center;
  font-family:var(--kserif);font-weight:900;font-size:54px;letter-spacing:.08em;color:#d8ff6a;
  text-shadow:0 0 18px rgba(150,255,60,.85),0 0 46px rgba(120,220,40,.6),0 4px 0 #0b1a02,0 0 2px #000}
#scream small{display:block;font-size:17px;letter-spacing:.04em;color:#f3ffd8;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.9);margin-top:4px}
#scream.go{display:block;animation:scr 2.2s ease-out forwards}
@keyframes scr{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  22%{transform:translate(-50%,-50%) scale(1) rotate(-1deg)}30%{transform:translate(-50%,-50%) rotate(1deg)}38%{transform:translate(-50%,-50%) rotate(0)}
  80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1.04)}}
.face{width:22px;height:22px;image-rendering:pixelated;vertical-align:middle;margin:-5px 1px -3px 0;filter:drop-shadow(0 1px 0 #000)}
.vfaces .face{width:56px;height:56px;margin:0 4px}
#rulesTag{position:absolute;right:12px;bottom:10px;z-index:2;font-size:11.5px;color:#d8ffb0;background:rgba(14,10,6,.8);padding:3px 9px;border-radius:3px;border:1px solid #4a6a2a}
#victory{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,7,4,.35),rgba(10,7,4,.78));animation:vin .6s ease-out}
@keyframes vin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#victory .box{min-width:420px;max-width:80%;padding:26px 34px 22px;text-align:center;background:linear-gradient(#2a1d10,#140e08);border:1px solid var(--bronze2);border-radius:6px;
  box-shadow:0 0 0 4px rgba(0,0,0,.6),0 0 60px rgba(232,182,74,.35)}
#victory .crown{font-size:44px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,210,90,.6))}
#victory .who{font-family:var(--kserif);font-size:34px;font-weight:800;margin:8px 0 2px;letter-spacing:.04em;text-shadow:0 2px 0 #000}
#victory .why{color:var(--dim);font-size:14px;margin-bottom:14px}
#victory table{margin:0 auto 16px;border-collapse:collapse;font-size:14px}
#victory td,#victory th{padding:4px 14px;border-bottom:1px solid #3b2b1a}
#victory th{color:var(--dim);font-weight:600;font-size:12px}
#victory td.n{font-family:var(--serif);font-size:20px;font-weight:800;color:#f3e2b8}
#victory .btns{display:flex;gap:10px;justify-content:center}
#bSnd.on{border-color:var(--bronze2);color:#fff3d6}
#bSpec.on{border-color:var(--bronze2);background:linear-gradient(#5a3f1c,#2e2010);color:#fff3d6}
::-webkit-scrollbar{width:9px} ::-webkit-scrollbar-thumb{background:#3b2b1a;border-radius:4px} ::-webkit-scrollbar-track{background:#0f0a06}
</style>
<script>/*THREE_VENDOR*/</script>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="gem"></span><span class="en">WUMPUS WARS</span><span class="ko">웜퍼스 워즈</span></div>
    <span class="sub" id="metaline">리플레이 뷰어</span>
    <span class="vs" id="vsline"></span>
  </header>
  <div id="hud">
    <div class="tp t0" id="hud0"></div>
    <div class="mid" id="hudMid"></div>
    <div class="tp t1" id="hud1"></div>
    <div id="hudGold" title="바친 금 비율: 붉은 막대 : 푸른 막대 = 붉은 팀 바친 금 : 푸른 팀 바친 금. 표식의 숫자는 차이, 가운데 선이 동점"><span class="gl">바친 금</span><span class="gn r" id="tg0">0</span><div id="tug"><i id="tugL"></i><i id="tugR"></i><u></u><b id="tugM"></b><span id="tugD"></span></div><span class="gn b" id="tg1">0</span><span class="gl">바친 금</span></div>
  </div>
  <main>
    <div id="stage">
      <div id="three"></div>

<script id="replay-data" type="application/json">/*REPLAY_DATA*/</script>
<script>
'use strict';
const TEAM=[{name:'붉은 원정대',c:'#ff4a3a',d:'#9a2216',l:'#ffc2b0',rgb:'255,74,58'},{name:'푸른 원정대',c:'#2ec4ff',d:'#125f86',l:'#bfeaf5',rgb:'46,196,255'}];
const KIND={E:'탐험가',G:'궁수',B:'야영지'};
const AG=()=>!!(R&&R.const&&R.const.rules&&R.const.rules.agent);   // 시안 3: 유닛은 모험가 하나
const $=id=>document.getElementById(id);
let R=null,F=[],N=0,W=0,H=0,S=24;
let P=0,playing=false,speed=3,lastT=0;
let viewMode='all',mindMode='off',showTraps=true,selId=null;
let oreAt=[],revAt=[],visAt=[[],[]],seenAt=[[],[]],umap=[],dieAt=[],baseIds=[1,2];
let lootAt=[],wumAt=[],arrAt=[];   // 칸마다 떨어진 금, 웜퍼스 체력 (굴 순서)

// ---------- 명장면 ----------
// HL: 경기의 큰 사건 (재생 막대에 찍는다). SLOW: 그 가운데 재생을 늦출 것 (너무 잦지 않게 간격을 둔다)
let HL=[],SLOW=[],drama=true,slowNow=null;
const SLOW_GAP=25;
function buildHighlights(){
  HL=[];SLOW=[];
  const nm=(id,f)=>{const u=umap[f].get(id)||umap[Math.max(0,f-1)].get(id);return u?`${R.meta.teams[u[1]]} #${id}`:'#'+id;};
  let lead=0;
  for(let f=1;f<N;f++){
    for(const e of F[f].e||[]){
      if(e[0]==='trap')HL.push({f,k:'pit',x:e[2],y:e[3],big:1,t:`${nm(e[1],f)} 구덩이에 빠짐`});
      else if(e[0]==='eaten')HL.push({f,k:'wump',x:e[2],y:e[3],big:1,t:`${nm(e[1],f)} 웜퍼스에게 잡아먹힘`});
      else if(e[0]==='scream')HL.push({f,k:'wump',x:e[2],y:e[3],big:1,t:'웜퍼스가 쓰러짐'});
      else if(e[0]==='die'&&e[4]==='roar')HL.push({f,k:'wump',x:e[2],y:e[3],big:1,t:`${nm(e[1],f)} 웜퍼스에게 쓰러짐`});
      else if(e[0]==='die'&&e[4]==='atk'){const bi=baseIds.indexOf(e[1]);
        if(bi>=0)HL.push({f,k:'end',x:e[2],y:e[3],big:2,t:`${R.meta.teams[bi]} 야영지 파괴`});
        else HL.push({f,k:'kill',x:e[2],y:e[3],big:1,t:`${nm(e[1],f)} 쓰러짐`});}
    }
    const d=Math.sign(F[f].sc[0]-F[f].sc[1]);
    if(d&&d!==lead){if(lead)HL.push({f,k:'lead',x:R.map.bases[d>0?0:1][0],y:R.map.bases[d>0?0:1][1],big:0,t:`역전: ${R.meta.teams[d>0?0:1]} 앞섬`});lead=d;}
  }
  let last=-99;
  for(const h of HL)if(h.big&&(h.big>1||h.f-last>=SLOW_GAP)){SLOW.push(h);last=h.f;}
  $('marks').innerHTML=HL.map((h,i)=>`<i class="${h.k}" data-i="${i}" style="left:${(100*h.f/Math.max(1,N-1)).toFixed(2)}%" title="R${h.f} ${esc(h.t)}"></i>`).join('');
}
function gotoEvent(f,x,y){                         // 그 사건 직전으로 가서 그 자리를 비추고 재생한다
  jump(Math.max(0,f-1));
  if(window.View3D){View3D.setSpectate(false);$('bSpec').classList.remove('on');View3D.focus(x,y,11);}
  setPlay(true);
}
function slowAt(){                                 // 지금 재생 자리가 느리게 볼 사건의 앞뒤인가
  if(!drama)return null;
  for(const h of SLOW){const d=P-(h.f-1);if(d>-0.4&&d<1.2)return h;if(h.f-1>P+1)break;}
  return null;
}
function setSlow(h){
  if(h===slowNow)return;slowNow=h;
  $('stage').classList.toggle('cine',!!h);
  if(window.View3D&&View3D.cineStart){if(h)View3D.cineStart(h.x,h.y);else View3D.cineEnd();}
}

// ---------- 불러오기 ----------
function load(data){
  hudBuilt=false;hudLast=-1;
  R=data;F=R.frames;N=F.length;W=R.meta.w;H=R.meta.h;baseIds=R.map.base_ids||[1,2];
  const ore=new Map(R.map.ore.map(o=>[o[0]+','+o[1],o[2]]));
  const rev=new Set();oreAt=[];revAt=[];umap=[];dieAt=[];lootAt=[];wumAt=[];arrAt=[];let garr=new Map();
  let loot=new Map(),wh=(R.map.wumpus||[]).map(()=>(R.const.wumpus_hp||9));
  const seen=[new Uint8Array(W*H),new Uint8Array(W*H)];
  for(let i=0;i<N;i++){
    const fr=F[i];
    for(const [x,y,a] of fr.o||[]){const k=x+','+y; if(a>0)ore.set(k,a); else ore.delete(k);}
    oreAt.push(new Map(ore));
    if(fr.l)loot=new Map(fr.l.map(o=>[o[0]+','+o[1],o[2]])); lootAt.push(loot);
    if(fr.w)wh=fr.w; wumAt.push(wh);
    if(fr.ar)garr=new Map(fr.ar.map(o=>[o[0]+','+o[1],o[2]])); arrAt.push(garr);
    const dmap=new Map();
    for(const e of fr.e||[]){ if(e[0]==='trap')rev.add(e[2]+','+e[3]); if(e[0]==='die')dmap.set(e[1],e);}
    revAt.push(new Set(rev)); dieAt.push(dmap);
    umap.push(new Map(fr.u.map(u=>[u[0],u])));
    for(let t=0;t<2;t++){
      const v=decodeVis(fr.v[t]); visAt[t].push(v);
      for(let k=0;k<v.length;k++) if(v[k]) seen[t][k]=1;
      seenAt[t].push(seen[t].slice());
    }
  }
  $('drop').style.display='none';
  $('slider').max=N-1;
  const m=R.meta,symKo={H:'좌우',V:'상하',R:'180° 회전'};
  $('metaline').textContent=`맵 ${W}×${H} · 맵 시드 ${m.map_seed} · 대칭(정답) ${symKo[m.sym]} · ${m.rounds}라운드`;
  $('vsline').innerHTML=`<span class="r">${esc(m.names[0])}</span> &nbsp;vs&nbsp; <span class="b">${esc(m.names[1])}</span>`;
  const rl=R.const.rules;
  if(rl&&rl.agent){$('rulesTag').style.display='none';}   // 확정 규칙: 규칙 띠를 띄우지 않는다
  else if(rl&&rl.unified){$('rulesTag').style.display='block';$('rulesTag').textContent='규칙: 누구나 캐고 싸움 · 광부 이동+행동 · 궁수 사거리 '+(R.const.bow_range||3)+' · 밀치기 · 떨어진 금 · 웜퍼스';}
  else if(rl&&Object.values(rl).some(v=>v)){const on=[['line_shot','직선 화살'],['arrows','화살 '+(R.const.arrows||3)+'발'],['push','밀치기'],['loot','떨어진 금'],['wumpus','웜퍼스']].filter(([k])=>rl[k]).map(([,n])=>n);
    $('rulesTag').style.display='block';$('rulesTag').textContent='규칙: '+on.join(' · ');} else $('rulesTag').style.display='none';
  P=0;selId=null;layout();buildHighlights();
  if(window.View3D)View3D.build();
}
function decodeVis(hex){
  const v=new Uint8Array(W*H);
  for(let i=0;i<hex.length;i++){const n=parseInt(hex[i],16);for(let b=0;b<4;b++){const k=i*4+b;if(k<v.length)v[k]=(n>>b)&1;}}
  return v;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---------- 배치 ----------
function layout(){
  if(!R)return;
  const st=$('stage'),pad=24;
  S=Math.max(8,Math.floor(Math.min((st.clientWidth-pad*2)/W,(st.clientHeight-pad*2)/H)));
  if(window.View3D)View3D.resize();
}
function hash(x,y){let h=(x*374761393+y*668265263)^0x5bd1e995;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
// 재생 중에는 일정한 속도 (라운드가 바뀌어도 멈추지 않고 이어 걷는다), 멈춰 볼 때만 부드럽게 출발 · 도착
const ease=t=>(playing||stepTo!==null)?t:(t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2);

// ---------- 그리기 ----------
function draw(){
  if(!R)return;
  const f=Math.floor(P),a=P-f,g=Math.min(f+1,N-1),fi=(a>=0.5?g:f),moving=g!==f;
  const team=viewMode==='all'?-1:+viewMode;
  const vis=team>=0?visAt[team][fi]:null, seen=team>=0?seenAt[team][fi]:null;
  const canSee=(x,y)=>!vis||vis[y*W+x]===1;
  if(moving&&a>0.3&&(playing||stepTo!==null))snd.play(g,canSee); else if(!moving)snd.last=f;
  if(window.View3D)View3D.frame(f,g,a,fi,team,vis,seen);
  updateSide(fi);
}
function mindIds(fi,team){
  const d=F[fi].d||{};
  if(mindMode==='off')return [];
  if(mindMode==='sel')return selId!=null&&d[selId]?[selId]:[];
  return Object.keys(d).map(Number).filter(id=>{const t=teamOf(id,fi);return team<0||t===team;});
}
function teamOf(id,fi){ const bi=baseIds.indexOf(id); if(bi>=0)return bi; const u=umap[fi].get(id); return u?u[1]:-1;}

// ---------- 옆 패널 ----------
function selUnit(fi){
  if(selId==null)return null;
  const bi=baseIds.indexOf(selId);
  if(bi>=0){const [x,y]=R.map.bases[bi];return {id:selId,team:bi,kind:'B',x,y,hp:F[fi].bh[bi]};}
  const u=umap[fi].get(selId); if(!u)return null;
  return {id:u[0],team:u[1],kind:u[2],x:u[3],y:u[4],hp:u[5],carry:u[6],vib:u[7],arrows:u[8],stench:u[9]};
}
// ---- 점수판 (HUD) ----
const ICON={
  ore:'<svg viewBox="0 0 32 32"><defs><linearGradient id="gn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b0"/><stop offset=".45" stop-color="#e8b64a"/><stop offset="1" stop-color="#8a5a12"/></linearGradient></defs><path d="M6 22 9 13l7-4 8 3 3 9-6 5H11Z" fill="url(#gn)" stroke="#5a3a08" stroke-width="1.2"/><path d="M9 13l7 3 8-4M16 16l-5 10M16 16l5 10" stroke="#fff3c4" stroke-width=".8" opacity=".55" fill="none"/><path d="M24 5l1 2.5L27.5 8 25 9l-1 2.5L23 9l-2.5-1L23 7Z" fill="#fff8d8"/></svg>',
  gold:'<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="#d9a441" stroke="#6b4710" stroke-width="1.6"/><circle cx="16" cy="16" r="9" fill="none" stroke="#fff0b8" stroke-width="1" opacity=".6"/><path d="M16 9.5l2 4.2 4.6.6-3.4 3.2.9 4.6L16 19.9l-4.1 2.2.9-4.6-3.4-3.2 4.6-.6Z" fill="#8a5d14" opacity=".85"/></svg>',
  base:'<svg viewBox="0 0 24 24" style="width:13px;height:13px;display:inline;vertical-align:-2px"><path d="M12 3 2 20h20Z" fill="currentColor"/><path d="M12 11l-3.2 9h6.4Z" fill="#0d0906"/><path d="M12 3v-2" stroke="currentColor" stroke-width="1.5"/></svg>'};
let hudBuilt=false,hudLast=-1;
// LPC 얼굴 아이콘 (점수판 · 정보판)
const FACE={};
function face(k,t){
  const nmK=k==='E'?(AG()?'모험가':'탐험가'):'궁수';
  if(!window.SPRITES)return nmK;
  if(k==='E'&&AG()&&SPRITES.img['portrait_'+t])return `<img class="face" src="${SPRITES.img['portrait_'+t]}" alt="${nmK}" title="${nmK}">`;
  const nm=(k==='E'?((R&&R.const.rules&&R.const.rules.agent&&SPRITES.img['adventurer_'+t])?'adventurer_':'explorer_'):'archer_')+t;
  if(!SPRITES.img[nm])return nmK;
  let f=FACE[nm];
  if(!f){f=FACE[nm]={url:null};const im=new Image();
    im.onload=()=>{const m=SPRITES.meta.sheets[nm],C=SPRITES.meta.cell,r=m.idle.row+2,c=document.createElement('canvas');c.width=c.height=32;
      const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(im,32+18,r*C+32+10,28,28,0,0,32,32);f.url=c.toDataURL();hudLast=-1;lastSide=-1;};
    im.src=SPRITES.img[nm];}
  return f.url?`<img class="face" src="${f.url}" alt="${nmK}" title="${nmK}">`:nmK;
}
// '표시' 칸: 화면에 실제로 그리는 그림 그대로. 모험가가 느끼는 지각이 먼저, 관전자에게만 보이는 것이 나중
function sheetCrop(nm,col,row,sx,sy,sw,sh,cb){
  if(!window.SPRITES||!SPRITES.img[nm])return cb(null);
  const m=SPRITES.meta.sheets[nm],C=m.cell||SPRITES.meta.cell,im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=sw;c.height=sh;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
    g.drawImage(im,col*C+sx,row*C+sy,sw,sh,0,0,sw,sh);
    const d=g.getImageData(0,0,sw,sh).data;let x0=sw,y0=sh,x1=-1,y1=-1;          // 빈 테두리를 잘라 그림만 크게
    for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)if(d[(y*sw+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
    if(x1<0)return cb(c.toDataURL());
    const n=Math.max(x1-x0,y1-y0)+1,q=document.createElement('canvas');q.width=q.height=n;const gq=q.getContext('2d');gq.imageSmoothingEnabled=false;
    gq.drawImage(c,x0,y0,x1-x0+1,y1-y0+1,Math.floor((n-x1+x0-1)/2),Math.floor((n-y1+y0-1)/2),x1-x0+1,y1-y0+1);cb(q.toDataURL());};
  im.onerror=()=>cb(null);im.src=SPRITES.img[nm];
}
function buildLegend(){
  const el=$('legend');if(!el)return;
  const L=(window.View3D&&View3D.legend)?View3D.legend():{};
  const img=(u,cls)=>u?`<img src="${u}"${cls?` class="${cls}"`:''}>`:'<span></span>';
  const P=[['breeze','바람','상하좌우에 구덩이가 있다'],['stench','악취','상하좌우에 웜퍼스 굴이 있다'],['glitter','반짝임',(R.const.rules&&R.const.rules.v4)?'이 칸에 금맥':'이 칸에 금맥이나 떨어진 금'],
    ['bump','부딪힘','지난 이동이 막혔다 (벽 · 맵 끝 · 다른 모험가)'],['steps','발소리','상하좌우에 다른 모험가 (적 · 팀원 구분 없음). 발밑 칸 모서리에 표시'],['warmth','열기','상하좌우에 야영지 (어느 팀이든). 적 야영지를 찾는 단서'],['hurt','아픔','지난 차례 뒤 피해를 받았다']];
  let h='<div class="lg-h">머리 위 · 발밑: 모험가가 지금 느끼는 것</div>';
  for(const [k,n,d] of P)h+=`${img(L[k])}<span><b>${n}</b> · ${d}</span>`;
  h+=`${img(L.scream)}<span><b>비명</b> · 웜퍼스가 쓰러짐 (맵 전체가 듣는다, 화면 가운데 글자)</span>`;
  h+=`${img(L.cry)}<span><b>외침</b> · 모험가가 쓰러짐 (두 팀 모두, 맵 전체가 듣는다, 왼쪽 위 사건 알림)</span>`;
  h+='<div class="lg-h">모험가</div>';
  h+=`<span id="lg_adv"></span><span>모험가. 멀리서는 둥근 패, 가까이서는 도트 캐릭터</span>`;
  h+=`${img(L.hp,'wide')}<span>체력 (30% 이하면 주황)</span>`;

  const q=new URLSearchParams(location.hash.slice(1));   // 예: #cam=12,18,9 (칸 x,y 와 거리)
  if(R&&q.has('cam')){const [x,y,d]=q.get('cam').split(',').map(Number);View3D.focus(x,y,d||10);}
  };   // 화면은 3D 하나뿐이다 (2D 화면은 없앴다)
setTimeout(()=>{ if(!window.View3D){const b=$('banner');b.style.display='block';b.textContent='3D 화면을 띄울 수 없습니다 (브라우저의 WebGL 을 확인하세요)';} },6000);
window.addEventListener('resize',()=>{layout();lastSide=-1;});
// 다른 화면 (토너먼트 대진표) 이 보내 주는 리플레이: {type:'wumpus-replay', replay, round}
window.addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='wumpus-replay'||!d.replay)return;
  try{setPlay(false);}catch(_){} load(d.replay);lastSide=-1;if(typeof d.round==='number')P=Math.max(0,Math.min(N-1,d.round));});
// 끌어다 놓기
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;
  f.text().then(t=>{load(JSON.parse(t));lastSide=-1;});});

(function init(){
  const raw=$('replay-data').textContent.trim();
  if(raw&&raw!=='/*REPLAY_DATA*/'){try{load(JSON.parse(raw));}catch(e){console.error(e);$('drop').style.display='flex';}}
  else $('drop').style.display='flex';
  // 주소 예: viewer.html#r=60&view=0&mind=team&sel=3
  if(R&&location.hash.length>1){const q=new URLSearchParams(location.hash.slice(1));
    if(q.has('r'))P=Math.max(0,Math.min(N-1,+q.get('r')));
    if(q.has('view')){viewMode=q.get('view');$('viewSel').value=viewMode;}

    if(q.has('sel'))selId=+q.get('sel');}
  requestAnimationFrame(t=>{lastT=t;tick(t);});
})();
</script>
