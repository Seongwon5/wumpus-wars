<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웜퍼스 워즈 — 리플레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0906; --panel:#16100b; --panel2:#1d150e; --line:#3b2b1a; --bronze:#8c6a3c; --bronze2:#c79a55;
  --text:#efe3cb; --dim:#a48f72; --red:#ff5a48; --blue:#3ccaff; --gold:#e8b64a; --ok:#7fc77a;
  --serif:"Cinzel","Noto Serif KR",serif; --kserif:"Noto Serif KR","Cinzel",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;
  background:radial-gradient(1200px 500px at 50% -10%,rgba(199,154,85,.10),transparent 70%),var(--bg)}
/* ---- 머리 ---- */
header{display:flex;align-items:center;gap:16px;padding:9px 18px;position:relative;
  background:linear-gradient(#1c140c,#120d08);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--bronze2),transparent);opacity:.7}
.logo{display:flex;align-items:baseline;gap:10px}
.logo .en{font-family:var(--serif);font-weight:800;font-size:21px;letter-spacing:.14em;
  background:linear-gradient(180deg,#fff0c2 0%,#e8b64a 45%,#9b6a24 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.logo .ko{font-family:var(--kserif);font-weight:600;font-size:13px;color:var(--bronze2);letter-spacing:.2em}
.logo .gem{width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,#ffe9a8,#b07a2c);box-shadow:0 0 8px rgba(232,182,74,.7);align-self:center}
header .sub{color:var(--dim);font-size:12.5px}
header .vs{margin-left:auto;font-family:var(--kserif);font-weight:600}
.r{color:var(--red)} .b{color:var(--blue)}
/* ---- 점수판 ---- */
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:12px;padding:10px 14px;
  background:linear-gradient(#140e09,#100b07);border-bottom:1px solid var(--line)}
.tp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 14px;border-radius:6px;min-width:0;position:relative;
  background:linear-gradient(90deg,var(--tc2),rgba(22,16,11,.85) 70%);
  border:1px solid var(--bronze);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 3px rgba(140,106,60,.18),0 4px 18px rgba(0,0,0,.45)}
.tp.t1{flex-direction:row-reverse;background:linear-gradient(270deg,var(--tc2),rgba(22,16,11,.85) 70%)}
.tp::before,.tp::after{content:"";position:absolute;top:50%;width:10px;height:10px;transform:translateY(-50%) rotate(45deg);
  background:linear-gradient(135deg,#f5d58a,#8c6a3c);border:1px solid #2a1d10}
.tp::before{left:-6px} .tp::after{right:-6px}
.tp.lead{border-color:var(--bronze2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 3px rgba(232,182,74,.28),0 0 22px -6px var(--tc)}
.tp .who{display:flex;flex-direction:column;min-width:0}
.tp.t1 .who{align-items:flex-end}
.tp .who .tn{font-family:var(--kserif);font-weight:800;font-size:18px;color:var(--tc);letter-spacing:.02em;text-shadow:0 1px 0 #000}
.tp .who .bn{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.tp .who .uc{font-size:11.5px;color:#cdbb9c;margin-top:1px;white-space:nowrap}
.stats{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.tp.t1 .stats{flex-direction:row-reverse}
.tp.t1 .st.hp .row{flex-direction:row-reverse}
.st{display:flex;align-items:center;gap:9px;background:linear-gradient(#0f0a06,#1a120b);border:1px solid #4a3620;border-radius:5px;padding:6px 12px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.06)}
.st svg{width:30px;height:30px;flex:none;display:block}
.st .lab{font-family:var(--kserif);font-size:11px;color:var(--dim);line-height:1;white-space:nowrap;letter-spacing:.05em}
.st .val{font-family:var(--serif);font-size:27px;font-weight:800;line-height:1.08;font-variant-numeric:tabular-nums}
.st.ore .val{color:#ffd978;text-shadow:0 0 14px rgba(232,182,74,.45)}
.st.gold .val{color:#e9c27a}
/* 바친 금 = 승패를 가르는 점수: 가장 크게 */
.st.ore{padding:6px 16px 6px 12px;border-color:#a8813f;background:linear-gradient(#2a1d0e,#1a120b);
  box-shadow:inset 0 1px 0 rgba(255,220,150,.12),0 0 18px -6px rgba(232,182,74,.55)}
.st.ore svg{width:40px;height:40px}
.st.ore .lab{font-size:12.5px;color:#d9b77a}
.st.ore .val{font-size:40px;line-height:1}
/* 금고 = 생산에 쓰는 돈: 작은 보조 칸 */
.st.gold{padding:4px 9px;gap:6px;opacity:.9}
.st.gold svg{width:20px;height:20px}
.st.gold .val{font-size:19px}
.st.gold .lab{font-size:10px}
.st .dl{position:absolute;top:-9px;right:-4px;font-size:12px;font-weight:800;padding:0 5px;border-radius:4px;opacity:0;pointer-events:none}
.st .dl.up{color:#14200d;background:#9fd88a}
.st .dl.dn{color:#2a0b0b;background:#f08a7a}
.st .dl.go{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.st.hp{flex:1 1 100%;flex-direction:column;align-items:stretch;gap:4px;padding:5px 12px 8px}
.st.hp .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.st.hp .val{font-size:19px}
.hpbar{height:13px;border-radius:2px;background:#080503;overflow:hidden;position:relative;border:1px solid #5a4126;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.hpbar i{position:absolute;left:0;top:0;bottom:0;transition:width .35s;
  background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%,rgba(0,0,0,.25))!important}
.hpbar i.fill{background-color:var(--tc)}
.hpbar i.ghost{background-color:#fff2d0;opacity:.55;transition:width .9s .25s}
.hpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(0,0,0,.45) 9.5% 10%)}
.tp.t1 .hpbar i{left:auto;right:0}
.st.hp.hit{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.afford{display:flex;gap:4px;margin-top:3px}
.afford span{font-size:10px;padding:0 5px;border-radius:3px;border:1px solid #4a3620;color:#6d5a42;white-space:nowrap}
.afford span.ok{color:#f3e2b8;border-color:#a8813f;background:rgba(168,129,63,.25)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;min-width:140px;position:relative}
.mid .rd{font-family:var(--kserif);font-size:11px;color:var(--dim);letter-spacing:.3em}
.mid .rn{font-family:var(--serif);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:#f3e2b8}
.mid .rn small{font-size:13px;color:var(--dim);font-weight:600}
.mid .ld{font-family:var(--kserif);font-size:12px;font-weight:700;margin-top:2px;white-space:nowrap}
.mid .pr{width:120px;height:4px;border-radius:2px;background:#080503;margin-top:5px;overflow:hidden;border:1px solid #3b2b1a}
.mid .pr i{display:block;height:100%;background:linear-gradient(90deg,#8c6a3c,#e8b64a)}
@media (max-width:1100px){#hud{grid-template-columns:1fr}.mid{order:-1;flex-direction:row;gap:10px}.stats{flex-wrap:wrap}}
/* ---- 본문 ---- */
main{display:grid;grid-template-columns:1fr 320px;min-height:0}
#stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;
  background:radial-gradient(ellipse at center,#1c140c 0%,#0a0705 75%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.75);z-index:1}
canvas#cv{display:block;border-radius:3px;box-shadow:0 0 0 2px #3b2b1a,0 0 0 4px #120d08,0 0 0 5px #8c6a3c,0 12px 50px rgba(0,0,0,.7);cursor:pointer}
#banner{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:10px 26px;border-radius:4px;
  background:linear-gradient(#2a1d10,#160f09);border:1px solid var(--bronze2);font-family:var(--kserif);font-weight:800;font-size:16px;
  display:none;white-space:nowrap;box-shadow:0 0 0 3px rgba(0,0,0,.6),0 0 30px rgba(232,182,74,.25);letter-spacing:.04em}
#hover{position:absolute;left:12px;bottom:10px;color:var(--dim);font-size:12px;background:rgba(14,10,6,.8);padding:3px 9px;border-radius:3px;border:1px solid #3b2b1a}
aside{border-left:1px solid var(--line);background:linear-gradient(#150f0a,#110c08);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.card{background:linear-gradient(#1e160e,#18110b);border:1px solid #4a3620;border-radius:5px;padding:10px 12px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,150,.05)}
.card h3{margin:0 0 7px;font-family:var(--kserif);font-size:12.5px;color:var(--bronze2);font-weight:700;letter-spacing:.12em;
  display:flex;align-items:center;gap:7px}
.card h3::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--bronze2)}
.card h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#5a4126,transparent)}
.team{display:flex;flex-direction:column;gap:4px}
.team .top{display:flex;justify-content:space-between;align-items:baseline}
.team .nm{font-family:var(--kserif);font-weight:800}
.team .bot{color:var(--dim);font-size:12px}
.stat{display:flex;gap:12px;font-size:13px}
.stat b{font-variant-numeric:tabular-nums;color:#f3e2b8}
.bar{height:7px;border-radius:2px;background:#080503;overflow:hidden;border:1px solid #3b2b1a}
.bar>i{display:block;height:100%}
#mind .line{font-size:13px;margin:2px 0}
#mind .k{color:var(--dim)}
#legend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12px;color:var(--dim);align-items:center}
#legend img{width:22px;height:22px;image-rendering:pixelated;object-fit:contain;justify-self:center}
#legend img.wide{width:30px;height:8px}
#legend b{color:#f3e2b8;font-weight:600}
#legend .lg-h{grid-column:1/-1;color:#c8a868;font-size:11px;letter-spacing:.06em;margin-top:4px;border-bottom:1px dashed #3b2b1a;padding-bottom:2px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
#log{font-size:12px;max-height:170px;overflow-y:auto;color:#d8c8aa}
#log div{padding:2px 0;border-bottom:1px dashed #3b2b1a}
#chart{width:100%;height:80px;display:block}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);background:linear-gradient(#120d08,#1a130c)}
button,select{background:linear-gradient(#2a1e12,#1a120b);color:var(--text);border:1px solid #5a4126;border-radius:4px;padding:5px 11px;font:inherit;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.08)}
button:hover,select:hover{border-color:var(--bronze2);color:#fff3d6}
select{color-scheme:dark}
select option{background:#1d150e;color:#efe3cb}
select option:checked{background:#5a3f1c;color:#fff3d6}
button.main{min-width:70px;font-weight:700;font-family:var(--kserif);border-color:var(--bronze2);background:linear-gradient(#5a3f1c,#2e2010)}
input[type=range]{flex:1;min-width:160px;accent-color:#c79a55}
#rlabel{font-family:var(--serif);font-variant-numeric:tabular-nums;min-width:120px;text-align:center;color:#e9d6ac}
label.ck{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:13px;cursor:pointer}
input[type=checkbox]{accent-color:#c79a55}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:15px}
.hint{font-size:12px;color:var(--dim)}
#three{position:absolute;inset:0;display:none}
#three canvas{display:block}
#banner,#hover{z-index:2}
#feed{position:absolute;left:14px;top:12px;z-index:2;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:46%}
#feed .it{font-size:12.5px;padding:3px 10px 3px 8px;border-radius:3px;background:rgba(14,10,6,.78);border:1px solid #3b2b1a;border-left:3px solid var(--bronze2);
  color:#e9dcc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed .it .rd{font-family:var(--serif);color:var(--dim);font-size:11px;margin-right:6px}
#feed .it.pit{border-left-color:#9fd3ff} #feed .it.kill{border-left-color:#e5533f} #feed .it.camp{border-left-color:#ffb347}
#feed .it.push{border-left-color:#f4e04d} #feed .it.wump{border-left-color:#9adf3a} #feed .it.loot{border-left-color:#ffd25a}
#scream{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;display:none;text-align:center;
  font-family:var(--kserif);font-weight:900;font-size:54px;letter-spacing:.08em;color:#d8ff6a;
  text-shadow:0 0 18px rgba(150,255,60,.85),0 0 46px rgba(120,220,40,.6),0 4px 0 #0b1a02,0 0 2px #000}
#scream small{display:block;font-size:17px;letter-spacing:.04em;color:#f3ffd8;text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.9);margin-top:4px}
#scream.go{display:block;animation:scr 2.2s ease-out forwards}
@keyframes scr{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  22%{transform:translate(-50%,-50%) scale(1) rotate(-1deg)}30%{transform:translate(-50%,-50%) rotate(1deg)}38%{transform:translate(-50%,-50%) rotate(0)}
  80%{opacity:1}100%{opacity:0;transform:translate(-50%,-56%) scale(1.04)}}
.face{width:22px;height:22px;image-rendering:pixelated;vertical-align:middle;margin:-5px 1px -3px 0;filter:drop-shadow(0 1px 0 #000)}
.vfaces .face{width:56px;height:56px;margin:0 4px}
#rulesTag{position:absolute;right:12px;bottom:10px;z-index:2;font-size:11.5px;color:#d8ffb0;background:rgba(14,10,6,.8);padding:3px 9px;border-radius:3px;border:1px solid #4a6a2a}
#victory{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(10,7,4,.35),rgba(10,7,4,.78));animation:vin .6s ease-out}
@keyframes vin{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#victory .box{min-width:420px;max-width:80%;padding:26px 34px 22px;text-align:center;background:linear-gradient(#2a1d10,#140e08);border:1px solid var(--bronze2);border-radius:6px;
  box-shadow:0 0 0 4px rgba(0,0,0,.6),0 0 60px rgba(232,182,74,.35)}
#victory .crown{font-size:44px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,210,90,.6))}
#victory .who{font-family:var(--kserif);font-size:34px;font-weight:800;margin:8px 0 2px;letter-spacing:.04em;text-shadow:0 2px 0 #000}
#victory .why{color:var(--dim);font-size:14px;margin-bottom:14px}
#victory table{margin:0 auto 16px;border-collapse:collapse;font-size:14px}
#victory td,#victory th{padding:4px 14px;border-bottom:1px solid #3b2b1a}
#victory th{color:var(--dim);font-weight:600;font-size:12px}
#victory td.n{font-family:var(--serif);font-size:20px;font-weight:800;color:#f3e2b8}
#victory .btns{display:flex;gap:10px;justify-content:center}
#bSnd.on{border-color:var(--bronze2);color:#fff3d6}
#bSpec.on{border-color:var(--bronze2);background:linear-gradient(#5a3f1c,#2e2010);color:#fff3d6}
::-webkit-scrollbar{width:9px} ::-webkit-scrollbar-thumb{background:#3b2b1a;border-radius:4px} ::-webkit-scrollbar-track{background:#0f0a06}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="gem"></span><span class="en">WUMPUS WARS</span><span class="ko">웜퍼스 워즈</span></div>
    <span class="sub" id="metaline">리플레이 뷰어</span>
    <span class="vs" id="vsline"></span>
  </header>
  <div id="hud">
    <div class="tp t0" id="hud0"></div>
    <div class="mid" id="hudMid"></div>
    <div class="tp t1" id="hud1"></div>
  </div>
  <main>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="three"></div>
      <div id="banner"></div>
      <div id="hover"></div>
      <div id="feed"></div>
      <div id="scream"></div>
      <div id="rulesTag" style="display:none"></div>
      <div id="victory"></div>
      <div id="drop">리플레이가 없습니다.<br><code>python -m wumpus run logic random</code> 으로 만든<br>replays/*.json 파일을 이 창에 끌어다 놓으세요.</div>
    </div>
    <aside>
      <div class="card team" id="team0"></div>
      <div class="card team" id="team1"></div>
      <div class="card"><h3>바친 금 추이</h3><canvas id="chart"></canvas></div>
      <div class="card" id="mind" style="display:none"><h3>봇의 머릿속</h3><div id="mindbody" class="hint">유닛이나 야영지를 누르면 그 유닛이 아는 것과 추론한 것이 보입니다.</div></div>
      <div class="card"><h3>표시</h3>
        <div id="legend"></div>
      </div>
      <div class="card"><h3>이번 라운드 사건</h3><div id="log"></div></div>
    </aside>
  </main>
  <footer>
    <button id="b3d" title="2D / 3D 바꾸기" style="display:none">2D 보기</button>
    <button id="bCam" title="카메라를 처음 위치로 (끌어서 돌리기 · 휠로 확대)">카메라 ↺</button>
    <button id="bSpec" title="싸움 · 사고가 난 곳을 카메라가 따라간다 (끌면 꺼짐)">관전 카메라</button>
    <button id="bSnd" class="on" title="효과음 켜기 / 끄기">소리 켬</button>
    <button id="bStart" title="처음으로">⏮</button>
    <button id="bPrev" title="한 라운드 뒤로 (←)">◀</button>
    <button id="bPlay" class="main" title="재생 / 정지 (Space)">▶ 재생</button>
    <button id="bNext" title="한 라운드 앞으로 (→)">▶</button>
    <button id="bEnd" title="끝으로">⏭</button>
    <input type="range" id="slider" min="0" max="1" value="0" step="1">
    <span id="rlabel">라운드 0</span>
    <select id="speed" title="재생 속도">
      <option value="1.5">느리게</option><option value="3" selected>보통</option><option value="6">빠르게</option><option value="15">아주 빠르게</option>
    </select>
    <select id="viewSel" title="누구의 눈으로 볼지">
      <option value="all">전체 보기</option><option value="0">붉은 원정대 시야</option><option value="1">푸른 원정대 시야</option>
    </select>
    <select id="mindSel" title="머릿속 보기" style="display:none">
      <option value="sel">머릿속: 선택 유닛</option><option value="team">머릿속: 팀 전체</option><option value="off">머릿속: 끔</option>
    </select>
    <label class="ck" style="display:none"><input type="checkbox" id="ckTrap" checked>숨은 구덩이</label>

function decodeVis(hex){

}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---------- 배치 ----------

function spr2(name){

  let o=SPR2[name];
  if(!o){o=SPR2[name]={img:new Image(),m:SPRITES.meta.sheets[name],ok:false};
    o.img.onload=()=>{o.ok=true;if(['floor','wall_top','wall_side','pit'].includes(name)&&R)buildStatic();requestAnimationFrame(()=>{try{draw();}catch(e){}});};o.img.src=SPRITES.img[name];}

  ctx.drawImage(o.img,c*C,row*ch,C,ch,X-size/2,Yfoot-size*ch/C*foot/ch,size,size*ch/C);ctx.restore();return true;

    g.fillStyle=`hsl(${33+r*6},26%,${38+r*8}%)`;g.fillRect(px+i,py+i,S-2*i,S-2*i-lift);

  const X=i=>4+(w-8)*i/Math.max(1,N-1),Y=v=>h-6-(h-14)*v/mx;
  g.strokeStyle='#3b2b1a';g.beginPath();g.moveTo(4,h-6);g.lineTo(w-4,h-6);g.stroke();
  for(let t=0;t<2;t++){g.strokeStyle=TEAM[t].c;g.lineWidth=2;g.beginPath();F.forEach((fr,i)=>{i?g.lineTo(X(i),Y(fr.sc[t])):g.moveTo(X(i),Y(fr.sc[t]));});g.stroke();}
  g.strokeStyle='rgba(232,182,74,.7)';g.lineWidth=1;g.beginPath();g.moveTo(X(fi),2);g.lineTo(X(fi),h-4);g.stroke();
  g.fillStyle='#a48f72';g.font='11px serif';g.fillText(String(mx),6,12);
}

// ---------- 조작 ----------
function tick(t){
  const dt=Math.min(0.1,(t-lastT)/1000);lastT=t;
  if(playing&&R){P+=dt*speed;if(P>=N-1){P=N-1;setPlay(false);}}
  else if(stepTo!==null&&R){const v=Math.max(2.5,speed*0.8)*dt;if(Math.abs(stepTo-P)<=v){P=stepTo;stepTo=null;}else P+=Math.sign(stepTo-P)*v;}
  draw();requestAnimationFrame(tick);
}
function setPlay(v){playing=v;if(v)stepTo=null;$('bPlay').textContent=v?'⏸ 정지':'▶ 재생';if(v&&P>=N-1)P=0;}
let stepTo=null;
function jump(v){stepTo=null;P=Math.max(0,Math.min(N-1,v));setPlay(false);}
// 한 라운드씩: 순간이동 대신 짧게 걸어가며 넘어간다
function step(d){setPlay(false);const base=stepTo!==null?stepTo:Math.round(P);stepTo=Math.max(0,Math.min(N-1,base+d));}
$('bPlay').onclick=()=>setPlay(!playing);
$('bPrev').onclick=()=>step(-1);
$('bNext').onclick=()=>step(1);
$('bStart').onclick=()=>jump(0);
$('bEnd').onclick=()=>jump(N-1);
$('slider').oninput=e=>jump(+e.target.value);
$('speed').onchange=e=>speed=+e.target.value;
$('viewSel').onchange=e=>{viewMode=e.target.value;lastSide=-1;feedFi=-1;};
$('mindSel').onchange=e=>{mindMode=e.target.value;};
$('ckTrap').onchange=e=>showTraps=e.target.checked;
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();setPlay(!playing);}
  else if(e.code==='ArrowRight'){step(1);}
  else if(e.code==='ArrowLeft'){step(-1);}
});
function cellAt(ev){const r=cv.getBoundingClientRect();return [Math.floor((ev.clientX-r.left)/S),Math.floor((ev.clientY-r.top)/S)];}
function selectCell(x,y){
  if(!R)return;const fi=Math.round(P);
  let hit=null;for(const u of F[fi].u)if(u[3]===x&&u[4]===y)hit=u[0];
  R.map.bases.forEach(([bx,by],t)=>{if(bx===x&&by===y)hit=baseIds[t];});
  selId=hit;lastSide=-1;
}
function hoverCell(x,y){
  if(!R||x<0||y<0||x>=W||y>=H)return;
  const fi=Math.round(P),k=x+','+y;let s=`(${x}, ${y}) `;
  const wi=(R.map.wumpus||[]).findIndex(([a,b])=>a===x&&b===y);
  if(R.map.rows[y][x]==='#')s+='벽';else if(wi>=0)s+=wumAt[fi][wi]>0?`웜퍼스 굴 (체력 ${wumAt[fi][wi]})`:'쓰러진 웜퍼스';else if(oreAt[fi].has(k))s+='금 '+oreAt[fi].get(k);else if(R.map.traps.some(([a,b])=>a===x&&b===y))s+='구덩이 (봇은 바람으로만 안다)';else s+='빈 칸';
  if(lootAt[fi].has(k))s+=` · 떨어진 금 ${lootAt[fi].get(k)}`;
  if(arrAt[fi].has(k))s+=` · 떨어진 화살 ${arrAt[fi].get(k)}`;
  $('hover').textContent=s;
}
cv.addEventListener('click',ev=>{const [x,y]=cellAt(ev);selectCell(x,y);});
cv.addEventListener('mousemove',ev=>{const [x,y]=cellAt(ev);hoverCell(x,y);});
function applyMode(){
  const on=mode3d&&!!window.View3D;
  cv.style.display=on?'none':'block';$('three').style.display=on?'block':'none';
  $('b3d').textContent=mode3d?'2D 보기':'3D 보기';$('bCam').style.display=on?'':'none';$('bSpec').style.display=on?'':'none';
  if(on){View3D.resize();}
}
$('b3d').onclick=()=>{ if(!window.View3D){$('b3d').textContent='3D (인터넷 필요)';return;} mode3d=!mode3d;applyMode();};
$('bCam').onclick=()=>{if(window.View3D){View3D.setSpectate(false);$('bSpec').classList.remove('on');View3D.resetCam();}};
$('bSpec').onclick=()=>{if(!window.View3D)return;const on=!$('bSpec').classList.contains('on');$('bSpec').classList.toggle('on',on);View3D.setSpectate(on);};
window.onSpectateOff=()=>$('bSpec').classList.remove('on');
$('bSnd').onclick=()=>{snd.init();snd.on=!snd.on;$('bSnd').classList.toggle('on',snd.on);$('bSnd').textContent=snd.on?'소리 켬':'소리 끔';};
window.onView3DReady=()=>{ if(R)View3D.build(); applyMode(); buildLegend();
  const q=new URLSearchParams(location.hash.slice(1));   // 예: #cam=12,18,9 (칸 x,y 와 거리)
  if(R&&q.has('cam')){const [x,y,d]=q.get('cam').split(',').map(Number);View3D.focus(x,y,d||10);}
  };   // 2D 화면은 없앴다 (3D 를 못 불러올 때만 비상용으로 쓴다)
setTimeout(()=>{ if(!window.View3D){mode3d=false;applyMode();$('b3d').textContent='3D (인터넷 필요)';} },6000);
window.addEventListener('resize',()=>{layout();lastSide=-1;});
// 끌어다 놓기
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;
  f.text().then(t=>{load(JSON.parse(t));lastSide=-1;});});

(function init(){
  const raw=$('replay-data').textContent.trim();
  if(raw&&raw!=='/*REPLAY_DATA*/'){try{load(JSON.parse(raw));}catch(e){console.error(e);$('drop').style.display='flex';}}
  else $('drop').style.display='flex';
  // 주소 예: viewer.html#r=60&view=0&mind=team&sel=3
  if(R&&location.hash.length>1){const q=new URLSearchParams(location.hash.slice(1));
    if(q.has('r'))P=Math.max(0,Math.min(N-1,+q.get('r')));
    if(q.has('view')){viewMode=q.get('view');$('viewSel').value=viewMode;}

    if(q.has('sel'))selId=+q.get('sel');}
  mode3d=false;applyMode();mode3d=true;
  requestAnimationFrame(t=>{lastT=t;tick(t);});
})();
</script>

  });

  for (let y = 26; y <= 33; y++) { const half = 4 + (y - 26) * 0.45, x0 = Math.round(16.5 - half); K.R(x0, y, Math.round(half * 2) + 1, 1, y === 33 ? Td : T); }

  K.R(14, 21, 5, 5, cors); K.R(14, 21, 1, 5, corsL); K.P(16, 22, '#ffc63a'); K.P(16, 24, '#ffc63a');
  // 팔
  const sw = fr === 1 ? 1 : fr === 2 ? -1 : 0;
  K.R(11, 17, 2, 8, blouse); K.R(11, 17, 1, 8, blouseD);
  K.R(20, 17 - sw, 2, 8, blouse); K.R(21, 17 - sw, 1, 8, blouseD); K.R(20, 25 - sw, 2, 2, skin);
  // 활
  for (let y = 8; y <= 40; y++) { const t = (y - 8) / 32, x = Math.round(9 - Math.sin(Math.PI * t) * 4); K.P(x, y, t < 0.06 || t > 0.94 ? '#e0c070' : wood); K.P(x + 1, y, t < 0.06 || t > 0.94 ? '#e0c070' : woodL); }
  K.L(10, 9, 10, 39, '#d8d2c0');
  K.R(10, 24, 2, 2, skin);
  // 머리카락 · 꽁지머리
  K.R(15, 15, 3, 2, skinD);
  K.E(16.5, 9.5, 4.6, 4.3, hair);
  K.E(21.5, 9, 1.8, 2.5, hair); K.E(22, 13.5, 1.4, 3.2, hair, (x, y, dx) => dx > 0.2 ? hairD : hair);
  K.P(20, 7, T);

  K.E(16.5, 11.8, 3.4, 3.8, skin, (x, y, dx, dy) => dx > 0.5 || dy > 0.65 ? skinD : skin);
  K.R(13, 6, 7, 3, hair); K.P(13, 9, hair); K.P(19, 9, hair); K.P(18, 9, hair);
  K.R(14, 6, 3, 1, hairL); K.P(14, 7, hairL);

  K.R(15, 11, 1, 2, '#2e8a52'); K.R(18, 11, 1, 2, '#2e8a52');
  K.P(14, 13, '#e89a9a'); K.P(19, 13, '#e89a9a');

}

function drawWumpus(K, dead) {
  const bone = '#e4dcc2', boneD = '#a89e82';
  if (dead) {                                     // 해골과 갈비뼈
    for (let k = 0; k < 5; k++) { K.L(8 + k * 5, 37, 10 + k * 5, 30, '#d8d0b6', 2); K.P(10 + k * 5, 30, boneD); }

    K.L(14, 22, 7, 13, bone, 3); K.L(28, 22, 35, 13, bone, 3);
    K.E(18, 26, 1.8, 1.8, '#140e08'); K.E(24.5, 26, 1.8, 1.8, '#140e08');
    for (const x of [16, 19, 22, 25]) K.R(x, 31, 2, 2, bone);

  const fur = '#5f8a2e', furD = '#3c5a1c', furL = '#86b04a', belly = '#c2b46a', bellyD = '#9a8c4c';
  K.E(6, 30, 4, 6, furD); K.E(34, 30, 4, 6, furD);                                   // 팔 (뒤)
  for (let i = 0; i < 3; i++) { K.P(3 + i * 2, 36, bone); K.P(32 + i * 2, 36, bone); }
  K.E(20, 25, 14, 13, fur, (x, y, dx, dy) => { const s = dx * 0.6 + dy * 0.8; return s > 0.55 ? furD : s < -0.5 ? furL : (K.rn() < 0.08 ? furD : fur); });
  K.E(12, 38, 5, 2, furD); K.E(28, 38, 5, 2, furD);                                   // 발
  for (const x of [9, 11, 13, 25, 27, 29]) K.P(x, 39, bone);
  K.E(20, 30, 8.5, 7, belly, (x, y, dx, dy) => (y % 3 === 0 ? bellyD : dy > 0.55 ? bellyD : belly));
  K.L(10, 15, 5, 4, bone, 3); K.L(5, 4, 3, 1, bone, 2); K.L(30, 15, 35, 4, bone, 3); K.L(35, 4, 37, 1, bone, 2);   // 뿔
  K.L(11, 15, 6, 5, boneD, 1); K.L(31, 15, 36, 5, boneD, 1);
  K.R(10, 16, 8, 2, furD); K.R(23, 16, 8, 2, furD);                                   // 눈썹
  K.E(14, 19.5, 3, 2, '#e8ff50'); K.E(26, 19.5, 3, 2, '#e8ff50'); K.R(14, 18, 1, 3, '#140e08'); K.R(26, 18, 1, 3, '#140e08');
  K.R(11, 23, 19, 5, '#3a0a08'); K.R(12, 24, 17, 3, '#6a1810');                        // 입과 이빨
  for (const x of [12, 15, 18, 21, 24, 27]) { K.R(x, 23, 2, 1, bone); K.P(x, 24, bone); }
  for (const x of [13, 17, 22, 26]) { K.R(x, 27, 2, 1, bone); K.P(x, 26, bone); }
  K.outline('#0e1408');
}

function glowTex(kind, team, fr) {          // 마우스를 올렸을 때: 도트 테두리를 팀 색으로 (한 칸 더 두껍게)
  return pxMemo('glow' + kind + team + ':' + fr, () => {
    const src = bodyCanvas(kind, team, fr), w = src.width, h = src.height;
    const sd = src.getContext('2d').getImageData(0, 0, w, h).data;
    const A = (x, y) => x >= 0 && y >= 0 && x < w && y < h ? sd[(y * w + x) * 4 + 3] : 0;
    const dark = (x, y) => { const i = (y * w + x) * 4; return sd[i + 3] && sd[i] < 40 && sd[i + 1] < 30 && sd[i + 2] < 24; };
    const col = rgbOf(team >= 0 ? '#' + TC[team].l.toString(16).padStart(6, '0') : '#c8ff70'), hot = shade(col, 0.5);
    return pxTex(pxCanvas(w, h, K => {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (dark(x, y)) K.P(x, y, hot);
        else if (!A(x, y)) { let n = 0; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (A(x + dx, y + dy)) n++; if (n) K.P(x, y, col); }
      }
    }));
  });

  // ---- 팔 ----

    mesh(bow, new THREE.CylinderGeometry(0.0035, 0.0035, 0.58, 4), std(0xf2ead8), 0, 0, -0.088, false);
    mesh(L.hand, new THREE.CylinderGeometry(0.024, 0.024, 0.08, 8), mLeather2, 0, 0, 0.05);
    dagger = new THREE.Group(); dagger.position.set(0, -0.02, 0.03); dagger.rotation.x = Math.PI / 2; Rr.hand.add(dagger);
    mesh(dagger, new THREE.CylinderGeometry(0.014, 0.014, 0.07, 6), mLeather2, 0, -0.03, 0, false);
    mesh(dagger, RB(0.07, 0.012, 0.02, 0.005), mGold, 0, 0.01, 0, false);
    const bl = mesh(dagger, new THREE.ConeGeometry(0.022, 0.18, 4), std(0xe6eef8, {metalness: 0.9, roughness: 0.15, emissive: 0x334455, emissiveIntensity: 0.4}), 0, 0.11, 0, false);
    bl.scale.z = 0.3;

  const hp = hpBar(0.6);
  hp.position.y = 1.08;
  g.add(hp);
  const seg = G ? 6 : 32;
  const disc = new THREE.Group();
  const fillD = new THREE.Mesh(new THREE.CircleGeometry(0.36, seg).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({color: T.c, transparent: true, opacity: 0.28, depthWrite: false}));
  const rimD = new THREE.Mesh(new THREE.RingGeometry(0.33, 0.4, seg).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({color: T.c, transparent: true, opacity: 0.95, depthWrite: false}));
  if (G) { fillD.rotation.y = rimD.rotation.y = Math.PI / 6; }
  disc.add(fillD, rimD); disc.position.y = 0.015; disc.renderOrder = 4;
  g.add(disc);
  const badge = new THREE.Sprite(new THREE.SpriteMaterial({map: badgeTex(kind, team), color: 0xb4b4b4, transparent: true, depthTest: false, sizeAttenuation: false}));
  badge.position.y = 1.3; badge.scale.set(0.027, 0.027, 1); badge.renderOrder = 15;      // 화면에서 늘 같은 크기

  pool.scale.set(1.0, 1, 1.0); pool.position.y = 0.008; pool.renderOrder = 2; pool.visible = false; g.add(pool);   // 시안 3: 자기 칸만 비추는 등불

}

function setFlash(o, k) {
  if (o._flash === k) return;
  o._flash = k;
  if (o.token) { o.token.material.color.setRGB(1, 1 - k * 0.65, 1 - k * 0.65); o.pix.material.color.setRGB(1, 1 - k * 0.65, 1 - k * 0.65); }
  for (const m of o.flash) m.emissive.copy(m.userData.base).lerp(HITC, k);
}

function pose(o, st, a, now, id) {
  const {body, hipL, hipR, shL, shR} = o;
  hipL.rotation.set(0, 0, 0); hipR.rotation.set(0, 0, 0);
  shL.rotation.set(0, 0, 0); shR.rotation.set(0, 0, 0);
  body.position.set(0, 0, 0); body.rotation.set(0, 0, 0);
  if (o.kind === 'G') shL.rotation.x = -0.35;                    // 활을 낮게
  else shL.rotation.x = -0.6;                                    // 횃불을 앞으로
  if (st === 'walk') {
    const ph = a * Math.PI * 2, s = Math.sin(ph);
    hipL.rotation.x = s * 0.75; hipR.rotation.x = -s * 0.75;
    shL.rotation.x += -s * 0.55; shR.rotation.x = s * 0.55;
    body.position.y = Math.abs(Math.cos(ph)) * 0.05;
    body.rotation.x = 0.08;
  } else if (st === 'mine') {
    let t;
    if (a < 0.45) t = -2.7 * easeOut(a / 0.45);
    else if (a < 0.58) t = -2.7 + 2.3 * ((a - 0.45) / 0.13);
    else t = -0.4 * (1 - (a - 0.58) / 0.42);
    shR.rotation.x = t; shL.rotation.x = t * 0.8;
    body.rotation.x = a > 0.45 && a < 0.8 ? 0.22 : 0.05;
    hipL.rotation.x = 0.2; hipR.rotation.x = -0.25;
  } else if (st === 'attack') {
    const aim = a < 0.7 ? Math.min(1, a / 0.15) : 1 - (a - 0.7) / 0.3;
    shL.rotation.x = -1.5 * aim - 0.35 * (1 - aim);
    const draw = a < 0.18 ? a / 0.18 : a < 0.28 ? 1 : Math.max(0, 1 - (a - 0.28) / 0.1);
    shR.rotation.x = -1.45 * aim; shR.rotation.y = 0.9 * draw;
    body.rotation.y = -0.25 * aim;
    body.position.z = a > 0.28 && a < 0.45 ? -0.04 : 0;
    hipL.rotation.x = 0.3; hipR.rotation.x = -0.25;
  } else if (st === 'push') {                                     // 두 손으로 확 민다
    const k = Math.sin(Math.PI * Math.min(1, a / 0.55));
    shL.rotation.x = -1.55 * k - 0.3 * (1 - k); shR.rotation.x = -1.55 * k;
    body.position.z = 0.12 * k; body.rotation.x = 0.25 * k;
    hipL.rotation.x = 0.45 * k; hipR.rotation.x = -0.35 * k;
  } else if (st === 'stagger') {                                  // 밀려서 뒤로 휘청
    const k = Math.sin(Math.PI * Math.min(1, a));
    body.rotation.x = -0.45 * k; shL.rotation.x = -2.2 * k; shR.rotation.x = -2.2 * k;
    shL.rotation.z = 0.4 * k; shR.rotation.z = -0.4 * k;
    hipL.rotation.x = -0.4 * k; hipR.rotation.x = 0.3 * k;
  } else {                                                        // 숨쉬기
    const b = Math.sin(now * 2.2 + id);
    body.position.y = b * 0.012;
    shL.rotation.z += 0.05 + b * 0.03; shR.rotation.z = -0.05 - b * 0.03;
  }
  if (o.head) o.head.rotation.set(st === 'attack' ? -0.05 : Math.sin(now * 0.7 + id) * 0.05, st === 'idle' ? Math.sin(now * 0.45 + id * 1.3) * 0.35 : 0, 0);
  if (o.tail) o.tail.rotation.x = 0.2 + Math.sin(now * 2.6 + id) * 0.07 + (st === 'walk' ? Math.abs(Math.sin(a * Math.PI * 2)) * 0.35 : 0) + (st === 'stagger' ? 0.6 : 0);
}

function makeBase(t) {
  const T = TC[t], g = new THREE.Group();
  const stone = std(0x6b5a44, {roughness: 0.9}), cloth = std(T.c, {roughness: 0.75, side: THREE.DoubleSide}), dark = std(T.d, {roughness: 0.8});
  const wood = std(0x6a4522, {roughness: 0.85});
  mesh(g, new THREE.CylinderGeometry(0.5, 0.54, 0.08, 18), stone, 0, 0.04, 0);
  const tent = mesh(g, new THREE.ConeGeometry(0.42, 0.78, 4, 1, true), cloth, 0, 0.47, 0);
  tent.rotation.y = Math.PI / 4;
  mesh(g, new THREE.ConeGeometry(0.43, 0.2, 4, 1, true), dark, 0, 0.77, 0).rotation.y = Math.PI / 4;
  mesh(g, new THREE.PlaneGeometry(0.2, 0.32), std(0x120b05), 0, 0.24, 0.21, false).rotation.x = -0.5;
  mesh(g, new THREE.CylinderGeometry(0.014, 0.014, 0.5, 6), wood, 0, 1.0, 0);
  const flag = new THREE.Group();
  flag.position.set(0, 1.18, 0);
  g.add(flag);
  mesh(flag, new THREE.PlaneGeometry(0.3, 0.17), new THREE.MeshStandardMaterial({color: T.l, side: THREE.DoubleSide, emissive: T.c, emissiveIntensity: 0.35}), 0.15, 0, 0);
  // 모닥불
  const fire = new THREE.Group();
  fire.position.set(0.36, 0.08, 0.36);
  g.add(fire);
  for (let i = 0; i < 3; i++) { const l = mesh(fire, new THREE.CylinderGeometry(0.025, 0.025, 0.24, 6), wood, 0, 0.03, 0); l.rotation.set(Math.PI / 2, i * 1.05, 0); }
  for (let i = 0; i < 6; i++) mesh(fire, new THREE.DodecahedronGeometry(0.04), stone, Math.cos(i) * 0.13, 0.02, Math.sin(i) * 0.13);
  const core = new THREE.Group();
  fire.add(core);
  mesh(core, new THREE.ConeGeometry(0.08, 0.26, 10), new THREE.MeshBasicMaterial({color: 0xff7a1a}), 0, 0.16, 0, false);
  mesh(core, new THREE.ConeGeometry(0.05, 0.18, 8), new THREE.MeshBasicMaterial({color: 0xffe08a}), 0, 0.13, 0, false);
  const light = new THREE.PointLight(0xff9a40, 3, 4.5, 1.6);
  light.position.set(0, 0.35, 0);
  fire.add(light);
  // 금 더미
  const gm = std(0xffc63a, {emissive: 0x9a6400, emissiveIntensity: 0.8, metalness: 0.6, roughness: 0.3, flatShading: true});
  const pile = new THREE.Group();
  pile.position.set(-0.36, 0.08, 0.3);
  g.add(pile);
  for (let i = 0; i < 6; i++) mesh(pile, new THREE.DodecahedronGeometry(0.05), gm, (i % 3 - 1) * 0.06, 0.04 + Math.floor(i / 3) * 0.06, (i % 2) * 0.05, false);
  mesh(g, new THREE.BoxGeometry(0.16, 0.14, 0.16), wood, -0.38, 0.15, -0.3);
  // 나무 울타리 (앞쪽은 드나드는 문으로 비움)
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    if (Math.abs(Math.atan2(Math.sin(a), Math.cos(a)) - Math.PI / 2) < 0.45) continue;
    const r = 0.56, h = 0.26 + (i % 3) * 0.04;
    mesh(g, new THREE.CylinderGeometry(0.028, 0.032, h, 6), wood, Math.cos(a) * r, h / 2 + 0.06, Math.sin(a) * r);
    mesh(g, new THREE.ConeGeometry(0.03, 0.07, 6), wood, Math.cos(a) * r, h + 0.095, Math.sin(a) * r);
  }
  // 문 양쪽의 횃대
  for (const sx of [-0.2, 0.2]) {
    mesh(g, new THREE.CylinderGeometry(0.02, 0.025, 0.5, 6), wood, sx, 0.31, 0.56);
    mesh(g, new THREE.ConeGeometry(0.045, 0.13, 8), new THREE.MeshBasicMaterial({color: 0xff8a2a}), sx, 0.62, 0.56, false);
  }
  // 팀 깃발 두 개 더
  for (const sx of [-0.45, 0.45]) {
    mesh(g, new THREE.CylinderGeometry(0.012, 0.012, 0.7, 6), wood, sx, 0.41, -0.42);
    mesh(g, new THREE.PlaneGeometry(0.16, 0.24), new THREE.MeshStandardMaterial({color: T.c, side: THREE.DoubleSide, emissive: T.c, emissiveIntensity: 0.25}), sx + 0.08, 0.64, -0.42);
  }
  const hp = hpBar(1.0);
  hp.position.y = 1.55;
  g.add(hp);
  g.traverse(o => { if (o.isMesh) o.receiveShadow = true; });
  for (const ch of g.children) if (ch !== hp) ch.traverse(o => { if (o.isMesh) o.visible = false; });
  const CS = SHEETS['camp_' + t];
  let spr;
  if (CS) {                                     // LPC 야영지 시트 (천막 · 팀 깃발 · 모닥불)
    const tx = CS.tex.clone(); tx.repeat.set(1 / CS.m.cols, 1); tx.needsUpdate = true;
    spr = new THREE.Sprite(new THREE.SpriteMaterial({map: tx, transparent: true, alphaTest: 0.5}));
    spr.center.set(0.5, (CS.m.cell - CS.m.foot) / CS.m.cell); spr.scale.set(1.55, 1.55, 1); spr.renderOrder = 5;
    spr.userData.camp = CS.m;
  } else spr = pxSprite(campTex(t, false, 0), 1.35, 1.35, 0.1);
  g.add(spr);
  return {g, spr, core, flag, fire, light, tent, pile, hp, flash: [stone, cloth], team: t};
}

function makeWumpus() {
  const g = new THREE.Group(), live = new THREE.Group(), dead = new THREE.Group();

  const fur = std(0x6d8a3a, {roughness: 0.9, flatShading: true, emissive: 0x1e3208, emissiveIntensity: 0.6}), fur2 = std(0x435a22, {roughness: 1, flatShading: true, emissive: 0x142206, emissiveIntensity: 0.5});

    mesh(b, new THREE.CylinderGeometry(0.016, 0.016, 0.24, 6), bone, 0, 0, 0);

  mesh(body, new THREE.IcosahedronGeometry(0.3, 1), belly, 0, 0.38, 0.2).scale.set(0.95, 0.9, 0.5);
  for (let i = 0; i < 18; i++) {                 // 등의 털 가시

    sp.lookAt(sp.position.x * 3, sp.position.y * 3 - 0.9, sp.position.z * 3); sp.rotateX(Math.PI / 2);

    for (let k = -1; k <= 1; k++) { const c = mesh(body, new THREE.ConeGeometry(0.025, 0.08, 5), horn, sx * 0.2 + k * 0.05, 0.03, 0.13); c.rotation.x = Math.PI / 2; }

    const hand = new THREE.Group(); hand.position.y = -0.42; sh.add(hand);
    mesh(hand, new THREE.IcosahedronGeometry(0.09, 0), fur2, 0, 0, 0);
    for (let k = -1; k <= 1; k++) { const c = mesh(hand, new THREE.ConeGeometry(0.024, 0.14, 5), horn, k * 0.045, -0.04, 0.08); c.rotation.x = 1.9; }

  const eyes = [];

    mesh(head, new THREE.BoxGeometry(0.11, 0.025, 0.04), fur2, sx * 0.1, 0.12, 0.2, false).rotation.z = -sx * 0.35;   // 성난 눈썹
    const h1 = new THREE.Group(); h1.position.set(sx * 0.17, 0.14, -0.02); h1.rotation.set(-0.3, 0, -sx * 0.7); head.add(h1);
    mesh(h1, new THREE.ConeGeometry(0.055, 0.22, 8), horn, 0, 0.1, 0);
    const h2 = mesh(h1, new THREE.ConeGeometry(0.035, 0.16, 8), horn, 0, 0.24, -0.04); h2.rotation.x = -0.7;
  }
  const jaw = new THREE.Group();
  jaw.position.set(0, -0.12, 0.12); head.add(jaw);
  mesh(jaw, new THREE.BoxGeometry(0.28, 0.06, 0.2), fur2, 0, -0.03, 0.06);
  mesh(jaw, new THREE.BoxGeometry(0.24, 0.02, 0.16), gum, 0, 0.005, 0.06, false);
  for (let k = 0; k < 5; k++) { const t = mesh(jaw, new THREE.ConeGeometry(0.018, 0.06, 4), bone, -0.09 + k * 0.045, 0.03, 0.14, false); }
  for (let k = 0; k < 4; k++) { const t = mesh(head, new THREE.ConeGeometry(0.02, 0.07, 4), bone, -0.07 + k * 0.047, -0.1, 0.25, false); t.rotation.x = Math.PI; }
  const eyeL = new THREE.PointLight(0xc8ff40, 3, 3.5, 1.4); eyeL.position.set(0, 0.85, 0.55); live.add(eyeL);

  for (const sx of [-1, 1]) {

    const h1 = mesh(dead, new THREE.ConeGeometry(0.05, 0.3, 8), horn, 0.05 + sx * 0.2, 0.2, 0.12); h1.rotation.set(0.2, 0, -sx * 1.2);
  }

    r.rotation.set(0, Math.PI / 2, 0.2);

  mesh(dead, new THREE.CylinderGeometry(0.025, 0.025, 0.5, 6), bone, -0.1, 0.05, -0.25).rotation.x = Math.PI / 2;
  dead.visible = false;
  const hp = hpBar(0.9);
  hp.position.y = 1.65;
  g.add(hp);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  for (const m of [fur, fur2, belly]) m.userData.base = m.emissive.clone();
  for (const ch of body.children) ch.visible = false;
  const token = makeToken('W', -1, 0.95);
  body.add(token);
  const pix = makeBody('W', -1, 0.72);
  body.add(pix);
  for (const ch of g.children) if (ch.isGroup && ch !== live && ch !== dead && ch !== hp) ch.visible = false;
  dead.traverse(o => { if (o.isMesh) o.visible = false; });
  const dsp = makeBody('W', -1, 0.75);
  if (dsp.userData.lpc) lpcFrame(dsp, 'hurt', 0, 99); else dsp.material.map = bodyTex('W', -1, 9);
  dead.add(dsp);
  const wsh = makeShadow(0.75, 0.42); live.add(wsh);
  const bones = frameSprite('bones', 0, 0.55, 0.55, 2 / 32); if (bones) { bones.position.set(-0.22, 0, 0.12); dead.add(bones); }
  return {g, den, wsh, token, pix, live, dead, body, head, jaw, eyes, eyeL, arms, hp, aura, flash: [fur, fur2, belly]};
}

// ---------------- 맵 만들기 ----------------
function build() {
  if (typeof R === 'undefined' || !R) return;
  if (world) { scene.remove(world.root); world.root.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  evCache = new Map();
  const root = new THREE.Group();
  scene.add(root);
  const n = W * H, rows = R.map.rows;

  const ground = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 0.24, 1), std(0xffffff, {roughness: 1, map: floorTex()}), n);
  ground.receiveShadow = true;
  const gBase = new Float32Array(n * 3);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, r = hash(x, y);
    COL.setHSL(0.08 + r * 0.03, 0.12 + r * 0.06, 0.25 + r * 0.06);
    if (SHEETS.floor) COL.setRGB(0.9 + r * 0.1, 0.9 + r * 0.1, 0.9 + r * 0.1);
    gBase.set([COL.r, COL.g, COL.b], i * 3);
    M4.makeTranslation(wx(x), -0.12, wz(y));
    ground.setMatrixAt(i, M4);
    ground.setColorAt(i, COL);
  }
  root.add(ground);
  // 받침돌과 가장자리 석축
  const frameM = std(0x2a1e14, {roughness: 0.95});
  mesh(root, new THREE.BoxGeometry(W + 1.6, 2, 0.8), frameM, 0, -1.25, -H / 2 - 0.4, false);
  mesh(root, new THREE.BoxGeometry(W + 1.6, 2, 0.8), frameM, 0, -1.25, H / 2 + 0.4, false);
  mesh(root, new THREE.BoxGeometry(0.8, 2, H), frameM, -W / 2 - 0.4, -1.25, 0, false);
  mesh(root, new THREE.BoxGeometry(0.8, 2, H), frameM, W / 2 + 0.4, -1.25, 0, false);
  mesh(root, new THREE.PlaneGeometry(W, H).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({color: 0x000000}), 0, -2.2, 0, false);
  const curbM = std(0x9a8670, {roughness: 1, map: wallSideTex()});
  for (let i = -1; i <= W; i++) for (const j of [-1, H]) mesh(root, new RoundedBoxGeometry(0.96, 0.22 + hash(i, j) * 0.12, 0.6, 2, 0.04), curbM, wx(i), 0, wz(j) + (j < 0 ? 0.2 : -0.2));
  for (let j = 0; j < H; j++) for (const i of [-1, W]) mesh(root, new RoundedBoxGeometry(0.6, 0.22 + hash(i, j) * 0.12, 0.96, 2, 0.04), curbM, wx(i) + (i < 0 ? 0.2 : -0.2), 0, wz(j));
  // 네 모서리 화로 기둥
  const braziers = [];
  for (const [i, j] of [[-1, -1], [W, -1], [-1, H], [W, H]]) {
    const b = new THREE.Group();
    b.position.set(wx(i), 0, wz(j));
    mesh(b, new THREE.BoxGeometry(0.62, 0.3, 0.62), curbM, 0, 0.15, 0);
    mesh(b, new THREE.CylinderGeometry(0.17, 0.21, 1.5, 8), std(0x7d6648, {roughness: 0.85}), 0, 1.05, 0);
    mesh(b, new THREE.CylinderGeometry(0.3, 0.2, 0.18, 10), std(0x8a6a3a, {metalness: 0.6, roughness: 0.45}), 0, 1.88, 0);
    const fl = new THREE.Group();
    fl.position.y = 1.97;
    b.add(fl);
    mesh(fl, new THREE.ConeGeometry(0.2, 0.55, 10), new THREE.MeshBasicMaterial({color: 0xff7a1a}), 0, 0.22, 0, false);
    mesh(fl, new THREE.ConeGeometry(0.12, 0.36, 8), new THREE.MeshBasicMaterial({color: 0xffe08a}), 0, 0.16, 0, false);
    const L = new THREE.PointLight(0xff9a40, 9, 14, 1.4);
    L.position.y = 2.3;
    b.add(L);
    b.traverse(o => { if (o.isMesh) o.visible = false; });
    const bs = frameSprite('brazier', 0, 0.62, 2.3, 2 / 120) || pxSprite(brazierTex(0), 0.9, 2.25, 0.02);
    b.add(bs);
    root.add(b);
    braziers.push({fl, L, spr: bs});
  }

  const wallCells = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (rows[y][x] === '#') wallCells.push([x, y]);
  const nW = Math.max(1, wallCells.length);
  // 이어진 벽 덩어리마다 같은 높이 (덩어리끼리는 다르게) — 붙은 벽이 한 바위처럼 보이게
  const isWall = (x, y) => x >= 0 && y >= 0 && x < W && y < H && rows[y][x] === '#';
  const comp = new Map(); let nc = 0;
  for (const [x0, y0] of wallCells) {
    if (comp.has(x0 + ',' + y0)) continue;
    const st = [[x0, y0]]; comp.set(x0 + ',' + y0, nc);
    while (st.length) { const [x, y] = st.pop(); for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k2 = (x + dx) + ',' + (y + dy); if (isWall(x + dx, y + dy) && !comp.has(k2)) { comp.set(k2, nc); st.push([x + dx, y + dy]); } } }
    nc++;
  }
  const compH = c => 0.85 + hash(c * 13 + 7, 29) * 0.3;
  const wSide = std(0xffffff, {roughness: 1, map: wallSideTex()}), wTop = std(0xffffff, {roughness: 1, map: wallTopTex()});
  const wall = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), [wSide, wSide, wTop, wTop, wSide, wSide], nW);
  const cap = new THREE.InstancedMesh(new RoundedBoxGeometry(1, 0.14, 1, 2, 0.04), std(0xffffff, {roughness: 0.85, map: slabTex()}), nW);
  wall.castShadow = cap.castShadow = true; wall.receiveShadow = cap.receiveShadow = true;
  const wBase = new Float32Array(wallCells.length * 3), cBase = new Float32Array(wallCells.length * 3);
  wallCells.forEach(([x, y], k) => {
    const r = hash(x, y), ruin = false, h = SHEETS.wall_top ? compH(comp.get(x + ',' + y)) : (hash(y + 17, x + 3) < 0.2 ? 0.5 : 1);   // 덩어리마다 높이
    const rot = Q.identity();
    COL.setHSL(0.08 + r * 0.02, 0.14, 0.36 + r * 0.08);
    if (SHEETS.wall_side) COL.setRGB(0.9 + r * 0.1, 0.9 + r * 0.1, 0.9 + r * 0.1);
    wBase.set([COL.r, COL.g, COL.b], k * 3);
    M4.compose(V3.set(wx(x), h / 2, wz(y)), rot, S3.set(1, h, 1));
    wall.setMatrixAt(k, M4); wall.setColorAt(k, COL);
    COL.setHSL(0.09 + r * 0.02, 0.12, 0.55 + r * 0.12);
    cBase.set([COL.r, COL.g, COL.b], k * 3);
    M4.compose(V3.set(wx(x) + (ruin ? (r - 0.5) * 0.2 : 0), h + 0.05, wz(y)), rot, S3.set(ruin ? 0.8 : 1, 1, ruin ? 0.8 : 1));
    cap.setMatrixAt(k, M4); cap.setColorAt(k, COL);
  });
  wall.count = cap.count = wallCells.length;
  cap.visible = false;
  root.add(wall, cap);
  if (SHEETS.wall_top) {                           // 윗면: 바닥과 닿는 가장자리에만 들쭉날쭉한 바위 테두리
    const tg = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), mats = {};
    for (const [x, y] of wallCells) {
      const mask = (isWall(x, y - 1) ? 1 : 0) | (isWall(x + 1, y) ? 2 : 0) | (isWall(x, y + 1) ? 4 : 0) | (isWall(x - 1, y) ? 8 : 0);
      const key = mask + ':' + ((x * 7 + y * 3) % 4);
      const mt = mats[key] || (mats[key] = std(0xffffff, {roughness: 1, map: rimTex(mask, (x * 7 + y * 3) % 4)}));
      const m = new THREE.Mesh(tg, mt); m.position.set(wx(x), compH(comp.get(x + ',' + y)) + 0.002, wz(y)); m.receiveShadow = true; root.add(m);
    }
  }
  // 무너진 돌 조각: 벽 칸 둘레 (안개 때 그 칸 색을 따른다)
  const rubCells = [];
  const rubble = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), std(0xffffff, {roughness: 0.95, flatShading: true, map: brickTex()}), Math.max(1, wallCells.length * 3));
  rubble.castShadow = true; rubble.receiveShadow = true;
  const rBase = [];
  wallCells.forEach(([x, y]) => {
    const m = 1 + Math.floor(hash(x * 3, y * 5) * 3);
    for (let k = 0; k < m; k++) {
      const a = hash(x + k * 7, y) * Math.PI * 2, d = 0.38 + hash(x, y + k * 3) * 0.12, sc = 0.07 + hash(x + k, y + k) * 0.09;
      M4.compose(V3.set(wx(x) + Math.cos(a) * d, sc * 0.5, wz(y) + Math.sin(a) * d),
        Q.setFromEuler(new THREE.Euler(a, a * 2, k)), S3.set(sc * 1.3, sc * 0.8, sc));
      const i = rubCells.length;
      rubble.setMatrixAt(i, M4);
      const v = 0.5 + hash(k, x * y) * 0.3; COL.setRGB(v, v * 0.92, v * 0.85); rubble.setColorAt(i, COL);
      rBase.push(v); rubCells.push(y * W + x);
    }
  });
  rubble.count = rubCells.length;
  rubble.visible = false;
  root.add(rubble);
  // 동굴 벽: 맵을 둘러싼 큰 바위와 종유석
  const rocks = [], spikes = [];
  const pad = 2.2, perim = (x0, z0, x1, z1, step) => { const pts = []; for (let x = x0; x <= x1; x += step) pts.push([x, z0], [x, z1]); for (let z = z0 + step; z < z1; z += step) pts.push([x0, z], [x1, z]); return pts; };
  perim(-W / 2 - pad, -H / 2 - pad, W / 2 + pad, H / 2 + pad, 1.5).forEach(([x, z], i) => rocks.push([x, z, i, 0]));

  // 바닥 장식: 빈 칸 몇 곳에 작은 돌 · 이끼 · 뼈 조각 (게임 물체와 헷갈리지 않게 작고 옅게)
  if (SHEETS.floor) {
    const occ = new Set([...R.map.ore, ...R.map.traps, ...R.map.bases, ...(R.map.wumpus || [])].map(c => c[0] + ',' + c[1]));
    const dg = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
    const dm = [0, 1, 2].map(v => new THREE.MeshStandardMaterial({map: decoTex(v), transparent: true, alphaTest: 0.5, roughness: 1, opacity: 0.85}));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (rows[y][x] === '#' || occ.has(x + ',' + y) || hash(x * 7 + 3, y * 11 + 5) > 0.16) continue;
      const v = hash(x, y * 3) < 0.45 ? 0 : hash(x, y * 3) < 0.85 ? 1 : 2;
      const m = new THREE.Mesh(dg, dm[v]); m.position.set(wx(x), 0.004, wz(y)); m.renderOrder = 1; root.add(m);
    }
  }
  // 금맥
  const oreMat = std(0xffc63a, {emissive: 0xd08a00, emissiveIntensity: 0.9, metalness: 0.8, roughness: 0.22, flatShading: true});
  const veinMat = new THREE.MeshBasicMaterial({color: 0xffd25a});
  const rockMat = std(0x3a2f26, {roughness: 0.9, flatShading: true});
  const rockG = new THREE.DodecahedronGeometry(0.34, 0), nug = new THREE.OctahedronGeometry(0.11, 0);
  const glowMat = new THREE.MeshBasicMaterial({map: softTex(), color: 0xffb030, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending});
  const glowG = new THREE.PlaneGeometry(1.25, 1.25).rotateX(-Math.PI / 2);
  const ore = new Map();
  for (const [x, y] of R.map.ore) {
    const grp = new THREE.Group(), cs = [], h0 = hash(x, y);
    const glow = mesh(grp, glowG, glowMat.clone(), 0, 0.02, 0, false); glow.renderOrder = 1;
    const rock = mesh(grp, rockG, rockMat, 0, 0.1, 0);
    rock.scale.set(1.15, 0.6, 1.0); rock.rotation.set(h0, h0 * 6, 0);
    const r2 = mesh(grp, rockG, rockMat, 0.22, 0.05, -0.18); r2.scale.set(0.55, 0.4, 0.5); r2.rotation.y = h0 * 3;
    for (let k = 0; k < 3; k++) {                 // 바위 위를 가로지르는 금줄기
      const v = mesh(grp, new THREE.BoxGeometry(0.5, 0.025, 0.035), veinMat, (hash(x + k, y) - 0.5) * 0.2, 0.2 + k * 0.03, (k - 1) * 0.14, false);
      v.rotation.set(0, hash(x, y + k) * 3, (hash(y, x + k) - 0.5) * 0.6);
    }
    for (let k = 0; k < 7; k++) {                 // 튀어나온 금덩이 (남은 양만큼 보임)
      const t = k / 7 * Math.PI * 2 + h0 * 6, rr = 0.12 + hash(x + k, y + 3) * 0.2, sz = 0.7 + hash(x, y + k) * 0.7;
      const c = mesh(grp, nug, oreMat, Math.cos(t) * rr, 0.2 + hash(k, x) * 0.12, Math.sin(t) * rr);
      c.scale.set(sz, sz * 1.6, sz); c.rotation.set((hash(x + k, y) - 0.5) * 1.2, t, (hash(y, x + k) - 0.5) * 1.2);
      cs.push(c);
    }
    const glint = new THREE.Sprite(new THREE.SpriteMaterial({map: starTex(), color: 0xfff6d0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending}));
    glint.position.set(0.1, 0.5, 0.05);
    grp.add(glint);
    grp.position.set(wx(x), 0, wz(y));
    const lbl = new THREE.Sprite(new THREE.SpriteMaterial({transparent: true, depthTest: false, sizeAttenuation: false}));
    lbl.position.set(0, 0.8, 0); lbl.scale.set(0.045, 0.0235, 1); lbl.renderOrder = 14; lbl.material.opacity = 0.8;
    grp.add(lbl);
    grp.traverse(o => { if (o.isMesh && o !== glow) o.visible = false; });
    cs.forEach(c => grp.remove(c));
    let osp;
    if (SHEETS.ore) {                              // LPC 금맥: 바위 위 금빛 수정
      const tx = SHEETS.ore.tex.clone(); tx.repeat.set(1 / 8, 1); tx.offset.set(7 / 8, 0); tx.needsUpdate = true;
      osp = new THREE.Sprite(new THREE.SpriteMaterial({map: tx, transparent: true, alphaTest: 0.5}));
      osp.center.set(0.5, 2 / 64); osp.scale.set(1.05, 1.05, 1); osp.renderOrder = 5; osp.userData.lpc = true; osp.material.color.setScalar(0.78);
    } else osp = pxSprite(oreTex(7), 0.95, 0.95, 0.08);
    grp.add(osp);
    const clk = pxSprite(clockTex(0, 12), 0.78, 0.15, 0.5);
    clk.position.y = 1.0; clk.renderOrder = 13; clk.material.depthTest = false;
    grp.add(clk);
    grp.userData.clk = clk;
    grp.userData.spr = osp;
    grp.userData.cs = cs; grp.userData.glint = glint; grp.userData.glow = glow; grp.userData.lbl = lbl;

  // 구덩이

  const ringGeo = new THREE.RingGeometry(0.25, 0.29, 28).rotateX(-Math.PI / 2);
  const shaftG = new THREE.CylinderGeometry(0.69, 0.6, 2.1, 4, 1, true).rotateY(Math.PI / 4);
  const shaftM = new THREE.MeshBasicMaterial({map: shaftTex(), side: THREE.BackSide});
  const rimM = std(0x4a3a28, {roughness: 0.95});
  for (const [x, y] of R.map.traps) {
    const hidden = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color: 0xc0483a, transparent: true, opacity: 0.3, depthWrite: false}));
    hidden.position.set(wx(x), 0.012, wz(y));
    const rev = new THREE.Group();
    rev.position.set(wx(x), 0, wz(y));

    mesh(rev, new THREE.PlaneGeometry(0.96, 0.96).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({color: 0x000000}), 0, -2.08, 0, false);
    for (let i = 0; i < 4; i++) {                 // 갱도 입구의 무너진 돌

    const shaft = new THREE.Mesh(new THREE.BoxGeometry(1, 2.1, 1), new THREE.MeshBasicMaterial({map: cliffTex(), side: THREE.BackSide}));

function resetCam() {
  const s = Math.max(W, H), d = s * 1.28;
  controls.target.set(0, 0, 0.6);
  camera.position.set(0, d * Math.cos(PHI), 0.6 + d * Math.sin(PHI));
  controls.update();
}

function resize() {
  const w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// ---------------- 상태 갱신 ----------------
function evOf(g) {
  let e = evCache.get(g);
  if (e) return e;
  e = {atk: new Map(), hit: new Map(), mine: new Set(), die: new Map(), push: new Map(), pushed: new Map(), whit: new Map(), eat: new Map(), scream: new Map(), stab: new Map(), list: F[g].e || []};
  for (const v of e.list) {
    if (v[0] === 'atk') { e.atk.set(v[1], v); if (v[6] > 0) e.hit.set(v[6], v); if (v[6] === -1) e.whit.set(v[4] + ',' + v[5], v); }
    else if (v[0] === 'push') { e.push.set(v[1], v); if (v[5] !== v[7] || v[6] !== v[8]) e.pushed.set(v[4], v); }
    else if (v[0] === 'eaten') e.eat.set(v[2] + ',' + v[3], v);
    else if (v[0] === 'stab') { e.stab.set(v[1], v); e.hit.set(v[6], v); }
    else if (v[0] === 'parrow') e.mine.add(v[1]);
    else if (v[0] === 'scream') e.scream.set(v[2] + ',' + v[3], v);
    else if (v[0] === 'mine' || v[0] === 'pick') e.mine.add(v[1]);
    else if (v[0] === 'die') e.die.set(v[1], v);
  }
  evCache.set(g, e);
  return e;
}

function applyFog(fi, team, vis, seen) {
  const key = fi + '|' + team;
  if (key === world.fogKey) return;
  world.fogKey = key;
  const fac = i => !vis ? 1 : vis[i] ? 1 : seen[i] ? 0.4 : 0.09;
  for (let i = 0; i < W * H; i++) {
    const k = fac(i);
    COL.setRGB(world.gBase[i * 3] * k, world.gBase[i * 3 + 1] * k, world.gBase[i * 3 + 2] * k);
    world.ground.setColorAt(i, COL);
  }
  world.ground.instanceColor.needsUpdate = true;
  world.wallCells.forEach(([x, y], j) => {
    const k = fac(y * W + x);
    COL.setRGB(world.wBase[j * 3] * k, world.wBase[j * 3 + 1] * k, world.wBase[j * 3 + 2] * k);
    world.wall.setColorAt(j, COL);
    COL.setRGB(world.cBase[j * 3] * k, world.cBase[j * 3 + 1] * k, world.cBase[j * 3 + 2] * k);
    world.cap.setColorAt(j, COL);
  });
  if (world.wall.instanceColor) world.wall.instanceColor.needsUpdate = true;
  if (world.cap.instanceColor) world.cap.instanceColor.needsUpdate = true;
  world.rubCells.forEach((ci, j) => { const k = fac(ci), v = world.rBase[j] * k; COL.setRGB(v, v * 0.92, v * 0.85); world.rubble.setColorAt(j, COL); });
  if (world.rubble.instanceColor) world.rubble.instanceColor.needsUpdate = true;
}

function updateStatic(fi, team, seen, now) {
  const om = oreAt[fi];
  for (const [k, grp] of world.ore) {
    const amt = om.get(k) || 0;
    const [x, y] = k.split(',').map(Number);
    grp.visible = !seen || seen[y * W + x] === 1;        // 다 캐도 빈 바위와 시계는 남는다
    if (!grp.visible) continue;
    const cs = grp.userData.cs, n = amt > 0 ? Math.max(1, Math.ceil(Math.min(1, amt / 16) * cs.length)) : 0;
    grp.userData.lbl.visible = amt > 0; grp.userData.glow.visible = amt > 0;
    { const RG = R.const.regrow || 12, full = amt >= (world.oreMax.get(k) || 0), clk = grp.userData.clk, st = fi % RG;
      clk.visible = !full;
      if (!full && clk.userData.st !== st) { clk.userData.st = st; clk.material.map = clockTex(st, RG); clk.material.needsUpdate = true; } }
    if (grp.userData.amt !== amt) { grp.userData.amt = amt; grp.userData.lbl.material.map = numTex(amt); grp.userData.lbl.material.needsUpdate = true; }
    cs.forEach((c, i) => c.visible = i < n);
    if (grp.userData.n !== n) { grp.userData.n = n;
      if (grp.userData.spr.userData.lpc) grp.userData.spr.material.map.offset.set(n / 8, 0);
      else { grp.userData.spr.material.map = oreTex(n); grp.userData.spr.material.needsUpdate = true; } }
    grp.scale.setScalar(0.85 + Math.min(1, amt / 16) * 0.25);
    grp.userData.glow.material.opacity = 0.35 + 0.2 * Math.sin(now * 1.6 + x + y);
    const tw = Math.max(0, Math.sin(now * 2.2 + x * 1.7 + y * 2.3));
    grp.userData.glint.material.opacity = tw * tw;
    grp.userData.glint.scale.setScalar(0.2 + tw * 0.4);
  }
  const rev = revAt[fi], changed = rev.size !== world.revN;
  world.revN = rev.size;
  for (const [k, t] of world.traps) {
    const [x, y] = k.split(',').map(Number);
    const r = true;                                // 구덩이는 처음부터 낭떠러지로 보인다 (봇은 바람으로만 안다)
    t.hidden.visible = false;
    t.rev.visible = !seen || seen[y * W + x] === 1;
    if (!world.pitsCut) { M4.makeTranslation(wx(x), t.gy, wz(y)); M4.scale(S3.set(0.001, 0.001, 0.001)); world.ground.setMatrixAt(t.gi, M4); }
    if (t.rev.visible) pitWind(wx(x), wz(y), now, x * 31 + y);
  }
  if (!world.pitsCut) { world.pitsCut = true; world.ground.instanceMatrix.needsUpdate = true; }
  // 떨어진 금: 자루 (10 이상은 보물 상자)
  const lm = lootAt[fi];
  for (const [k, o] of world.loot) if (!lm.has(k)) o.g.visible = false;
  for (const [k, amt] of lm) {
    const [x, y] = k.split(',').map(Number);
    let o = world.loot.get(k);
    if (!o) { o = makeLoot(); world.root.add(o.g); world.loot.set(k, o); }
    o.g.visible = !seen || seen[y * W + x] === 1;
    if (!o.g.visible) continue;
    const onDen = (R.map.wumpus || []).some(([a, b]) => a === x && b === y);
    o.g.position.set(wx(x) + (onDen ? 0.22 : 0), 0, wz(y) + (onDen ? 0.22 : 0));
    if (o.amt !== amt) { o.amt = amt; o.lbl.material.map = numTex(amt); o.lbl.material.needsUpdate = true; }
    o.chest.visible = amt >= 10; o.sack.visible = amt < 10;
    if (o.sack.userData.spr) o.sack.userData.spr.material.map.offset.set((amt >= 5 ? 1 : 0) / 3, 0);   // 적으면 주머니, 5 이상이면 주머니 더미
    o.g.scale.setScalar(amt >= 10 ? 1.25 : 0.85 + Math.min(1, amt / 6) * 0.35);
    o.sack.position.y = Math.abs(Math.sin(now * 2 + x + y)) * 0.03;
    o.glow.material.opacity = 0.4 + 0.2 * Math.sin(now * 2.4 + x * 3);
  }
  // 바닥에 꽂힌 화살 (궁수가 주울 수 있다)
  for (const [k, n] of arrAt[fi]) {
    const [x, y] = k.split(',').map(Number);

    focusT = now;
  }
  FOC.set(focusPt[0], 0, focusPt[1]);
  OFF.copy(camera.position).sub(controls.target);
  const len = OFF.length();
  OFF.multiplyScalar((len + (13 - len) * 0.03) / len);
  controls.target.lerp(FOC, 0.04);
  camera.position.copy(controls.target).add(OFF);
}

// ---------------- 누르기 · 가리키기 ----------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
function cellOf(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hitP)) return null;
  return [Math.floor(hitP.x + W / 2), Math.floor(hitP.z + H / 2)];
}
let down = null;
renderer.domElement.addEventListener('pointerdown', ev => { down = [ev.clientX, ev.clientY]; });
controls.addEventListener('start', () => { if (spect) { spect = false; if (window.onSpectateOff) window.onSpectateOff(); } });
renderer.domElement.addEventListener('pointerup', ev => {
  if (down && Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) < 5) { const c = cellOf(ev); if (c) selectCell(c[0], c[1]); }
  down = null;
});
renderer.domElement.addEventListener('pointermove', ev => { const c = cellOf(ev); hoverC = c; if (c) hoverCell(c[0], c[1]); });
renderer.domElement.addEventListener('pointerleave', () => { hoverC = null; });

function focus(x, y, d) {
  controls.target.set(wx(x), 0, wz(y));
  camera.position.set(wx(x), d * Math.cos(PHI), wz(y) + d * Math.sin(PHI));
  controls.update();
}

function look(x, y, z, tx, ty, tz) {          // 확인용: 카메라를 칸 좌표로 직접 놓는다
  camera.position.set(wx(x), y, wz(z)); controls.target.set(wx(tx), ty, wz(tz)); controls.update();
}

function legend() {                          // 오른쪽 '표시' 칸에 쓸 그림: 화면에 실제로 그리는 것과 같은 도트 아이콘
  const u = t => t.image.toDataURL(), o = {};
  for (const k of ['breeze', 'stench', 'glitter', 'bump', 'steps', 'hurt']) o[k] = u(perceptTex(k));
  o.hp = u(hpTex(10, 0)); o.hpLow = u(hpTex(3, 0)); o.token = u(tokenTex('E', 0));
  return o;
}

window.View3D = {build, frame, resize, resetCam, focus, setSpectate, look, legend};
if (window.onView3DReady) window.onView3DReady();

</script>
</body>
