<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웜퍼스 워즈 — 리플레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0906; --panel:#16100b; --panel2:#1d150e; --line:#3b2b1a; --bronze:#8c6a3c; --bronze2:#c79a55;
  --text:#efe3cb; --dim:#a48f72; --red:#ff5a48; --blue:#3ccaff; --gold:#e8b64a; --ok:#7fc77a;
  --serif:"Cinzel","Noto Serif KR",serif; --kserif:"Noto Serif KR","Cinzel",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.45 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
#app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;
  background:radial-gradient(1200px 500px at 50% -10%,rgba(199,154,85,.10),transparent 70%),var(--bg)}
/* ---- 머리 ---- */
header{display:flex;align-items:center;gap:16px;padding:9px 18px;position:relative;
  background:linear-gradient(#1c140c,#120d08);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--bronze2),transparent);opacity:.7}
.logo{display:flex;align-items:baseline;gap:10px}
.logo .en{font-family:var(--serif);font-weight:800;font-size:21px;letter-spacing:.14em;
  background:linear-gradient(180deg,#fff0c2 0%,#e8b64a 45%,#9b6a24 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.logo .ko{font-family:var(--kserif);font-weight:600;font-size:13px;color:var(--bronze2);letter-spacing:.2em}
.logo .gem{width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,#ffe9a8,#b07a2c);box-shadow:0 0 8px rgba(232,182,74,.7);align-self:center}
header .sub{color:var(--dim);font-size:12.5px}
header .vs{margin-left:auto;font-family:var(--kserif);font-weight:600}
.r{color:var(--red)} .b{color:var(--blue)}
/* ---- 점수판 ---- */
#hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:12px;padding:10px 14px;
  background:linear-gradient(#140e09,#100b07);border-bottom:1px solid var(--line)}
.tp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:9px 14px;border-radius:6px;min-width:0;position:relative;
  background:linear-gradient(90deg,var(--tc2),rgba(22,16,11,.85) 70%);
  border:1px solid var(--bronze);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 3px rgba(140,106,60,.18),0 4px 18px rgba(0,0,0,.45)}
.tp.t1{flex-direction:row-reverse;background:linear-gradient(270deg,var(--tc2),rgba(22,16,11,.85) 70%)}
.tp::before,.tp::after{content:"";position:absolute;top:50%;width:10px;height:10px;transform:translateY(-50%) rotate(45deg);
  background:linear-gradient(135deg,#f5d58a,#8c6a3c);border:1px solid #2a1d10}
.tp::before{left:-6px} .tp::after{right:-6px}
.tp.lead{border-color:var(--bronze2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 0 0 3px rgba(232,182,74,.28),0 0 22px -6px var(--tc)}
.tp .who{display:flex;flex-direction:column;min-width:0}
.tp.t1 .who{align-items:flex-end}
.tp .who .tn{font-family:var(--kserif);font-weight:800;font-size:18px;color:var(--tc);letter-spacing:.02em;text-shadow:0 1px 0 #000}
.tp .who .bn{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.tp .who .uc{font-size:11.5px;color:#cdbb9c;margin-top:1px;white-space:nowrap}
.stats{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.tp.t1 .stats{flex-direction:row-reverse}
.tp.t1 .st.hp .row{flex-direction:row-reverse}
.st{display:flex;align-items:center;gap:9px;background:linear-gradient(#0f0a06,#1a120b);border:1px solid #4a3620;border-radius:5px;padding:6px 12px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.06)}
.st svg{width:30px;height:30px;flex:none;display:block}
.st .lab{font-family:var(--kserif);font-size:11px;color:var(--dim);line-height:1;white-space:nowrap;letter-spacing:.05em}
.st .val{font-family:var(--serif);font-size:27px;font-weight:800;line-height:1.08;font-variant-numeric:tabular-nums}
.st.ore .val{color:#ffd978;text-shadow:0 0 14px rgba(232,182,74,.45)}
.st.gold .val{color:#e9c27a}
/* 바친 금 = 승패를 가르는 점수: 가장 크게 */
.st.ore{padding:6px 16px 6px 12px;border-color:#a8813f;background:linear-gradient(#2a1d0e,#1a120b);
  box-shadow:inset 0 1px 0 rgba(255,220,150,.12),0 0 18px -6px rgba(232,182,74,.55)}
.st.ore svg{width:40px;height:40px}
.st.ore .lab{font-size:12.5px;color:#d9b77a}
.st.ore .val{font-size:40px;line-height:1}
/* 금고 = 생산에 쓰는 돈: 작은 보조 칸 */
.st.gold{padding:4px 9px;gap:6px;opacity:.9}
.st.gold svg{width:20px;height:20px}
.st.gold .val{font-size:19px}
.st.gold .lab{font-size:10px}
.st .dl{position:absolute;top:-9px;right:-4px;font-size:12px;font-weight:800;padding:0 5px;border-radius:4px;opacity:0;pointer-events:none}
.st .dl.up{color:#14200d;background:#9fd88a}
.st .dl.dn{color:#2a0b0b;background:#f08a7a}
.st .dl.go{animation:pop 1.1s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.st.hp{flex:1 1 100%;flex-direction:column;align-items:stretch;gap:4px;padding:5px 12px 8px}
.st.hp .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.st.hp .val{font-size:19px}
.hpbar{height:13px;border-radius:2px;background:#080503;overflow:hidden;position:relative;border:1px solid #5a4126;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.hpbar i{position:absolute;left:0;top:0;bottom:0;transition:width .35s;
  background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%,rgba(0,0,0,.25))!important}
.hpbar i.fill{background-color:var(--tc)}
.hpbar i.ghost{background-color:#fff2d0;opacity:.55;transition:width .9s .25s}
.hpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(0,0,0,.45) 9.5% 10%)}
.tp.t1 .hpbar i{left:auto;right:0}
.st.hp.hit{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.afford{display:flex;gap:4px;margin-top:3px}
.afford span{font-size:10px;padding:0 5px;border-radius:3px;border:1px solid #4a3620;color:#6d5a42;white-space:nowrap}
.afford span.ok{color:#f3e2b8;border-color:#a8813f;background:rgba(168,129,63,.25)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px;min-width:140px;position:relative}
.mid .rd{font-family:var(--kserif);font-size:11px;color:var(--dim);letter-spacing:.3em}
.mid .rn{font-family:var(--serif);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;color:#f3e2b8}
.mid .rn small{font-size:13px;color:var(--dim);font-weight:600}
.mid .ld{font-family:var(--kserif);font-size:12px;font-weight:700;margin-top:2px;white-space:nowrap}
.mid .pr{width:120px;height:4px;border-radius:2px;background:#080503;margin-top:5px;overflow:hidden;border:1px solid #3b2b1a}
.mid .pr i{display:block;height:100%;background:linear-gradient(90deg,#8c6a3c,#e8b64a)}
@media (max-width:1100px){#hud{grid-template-columns:1fr}.mid{order:-1;flex-direction:row;gap:10px}.stats{flex-wrap:wrap}}
/* ---- 본문 ---- */
main{display:grid;grid-template-columns:1fr 320px;min-height:0}
#stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;
  background:radial-gradient(ellipse at center,#1c140c 0%,#0a0705 75%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.75);z-index:1}
canvas#cv{display:block;border-radius:3px;box-shadow:0 0 0 2px #3b2b1a,0 0 0 4px #120d08,0 0 0 5px #8c6a3c,0 12px 50px rgba(0,0,0,.7);cursor:pointer}
#banner{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:10px 26px;border-radius:4px;
  background:linear-gradient(#2a1d10,#160f09);border:1px solid var(--bronze2);font-family:var(--kserif);font-weight:800;font-size:16px;
  display:none;white-space:nowrap;box-shadow:0 0 0 3px rgba(0,0,0,.6),0 0 30px rgba(232,182,74,.25);letter-spacing:.04em}
#hover{position:absolute;left:12px;bottom:10px;color:var(--dim);font-size:12px;background:rgba(14,10,6,.8);padding:3px 9px;border-radius:3px;border:1px solid #3b2b1a}
aside{border-left:1px solid var(--line);background:linear-gradient(#150f0a,#110c08);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.card{background:linear-gradient(#1e160e,#18110b);border:1px solid #4a3620;border-radius:5px;padding:10px 12px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,220,150,.05)}
.card h3{margin:0 0 7px;font-family:var(--kserif);font-size:12.5px;color:var(--bronze2);font-weight:700;letter-spacing:.12em;
  display:flex;align-items:center;gap:7px}
.card h3::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--bronze2)}
.card h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#5a4126,transparent)}
.team{display:flex;flex-direction:column;gap:4px}
.team .top{display:flex;justify-content:space-between;align-items:baseline}
.team .nm{font-family:var(--kserif);font-weight:800}
.team .bot{color:var(--dim);font-size:12px}
.stat{display:flex;gap:12px;font-size:13px}
.stat b{font-variant-numeric:tabular-nums;color:#f3e2b8}
.bar{height:7px;border-radius:2px;background:#080503;overflow:hidden;border:1px solid #3b2b1a}
.bar>i{display:block;height:100%}
#mind .line{font-size:13px;margin:2px 0}
#mind .k{color:var(--dim)}
#legend{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12px;color:var(--dim);align-items:center}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
#log{font-size:12px;max-height:170px;overflow-y:auto;color:#d8c8aa}
#log div{padding:2px 0;border-bottom:1px dashed #3b2b1a}
#chart{width:100%;height:80px;display:block}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line);background:linear-gradient(#120d08,#1a130c)}
button,select{background:linear-gradient(#2a1e12,#1a120b);color:var(--text);border:1px solid #5a4126;border-radius:4px;padding:5px 11px;font:inherit;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,220,150,.08)}
button:hover,select:hover{border-color:var(--bronze2);color:#fff3d6}
select{color-scheme:dark}
select option{background:#1d150e;color:#efe3cb}
select option:checked{background:#5a3f1c;color:#fff3d6}
button.main{min-width:70px;font-weight:700;font-family:var(--kserif);border-color:var(--bronze2);background:linear-gradient(#5a3f1c,#2e2010)}
input[type=range]{flex:1;min-width:160px;accent-color:#c79a55}
#rlabel{font-family:var(--serif);font-variant-numeric:tabular-nums;min-width:120px;text-align:center;color:#e9d6ac}
label.ck{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:13px;cursor:pointer}
input[type=checkbox]{accent-color:#c79a55}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--dim);font-size:15px}
.hint{font-size:12px;color:var(--dim)}
#three{position:absolute;inset:0;display:none}
#three canvas{display:block}
#banner,#hover{z-index:2}
#feed{position:absolute;left:14px;top:12px;z-index:2;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:46%}
#feed .it{font-size:12.5px;padding:3px 10px 3px 8px;border-radius:3px;background:rgba(14,10,6,.78);border:1px solid #3b2b1a;border-left:3px solid var(--bronze2);
  color:#e9dcc0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed .it .rd{font-family:var(--serif);color:var(--dim);font-size:11px;margin-right:6px}
#feed .it.pit{border-left-color:#9fd3ff} #feed .it.kill{border-left-color:#e5533f} #feed .it.camp{border-left-color:#ffb347}
#bSpec.on{border-color:var(--bronze2);background:linear-gradient(#5a3f1c,#2e2010);color:#fff3d6}
::-webkit-scrollbar{width:9px} ::-webkit-scrollbar-thumb{background:#3b2b1a;border-radius:4px} ::-webkit-scrollbar-track{background:#0f0a06}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="gem"></span><span class="en">WUMPUS WARS</span><span class="ko">웜퍼스 워즈</span></div>
    <span class="sub" id="metaline">리플레이 뷰어</span>
    <span class="vs" id="vsline"></span>
  </header>
  <div id="hud">
    <div class="tp t0" id="hud0"></div>
    <div class="mid" id="hudMid"></div>
    <div class="tp t1" id="hud1"></div>
  </div>
  <main>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="three"></div>
      <div id="banner"></div>
      <div id="hover"></div>
      <div id="feed"></div>
      <div id="drop">리플레이가 없습니다.<br><code>python -m wumpus run logic random</code> 으로 만든<br>replays/*.json 파일을 이 창에 끌어다 놓으세요.</div>
    </div>
    <aside>
      <div class="card team" id="team0"></div>
      <div class="card team" id="team1"></div>
      <div class="card"><h3>바친 금 추이</h3><canvas id="chart"></canvas></div>
      <div class="card" id="mind"><h3>봇의 머릿속</h3><div id="mindbody" class="hint">유닛이나 야영지를 누르면 그 유닛이 아는 것과 추론한 것이 보입니다.</div></div>
      <div class="card"><h3>표시</h3>
        <div id="legend">
          <span class="sw" style="background:rgba(80,220,120,.55)"></span><span>안전하다고 증명된 칸 (아직 안 가 봄)</span>
          <span class="sw" style="background:rgba(255,70,70,.6)"></span><span>구덩이라고 추론한 칸</span>
          <span class="sw" style="background:rgba(255,200,60,.6)"></span><span>구덩이 의심 칸 (바람 옆)</span>
          <span class="sw" style="background:rgba(180,110,255,.6)"></span><span>적 야영지 후보 (남은 대칭)</span>
          <span class="sw" style="border:2px solid #bfe9ff;border-radius:50%;border-left-color:transparent"></span><span>바람을 느끼는 유닛 (구덩이 옆)</span>
          <span class="sw" style="border:2px dashed rgba(229,83,63,.85);border-radius:50%;background:#000"></span><span>숨은 구덩이 (전체 보기에서만)</span>
        </div>
      </div>
      <div class="card"><h3>이번 라운드 사건</h3><div id="log"></div></div>
    </aside>
  </main>
  <footer>
    <button id="b3d" title="2D / 3D 바꾸기">2D 보기</button>
    <button id="bCam" title="카메라를 처음 위치로 (끌어서 돌리기 · 휠로 확대)">카메라 ↺</button>
    <button id="bSpec" title="싸움 · 사고가 난 곳을 카메라가 따라간다 (끌면 꺼짐)">관전 카메라</button>
    <button id="bStart" title="처음으로">⏮</button>
    <button id="bPrev" title="한 라운드 뒤로 (←)">◀</button>
    <button id="bPlay" class="main" title="재생 / 정지 (Space)">▶ 재생</button>
    <button id="bNext" title="한 라운드 앞으로 (→)">▶</button>
    <button id="bEnd" title="끝으로">⏭</button>
    <input type="range" id="slider" min="0" max="1" value="0" step="1">
    <span id="rlabel">라운드 0</span>
    <select id="speed" title="재생 속도">
      <option value="1.5">느리게</option><option value="3" selected>보통</option><option value="6">빠르게</option><option value="15">아주 빠르게</option>
    </select>
    <select id="viewSel" title="누구의 눈으로 볼지">
      <option value="all">전체 보기</option><option value="0">붉은 원정대 시야</option><option value="1">푸른 원정대 시야</option>
    </select>
    <select id="mindSel" title="머릿속 보기">
      <option value="sel">머릿속: 선택 유닛</option><option value="team">머릿속: 팀 전체</option><option value="off">머릿속: 끔</option>
    </select>
    <label class="ck"><input type="checkbox" id="ckTrap" checked>숨은 구덩이</label>
  </footer>

function makeChar(kind, team) {

  const leg = (sx) => {
    const hip = new THREE.Group();
    hip.position.set(sx, 0.3, 0);
    body.add(hip);
    mesh(hip, RB(0.1, 0.28, 0.11), mDark, 0, -0.14, 0);
    mesh(hip, RB(0.11, 0.05, 0.16, 0.02), mBlack, 0, -0.28, 0.025);
    return hip;

  const hipL = leg(-0.075), hipR = leg(0.075);
  mesh(body, RB(G ? 0.3 : 0.28, 0.3, G ? 0.2 : 0.18, 0.05), G ? mLeather : mTeam, 0, 0.45, 0);
  if (G) mesh(body, RB(0.26, 0.2, 0.235, 0.03), mTeam, 0, 0.46, 0);          // 갑옷 위 팀 색 조끼
  mesh(body, RB(G ? 0.35 : 0.29, 0.04, G ? 0.23 : 0.19, 0.01), mBlack, 0, 0.31, 0);
  mesh(body, new THREE.SphereGeometry(0.11, 18, 14), mSkin, 0, 0.7, 0);
  mesh(body, new THREE.BoxGeometry(0.025, 0.035, 0.01), mBlack, -0.04, 0.72, 0.105, false);
  mesh(body, new THREE.BoxGeometry(0.025, 0.035, 0.01), mBlack, 0.04, 0.72, 0.105, false);

  const pips = [], flames = [];
  if (!G) {
    // 중절모
    mesh(body, new THREE.CylinderGeometry(0.2, 0.2, 0.018, 22), mLeather, 0, 0.78, 0);
    mesh(body, new THREE.CylinderGeometry(0.095, 0.118, 0.12, 18), mLeather, 0, 0.845, 0);

  g.add(hp);
  const seg = G ? 6 : 32;
  const disc = new THREE.Group();
  const fillD = new THREE.Mesh(new THREE.CircleGeometry(0.36, seg).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({color: T.c, transparent: true, opacity: 0.28, depthWrite: false}));
  const rimD = new THREE.Mesh(new THREE.RingGeometry(0.33, 0.4, seg).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({color: T.c, transparent: true, opacity: 0.95, depthWrite: false}));

}

  if (o._flash === k) return;
  o._flash = k;
  for (const m of o.flash) m.emissive.copy(m.userData.base).lerp(HITC, k);
}

function pose(o, st, a, now, id) {
  const {body, hipL, hipR, shL, shR} = o;
  hipL.rotation.set(0, 0, 0); hipR.rotation.set(0, 0, 0);
  shL.rotation.set(0, 0, 0); shR.rotation.set(0, 0, 0);
  body.position.set(0, 0, 0); body.rotation.set(0, 0, 0);
  if (o.kind === 'G') shL.rotation.x = -0.35;                    // 활을 낮게
  else shL.rotation.x = -0.6;                                    // 횃불을 앞으로
  if (st === 'walk') {
    const ph = a * Math.PI * 2, s = Math.sin(ph);
    hipL.rotation.x = s * 0.75; hipR.rotation.x = -s * 0.75;
    shL.rotation.x += -s * 0.55; shR.rotation.x = s * 0.55;
    body.position.y = Math.abs(Math.cos(ph)) * 0.05;
    body.rotation.x = 0.08;
  } else if (st === 'mine') {
    let t;
    if (a < 0.45) t = -2.7 * easeOut(a / 0.45);
    else if (a < 0.58) t = -2.7 + 2.3 * ((a - 0.45) / 0.13);
    else t = -0.4 * (1 - (a - 0.58) / 0.42);
    shR.rotation.x = t; shL.rotation.x = t * 0.8;
    body.rotation.x = a > 0.45 && a < 0.8 ? 0.22 : 0.05;
    hipL.rotation.x = 0.2; hipR.rotation.x = -0.25;
  } else if (st === 'attack') {
    const aim = a < 0.7 ? Math.min(1, a / 0.15) : 1 - (a - 0.7) / 0.3;
    shL.rotation.x = -1.5 * aim - 0.35 * (1 - aim);
    const draw = a < 0.18 ? a / 0.18 : a < 0.28 ? 1 : Math.max(0, 1 - (a - 0.28) / 0.1);
    shR.rotation.x = -1.45 * aim; shR.rotation.y = 0.9 * draw;
    body.rotation.y = -0.25 * aim;
    body.position.z = a > 0.28 && a < 0.45 ? -0.04 : 0;
    hipL.rotation.x = 0.3; hipR.rotation.x = -0.25;
  } else {                                                        // 숨쉬기
    const b = Math.sin(now * 2.2 + id);
    body.position.y = b * 0.012;
    shL.rotation.z += 0.05 + b * 0.03; shR.rotation.z = -0.05 - b * 0.03;
  }
}

// ---------------- 야영지 ----------------
function makeBase(t) {
  const T = TC[t], g = new THREE.Group();
  const stone = std(0x6b5a44, {roughness: 0.9}), cloth = std(T.c, {roughness: 0.75, side: THREE.DoubleSide}), dark = std(T.d, {roughness: 0.8});
  const wood = std(0x6a4522, {roughness: 0.85});
  mesh(g, new THREE.CylinderGeometry(0.5, 0.54, 0.08, 18), stone, 0, 0.04, 0);
  const tent = mesh(g, new THREE.ConeGeometry(0.42, 0.78, 4, 1, true), cloth, 0, 0.47, 0);
  tent.rotation.y = Math.PI / 4;
  mesh(g, new THREE.ConeGeometry(0.43, 0.2, 4, 1, true), dark, 0, 0.77, 0).rotation.y = Math.PI / 4;
  mesh(g, new THREE.PlaneGeometry(0.2, 0.32), std(0x120b05), 0, 0.24, 0.21, false).rotation.x = -0.5;
  mesh(g, new THREE.CylinderGeometry(0.014, 0.014, 0.5, 6), wood, 0, 1.0, 0);
  const flag = new THREE.Group();
  flag.position.set(0, 1.18, 0);
  g.add(flag);
  mesh(flag, new THREE.PlaneGeometry(0.3, 0.17), new THREE.MeshStandardMaterial({color: T.l, side: THREE.DoubleSide, emissive: T.c, emissiveIntensity: 0.35}), 0.15, 0, 0);
  // 모닥불
  const fire = new THREE.Group();
  fire.position.set(0.36, 0.08, 0.36);
  g.add(fire);
  for (let i = 0; i < 3; i++) { const l = mesh(fire, new THREE.CylinderGeometry(0.025, 0.025, 0.24, 6), wood, 0, 0.03, 0); l.rotation.set(Math.PI / 2, i * 1.05, 0); }
  for (let i = 0; i < 6; i++) mesh(fire, new THREE.DodecahedronGeometry(0.04), stone, Math.cos(i) * 0.13, 0.02, Math.sin(i) * 0.13);
  const core = new THREE.Group();
  fire.add(core);
  mesh(core, new THREE.ConeGeometry(0.08, 0.26, 10), new THREE.MeshBasicMaterial({color: 0xff7a1a}), 0, 0.16, 0, false);
  mesh(core, new THREE.ConeGeometry(0.05, 0.18, 8), new THREE.MeshBasicMaterial({color: 0xffe08a}), 0, 0.13, 0, false);
  const light = new THREE.PointLight(0xff9a40, 3, 4.5, 1.6);
  light.position.set(0, 0.35, 0);
  fire.add(light);
  // 금 더미
  const gm = std(0xffc63a, {emissive: 0x9a6400, emissiveIntensity: 0.8, metalness: 0.6, roughness: 0.3, flatShading: true});
  const pile = new THREE.Group();
  pile.position.set(-0.36, 0.08, 0.3);
  g.add(pile);
  for (let i = 0; i < 6; i++) mesh(pile, new THREE.DodecahedronGeometry(0.05), gm, (i % 3 - 1) * 0.06, 0.04 + Math.floor(i / 3) * 0.06, (i % 2) * 0.05, false);
  mesh(g, new THREE.BoxGeometry(0.16, 0.14, 0.16), wood, -0.38, 0.15, -0.3);
  const hp = hpBar(1.0);
  hp.position.y = 1.55;
  g.add(hp);
  g.traverse(o => { if (o.isMesh) o.receiveShadow = true; });
  return {g, core, flag, fire, light, tent, pile, hp, flash: [stone, cloth], team: t};
}

// ---------------- 맵 만들기 ----------------
function build() {
  if (typeof R === 'undefined' || !R) return;
  if (world) { scene.remove(world.root); world.root.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  evCache = new Map();
  const root = new THREE.Group();
  scene.add(root);
  const n = W * H, rows = R.map.rows;

  const ground = new THREE.InstancedMesh(new RoundedBoxGeometry(0.97, 0.24, 0.97, 2, 0.05), std(0xffffff, {roughness: 0.95, map: slabTex()}), n);
  ground.receiveShadow = true;
  const gBase = new Float32Array(n * 3);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, r = hash(x, y);
    COL.setHSL(0.08 + r * 0.03, 0.12 + r * 0.08, 0.16 + r * 0.07);
    gBase.set([COL.r, COL.g, COL.b], i * 3);
    M4.makeTranslation(wx(x), -0.12 - r * 0.025, wz(y));
    ground.setMatrixAt(i, M4);
    ground.setColorAt(i, COL);
  }
  root.add(ground);
  // 받침돌과 가장자리 석축
  const frameM = std(0x2a1e14, {roughness: 0.95});
  mesh(root, new THREE.BoxGeometry(W + 1.6, 2, 0.8), frameM, 0, -1.25, -H / 2 - 0.4, false);
  mesh(root, new THREE.BoxGeometry(W + 1.6, 2, 0.8), frameM, 0, -1.25, H / 2 + 0.4, false);
  mesh(root, new THREE.BoxGeometry(0.8, 2, H), frameM, -W / 2 - 0.4, -1.25, 0, false);
  mesh(root, new THREE.BoxGeometry(0.8, 2, H), frameM, W / 2 + 0.4, -1.25, 0, false);
  mesh(root, new THREE.PlaneGeometry(W, H).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({color: 0x000000}), 0, -2.2, 0, false);
  const curbM = std(0x5a4632, {roughness: 0.9});
  for (let i = -1; i <= W; i++) for (const j of [-1, H]) mesh(root, new RoundedBoxGeometry(0.96, 0.22 + hash(i, j) * 0.12, 0.6, 2, 0.04), curbM, wx(i), 0, wz(j) + (j < 0 ? 0.2 : -0.2));
  for (let j = 0; j < H; j++) for (const i of [-1, W]) mesh(root, new RoundedBoxGeometry(0.6, 0.22 + hash(i, j) * 0.12, 0.96, 2, 0.04), curbM, wx(i) + (i < 0 ? 0.2 : -0.2), 0, wz(j));
  // 네 모서리 화로 기둥
  const braziers = [];
  for (const [i, j] of [[-1, -1], [W, -1], [-1, H], [W, H]]) {
    const b = new THREE.Group();
    b.position.set(wx(i), 0, wz(j));
    mesh(b, new THREE.BoxGeometry(0.62, 0.3, 0.62), curbM, 0, 0.15, 0);
    mesh(b, new THREE.CylinderGeometry(0.17, 0.21, 1.5, 8), std(0x7d6648, {roughness: 0.85}), 0, 1.05, 0);
    mesh(b, new THREE.CylinderGeometry(0.3, 0.2, 0.18, 10), std(0x8a6a3a, {metalness: 0.6, roughness: 0.45}), 0, 1.88, 0);
    const fl = new THREE.Group();
    fl.position.y = 1.97;
    b.add(fl);
    mesh(fl, new THREE.ConeGeometry(0.2, 0.55, 10), new THREE.MeshBasicMaterial({color: 0xff7a1a}), 0, 0.22, 0, false);
    mesh(fl, new THREE.ConeGeometry(0.12, 0.36, 8), new THREE.MeshBasicMaterial({color: 0xffe08a}), 0, 0.16, 0, false);
    const L = new THREE.PointLight(0xff9a40, 9, 14, 1.4);
    L.position.y = 2.3;
    b.add(L);
    root.add(b);
    braziers.push({fl, L});
  }

  const wallCells = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (rows[y][x] === '#') wallCells.push([x, y]);
  const nW = Math.max(1, wallCells.length);
  const wall = new THREE.InstancedMesh(new RoundedBoxGeometry(0.9, 1, 0.9, 2, 0.05), std(0xffffff, {roughness: 0.9, map: brickTex()}), nW);
  const cap = new THREE.InstancedMesh(new RoundedBoxGeometry(1, 0.14, 1, 2, 0.04), std(0xffffff, {roughness: 0.85, map: slabTex()}), nW);
  wall.castShadow = cap.castShadow = true; wall.receiveShadow = cap.receiveShadow = true;
  const wBase = new Float32Array(wallCells.length * 3), cBase = new Float32Array(wallCells.length * 3);
  wallCells.forEach(([x, y], k) => {
    const r = hash(x, y), ruin = hash(y + 17, x + 3) < 0.25, h = ruin ? 0.35 + r * 0.3 : 0.85 + r * 0.6;
    const rot = Q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), (r - 0.5) * (ruin ? 0.6 : 0.12));
    COL.setHSL(0.08 + r * 0.02, 0.1, 0.45 + r * 0.15);
    wBase.set([COL.r, COL.g, COL.b], k * 3);
    M4.compose(V3.set(wx(x), h / 2, wz(y)), rot, S3.set(1, h, 1));
    wall.setMatrixAt(k, M4); wall.setColorAt(k, COL);
    COL.setHSL(0.09 + r * 0.02, 0.12, 0.55 + r * 0.12);
    cBase.set([COL.r, COL.g, COL.b], k * 3);
    M4.compose(V3.set(wx(x) + (ruin ? (r - 0.5) * 0.2 : 0), h + 0.05, wz(y)), rot, S3.set(ruin ? 0.8 : 1, 1, ruin ? 0.8 : 1));
    cap.setMatrixAt(k, M4); cap.setColorAt(k, COL);
  });
  wall.count = cap.count = wallCells.length;
  root.add(wall, cap);
  // 무너진 돌 조각: 벽 칸 둘레 (안개 때 그 칸 색을 따른다)
  const rubCells = [];
  const rubble = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), std(0xffffff, {roughness: 0.95, flatShading: true, map: brickTex()}), Math.max(1, wallCells.length * 3));
  rubble.castShadow = true; rubble.receiveShadow = true;
  const rBase = [];
  wallCells.forEach(([x, y]) => {
    const m = 1 + Math.floor(hash(x * 3, y * 5) * 3);
    for (let k = 0; k < m; k++) {
      const a = hash(x + k * 7, y) * Math.PI * 2, d = 0.38 + hash(x, y + k * 3) * 0.12, sc = 0.07 + hash(x + k, y + k) * 0.09;
      M4.compose(V3.set(wx(x) + Math.cos(a) * d, sc * 0.5, wz(y) + Math.sin(a) * d),
        Q.setFromEuler(new THREE.Euler(a, a * 2, k)), S3.set(sc * 1.3, sc * 0.8, sc));
      const i = rubCells.length;
      rubble.setMatrixAt(i, M4);
      const v = 0.5 + hash(k, x * y) * 0.3; COL.setRGB(v, v * 0.92, v * 0.85); rubble.setColorAt(i, COL);
      rBase.push(v); rubCells.push(y * W + x);
    }
  });
  rubble.count = rubCells.length;
  root.add(rubble);
  // 동굴 벽: 맵을 둘러싼 큰 바위와 종유석
  const rocks = [], spikes = [];
  const pad = 2.2, perim = (x0, z0, x1, z1, step) => { const pts = []; for (let x = x0; x <= x1; x += step) pts.push([x, z0], [x, z1]); for (let z = z0 + step; z < z1; z += step) pts.push([x0, z], [x1, z]); return pts; };
  perim(-W / 2 - pad, -H / 2 - pad, W / 2 + pad, H / 2 + pad, 1.5).forEach(([x, z], i) => rocks.push([x, z, i, 0]));
  perim(-W / 2 - pad - 2.5, -H / 2 - pad - 2.5, W / 2 + pad + 2.5, H / 2 + pad + 2.5, 2.2).forEach(([x, z], i) => rocks.push([x, z, i + 500, 1]));
  const rockM = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), std(0xffffff, {roughness: 0.95, flatShading: true, map: brickTex()}), rocks.length);
  rocks.forEach(([x, z, i, ring], k) => {
    const h = hash(i, 3), sx = 1.1 + hash(i, 7) * 1.2, sy = (ring ? 2.6 : 1.2) + h * (ring ? 3.2 : 1.6);
    M4.compose(V3.set(x + (hash(i, 9) - 0.5) * 0.8, sy * 0.35 - 0.3, z + (hash(i, 11) - 0.5) * 0.8), Q.setFromEuler(new THREE.Euler(h, i, h * 2)), S3.set(sx, sy, sx * (0.8 + h * 0.4)));
    rockM.setMatrixAt(k, M4);
    const v = 0.16 + hash(i, 13) * 0.1; COL.setRGB(v, v * 0.85, v * 0.7); rockM.setColorAt(k, COL);
    if (hash(i, 17) < 0.35) spikes.push([x + (hash(i, 19) - 0.5) * 1.4, z + (hash(i, 23) - 0.5) * 1.4, i]);
  });
  rockM.castShadow = true; rockM.receiveShadow = true;
  const spikeM = new THREE.InstancedMesh(new THREE.ConeGeometry(0.35, 1, 6), std(0x4a3a2a, {roughness: 0.9, flatShading: true}), Math.max(1, spikes.length));
  spikes.forEach(([x, z, i], k) => { const h = 1.2 + hash(i, 29) * 2.4; M4.compose(V3.set(x, h / 2 - 0.1, z), Q.identity(), S3.set(0.6 + hash(i, 31) * 0.6, h, 0.6 + hash(i, 31) * 0.6)); spikeM.setMatrixAt(k, M4); });
  spikeM.count = spikes.length;
  root.add(rockM, spikeM);
  // 바위 바닥 (맵 바깥)
  mesh(root, new THREE.PlaneGeometry(W + 30, H + 30).rotateX(-Math.PI / 2), std(0x1c1610, {roughness: 1}), 0, -0.26, 0, false).receiveShadow = true;
  // 횃불 빛: 화면 가운데에 가까운 탐험가 6명의 횃불이 주변을 밝힌다 (빛 수를 고정해 셰이더를 다시 만들지 않는다)
  const torchL = [];
  for (let i = 0; i < 6; i++) { const L = new THREE.PointLight(0xff9a40, 0, 4.2, 1.5); root.add(L); torchL.push(L); }
  // 떠다니는 먼지
  const DN = 420, dpos = new Float32Array(DN * 3), dseed = new Float32Array(DN);
  for (let i = 0; i < DN; i++) { dpos.set([(hash(i, 41) - 0.5) * (W + 4), hash(i, 43) * 3.2, (hash(i, 47) - 0.5) * (H + 4)], i * 3); dseed[i] = hash(i, 53) * 100; }
  const dgeo = new THREE.BufferGeometry(); dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
  const dust = new THREE.Points(dgeo, new THREE.PointsMaterial({size: 0.07, map: softTex(), color: 0xffd9a0, transparent: true, opacity: 0.45, depthWrite: false, blending: THREE.AdditiveBlending}));
  dust.userData = {base: dpos.slice(), seed: dseed};
  root.add(dust);

  // 금맥
  const oreMat = std(0xffc63a, {emissive: 0xd08a00, emissiveIntensity: 0.9, metalness: 0.8, roughness: 0.22, flatShading: true});
  const veinMat = new THREE.MeshBasicMaterial({color: 0xffd25a});
  const rockMat = std(0x3a2f26, {roughness: 0.9, flatShading: true});
  const rockG = new THREE.DodecahedronGeometry(0.34, 0), nug = new THREE.OctahedronGeometry(0.11, 0);
  const glowMat = new THREE.MeshBasicMaterial({map: softTex(), color: 0xffb030, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending});
  const glowG = new THREE.PlaneGeometry(1.25, 1.25).rotateX(-Math.PI / 2);
  const ore = new Map();
  for (const [x, y] of R.map.ore) {
    const grp = new THREE.Group(), cs = [], h0 = hash(x, y);
    const glow = mesh(grp, glowG, glowMat.clone(), 0, 0.02, 0, false); glow.renderOrder = 1;
    const rock = mesh(grp, rockG, rockMat, 0, 0.1, 0);
    rock.scale.set(1.15, 0.6, 1.0); rock.rotation.set(h0, h0 * 6, 0);
    const r2 = mesh(grp, rockG, rockMat, 0.22, 0.05, -0.18); r2.scale.set(0.55, 0.4, 0.5); r2.rotation.y = h0 * 3;
    for (let k = 0; k < 3; k++) {                 // 바위 위를 가로지르는 금줄기
      const v = mesh(grp, new THREE.BoxGeometry(0.5, 0.025, 0.035), veinMat, (hash(x + k, y) - 0.5) * 0.2, 0.2 + k * 0.03, (k - 1) * 0.14, false);
      v.rotation.set(0, hash(x, y + k) * 3, (hash(y, x + k) - 0.5) * 0.6);
    }
    for (let k = 0; k < 7; k++) {                 // 튀어나온 금덩이 (남은 양만큼 보임)
      const t = k / 7 * Math.PI * 2 + h0 * 6, rr = 0.12 + hash(x + k, y + 3) * 0.2, sz = 0.7 + hash(x, y + k) * 0.7;
      const c = mesh(grp, nug, oreMat, Math.cos(t) * rr, 0.2 + hash(k, x) * 0.12, Math.sin(t) * rr);
      c.scale.set(sz, sz * 1.6, sz); c.rotation.set((hash(x + k, y) - 0.5) * 1.2, t, (hash(y, x + k) - 0.5) * 1.2);
      cs.push(c);
    }
    const glint = new THREE.Sprite(new THREE.SpriteMaterial({map: starTex(), color: 0xfff6d0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending}));
    glint.position.set(0.1, 0.5, 0.05);
    grp.add(glint);
    grp.position.set(wx(x), 0, wz(y));
    const lbl = new THREE.Sprite(new THREE.SpriteMaterial({transparent: true, depthTest: false, sizeAttenuation: false}));
    lbl.position.set(0, 0.8, 0); lbl.scale.set(0.045, 0.0235, 1); lbl.renderOrder = 14; lbl.material.opacity = 0.8;
    grp.add(lbl);
    grp.userData.cs = cs; grp.userData.glint = glint; grp.userData.glow = glow; grp.userData.lbl = lbl;
    root.add(grp);
    ore.set(x + ',' + y, grp);
  }

  // 구덩이
  const traps = new Map();
  const ringGeo = new THREE.RingGeometry(0.25, 0.29, 28).rotateX(-Math.PI / 2);
  const shaftG = new THREE.CylinderGeometry(0.69, 0.6, 2.1, 4, 1, true).rotateY(Math.PI / 4);
  const shaftM = new THREE.MeshBasicMaterial({map: shaftTex(), side: THREE.BackSide});
  const rimM = std(0x4a3a28, {roughness: 0.95});
  for (const [x, y] of R.map.traps) {
    const hidden = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color: 0xc0483a, transparent: true, opacity: 0.3, depthWrite: false}));
    hidden.position.set(wx(x), 0.012, wz(y));
    const rev = new THREE.Group();
    rev.position.set(wx(x), 0, wz(y));
    mesh(rev, shaftG, shaftM, 0, -1.05, 0, false);
    mesh(rev, new THREE.PlaneGeometry(0.96, 0.96).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({color: 0x000000}), 0, -2.08, 0, false);
    for (let i = 0; i < 4; i++) {                 // 갱도 입구의 무너진 돌
      const a = i * Math.PI / 2, h = hash(x + i, y + 7);
      const lip = mesh(rev, new THREE.BoxGeometry(0.96, 0.06, 0.08), rimM, Math.sin(a) * 0.46, -0.02 - h * 0.04, Math.cos(a) * 0.46);
      lip.rotation.y = a; lip.rotation.z = (h - 0.5) * 0.15;
      const ch = mesh(rev, new THREE.DodecahedronGeometry(0.05 + h * 0.04), rimM, Math.sin(a + 0.6) * 0.5, 0.01, Math.cos(a + 0.6) * 0.5);
      ch.scale.y = 0.55; ch.rotation.set(i, h * 6, 0);
    }
    root.add(hidden, rev);
    traps.set(x + ',' + y, {hidden, rev, gi: y * W + x, gy: -0.12 - hash(x, y) * 0.025});
  }

  // 야영지
  const bases = R.map.bases.map(([x, y], t) => {
    const b = makeBase(t);
    b.g.position.set(wx(x), 0, wz(y));
    b.g.rotation.y = Math.atan2(W / 2 - 0.5 - x, H / 2 - 0.5 - y);
    root.add(b.g);
    return b;
  });

  // 머릿속 표시
  const mind = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.86, 0.86).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({transparent: true, opacity: 0.5, depthWrite: false}), 3000);
  mind.count = 0; mind.renderOrder = 3;
  mind.setColorAt(0, COL.set(0xffffff));
  root.add(mind);
  const paths = new THREE.Group();
  root.add(paths);

  const s0 = Math.max(W, H);
  const sel = new THREE.Mesh(new THREE.RingGeometry(0.4, 0.48, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({color: 0xffe2a0, transparent: true, depthWrite: false}));
  sel.position.y = 0.02;
  root.add(sel);

  world = {revN: -1, root, ground, gBase, wall, cap, wallCells, wBase, cBase, braziers, rubble, rubCells, rBase, torchL, dust, ore, traps, bases, mind, paths, sel, units: new Map(), fogKey: '', mindKey: ''};

      burst(wx(x), wz(y), 0.05, 16, 0xa88a60, q, 1.6, id * 17 + g, -1.2, 1.6);
    } else if (k === 'die') {
      const [id, x, y, cause] = [e[1], e[2], e[3], e[4]];
      if (!canSee(x, y)) continue;
      const bi = baseIdx(id);
      if (bi >= 0) {
        const m = fx('flash', () => new THREE.Mesh(sphG, addMat(0xff8030)));
        m.position.set(wx(x), 0.6, wz(y)); m.scale.setScalar(0.3 + easeOut(a) * 2); m.material.opacity = 1 - a;
        m.material.color.setHex(TC[bi].c);
        burst(wx(x), wz(y), 0.5, 40, 0xffd080, a, 5, id + g, 6, 2);
      } else if (cause === 'atk' && a > 0.5) {
        burst(wx(x), wz(y), 0.3, 12, 0xd8dce6, (a - 0.5) * 2, 1.4, id * 13 + g, 3, 1);
      }
    } else if (k === 'mine') {
      const [, id, x, y] = e;
      if (!canSee(x, y) || a < 0.5) continue;
      burst(wx(x), wz(y), 0.15, 7, 0xffd84a, (a - 0.5) * 2, 1.6, id * 7 + g, 5, 0.8);
    } else if (k === 'dlv') {
      const [, id, amt, x, y] = e;
      if (!canSee(x, y)) continue;
      const s = textSprite('+' + amt, '#ffd978');
      s.position.set(wx(x), 1.1 + a * 0.9, wz(y)); s.scale.set(0.9, 0.45, 1); s.material.opacity = 1 - a * a;
    } else if (k === 'spawn') {
      const [, id, t, kd, x, y] = e;
      if (!canSee(x, y)) continue;
      const m = fx('pillar', () => new THREE.Mesh(pillarG, addMat(0xffffff)));
      m.position.set(wx(x), 1.1, wz(y)); m.material.color.setHex(TC[t].c); m.material.opacity = 0.7 * (1 - a);
      m.scale.set(1 - a * 0.6, 1, 1 - a * 0.6);
      ring(wx(x), wz(y), 0.03, 0.3 + a * 0.4, TC[t].l, 1 - a);
    }
  }
}

const TP = new THREE.Vector3();
function torches(now) {
  const list = [];
  for (const o of world.units.values()) if (o.g.visible && o.flames.length) { o.flames[0].getWorldPosition(TP); list.push([TP.distanceToSquared(controls.target), TP.clone(), o]); }
  list.sort((p, q) => p[0] - q[0]);
  world.torchL.forEach((L, i) => {
    if (i < list.length) { L.position.copy(list[i][1]); L.intensity = 2.4 + Math.sin(now * 13 + i * 2) * 0.35 + Math.sin(now * 23 + i) * 0.2; }
    else L.intensity = 0;
  });
  const d = world.dust, pos = d.geometry.attributes.position, b = d.userData.base, sd = d.userData.seed;
  for (let i = 0; i < sd.length; i++) {
    const t = now * 0.12 + sd[i];
    pos.array[i * 3] = b[i * 3] + Math.sin(t * 1.3) * 0.6;
    pos.array[i * 3 + 1] = (b[i * 3 + 1] + now * 0.05 + Math.sin(t) * 0.2) % 3.2;
    pos.array[i * 3 + 2] = b[i * 3 + 2] + Math.cos(t * 1.1) * 0.6;
  }
  pos.needsUpdate = true;
}

// ---------------- 한 장면 그리기 ----------------
function frame(f, g, a, fi, team, vis, seen) {
  if (!world) build();
  if (!world) return;
  const now = performance.now() / 1000, moving = g !== f;
  const canSee = (x, y) => !vis || vis[y * W + x] === 1;
  fxBegin();
  applyFog(fi, team, vis, seen);
  updateStatic(fi, team, seen, now);
  updateBases(fi, g, a, moving, seen, vis, now);
  updateUnits(f, g, a, fi, team, vis, now);
  updateMind(fi, team);
  torches(now);
  if (moving) effects(g, a, canSee);
  // 선택 고리
  let sx = null, sy = null;
  if (selId != null) {
    const bi = R.map.base_ids.indexOf(selId);
    if (bi >= 0) [sx, sy] = R.map.bases[bi];
    else { const o = world.units.get(selId); if (o && o.g.visible) { sx = o.x; sy = o.y; } }
  }
  world.sel.visible = sx !== null;
  if (sx !== null) {
    world.sel.position.set(wx(sx), 0.02, wz(sy));
    world.sel.material.opacity = 0.6 + 0.4 * Math.sin(now * 5);
    world.sel.scale.setScalar(selId === R.map.base_ids[0] || selId === R.map.base_ids[1] ? 1.25 : 1);
  }
  // 관전 카메라: 싸움 · 사고가 난 곳을 부드럽게 따라간다
  if (spect) spectate(g);
  controls.update();
  // 화면 흔들림: 큰 사건 (구덩이 추락 · 처치 · 야영지 피격) 때 잠깐
  let amp = 0;
  if (moving && a > 0.35) {
    const k = Math.pow(1 - (a - 0.35) / 0.65, 2);
    for (const e of evOf(g).list) {
      if (e[0] === 'trap' && canSee(e[2], e[3])) amp = Math.max(amp, 0.16 * k);
      else if (e[0] === 'die' && e[4] === 'atk' && canSee(e[2], e[3])) amp = Math.max(amp, 0.08 * k);
      else if (e[0] === 'atk' && R.map.base_ids.includes(e[6]) && canSee(e[4], e[5])) amp = Math.max(amp, 0.05 * k);
    }
  }
  amp *= Math.min(1.5, camera.position.distanceTo(controls.target) / 12);
  if (amp > 0.001) {
    SH.set(Math.sin(now * 61) * amp, Math.sin(now * 47 + 1) * amp * 0.6, Math.cos(now * 53) * amp);
    camera.position.add(SH); composer.render(); camera.position.sub(SH);
  } else composer.render();
}

const SH = new THREE.Vector3(), FOC = new THREE.Vector3(), OFF = new THREE.Vector3();
let spect = false, focusPt = null, focusT = 0;
function setSpectate(on) { spect = on; focusPt = null; }
function spectate(g) {
  const now = performance.now() / 1000;
  let sx = 0, sz = 0, n = 0;
  for (const e of evOf(g).list) {                       // 이번 라운드의 사건 자리
    if (e[0] === 'atk') { sx += wx(e[4]) + wx(e[2]); sz += wz(e[5]) + wz(e[3]); n += 2; }
    else if (e[0] === 'trap' || e[0] === 'die') { sx += wx(e[2]) * 3; sz += wz(e[3]) * 3; n += 3; }
  }
  if (n) { focusPt = [sx / n, sz / n]; focusT = now; }
  else if (!focusPt || now - focusT > 2.5) {              // 사건이 없으면 적과 가까이 있는 유닛들 가운데
    const us = F[g].u; let bx = 0, bz = 0, m = 0;
    for (const u of us) for (const v of us) {
      if (u[1] !== v[1] && Math.max(Math.abs(u[3] - v[3]), Math.abs(u[4] - v[4])) <= 4) { bx += wx(u[3]); bz += wz(u[4]); m++; break; }
    }
    if (m) focusPt = [bx / m, bz / m];
    else { let cx = 0, cz = 0; for (const u of us) { cx += wx(u[3]); cz += wz(u[4]); } focusPt = us.length ? [cx / us.length, cz / us.length] : [0, 0]; }
    focusT = now;
  }
  FOC.set(focusPt[0], 0, focusPt[1]);
  OFF.copy(camera.position).sub(controls.target);
  const len = OFF.length();
  OFF.multiplyScalar((len + (13 - len) * 0.03) / len);
  controls.target.lerp(FOC, 0.04);
  camera.position.copy(controls.target).add(OFF);
}

// ---------------- 누르기 · 가리키기 ----------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitP = new THREE.Vector3();
function cellOf(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(plane, hitP)) return null;
  return [Math.floor(hitP.x + W / 2), Math.floor(hitP.z + H / 2)];
}
let down = null;
renderer.domElement.addEventListener('pointerdown', ev => { down = [ev.clientX, ev.clientY]; });
controls.addEventListener('start', () => { if (spect) { spect = false; if (window.onSpectateOff) window.onSpectateOff(); } });
renderer.domElement.addEventListener('pointerup', ev => {
  if (down && Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) < 5) { const c = cellOf(ev); if (c) selectCell(c[0], c[1]); }
  down = null;
});
renderer.domElement.addEventListener('pointermove', ev => { const c = cellOf(ev); if (c) hoverCell(c[0], c[1]); });

function focus(x, y, d) {
  controls.target.set(wx(x), 0, wz(y));
  camera.position.set(wx(x), d * 0.75, wz(y) + d * 0.65);
  controls.update();
}

window.View3D = {build, frame, resize, resetCam, focus, setSpectate};
if (window.onView3DReady) window.onView3DReady();

</script>
</body>
